# Render Blueprint for the standalone YouTube ingestion worker (M3 Slice 12
# Gate #2B). Deploys only worker/youtube-ingestion/ -- the LexReader Next.js
# app itself is deployed separately on Vercel, unaffected by this file.
services:
  - name: lexreader-youtube-worker
    type: web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./worker/youtube-ingestion/Dockerfile
    dockerContext: ./worker/youtube-ingestion
    healthCheckPath: /health
    envVars:
      - key: WORKER_SHARED_SECRET
        sync: false
      - key: PORT
        value: 10000
      - key: WHISPER_MODEL
        value: tiny
