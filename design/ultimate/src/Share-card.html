<!--meta {"title":"Карточка для шаринга"}-->
<style>
.prev{width:236px;margin:0 auto;aspect-ratio:4/5;border-radius:28px;background:var(--fill-leaf);color:#fff;box-shadow:inset 0 -6px 0 var(--fill-leaf-edge),var(--shadow-2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:22px 18px 20px;text-align:center}
.prev .big{font:700 64px/1 var(--font-display)}
.prev .wk{display:flex;gap:6px}.prev .wk i{width:22px;height:22px;border-radius:50%;background:var(--gold-400);display:flex;align-items:center;justify-content:center;color:var(--fill-leaf-edge)}
.prev .wk i.no{background:rgba(255,255,255,.25)}
.mini{width:104px;display:flex;flex-direction:column;gap:6px;align-items:center;font:700 13px/1.2 var(--font-body);padding:6px;border-radius:var(--r-md);border:2px solid transparent}
.mini.on{border-color:var(--green-400);background:var(--green-100)}
.mini .th{width:88px;height:110px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 22px/1 var(--font-display)}
.mini .th small{font:700 11px/1 var(--font-body)}
</style>
<div class="app">
<header class="hdr">
  <a class="iconbtn" href="Progress.dc.html" aria-label="Назад"><i class="ic ic-back s24"></i></a>
  <div class="ttl">Поделиться<small>картинка 1080 × 1350</small></div>
  <span class="gap"></span>
</header>
<main class="body">
  <figure class="prev" role="img" aria-label="Превью: 12 дней подряд, Сергей, LexReader" style="margin-top:2px">
    <div class="rowx s6 b sm"><i class="ic ic-leaf s18"></i>LexReader</div>
    <i class="lex joy pale s56 bob" aria-hidden="true"></i>
    <div>
      <div class="big">12</div>
      <div class="h3" style="margin-top:4px">дней подряд</div>
      <div class="xs" style="margin-top:4px">Сергей учит английский по книгам</div>
    </div>
    <div class="wk" aria-hidden="true"><i><i class="ic ic-check s14"></i></i><i><i class="ic ic-check s14"></i></i><i><i class="ic ic-check s14"></i></i><i><i class="ic ic-check s14"></i></i><i><i class="ic ic-check s14"></i></i><i><i class="ic ic-check s14"></i></i><i class="no"></i></div>
  </figure>

  <div class="sect"><p class="eyebrow">Вариант карточки</p></div>
  <div class="hscroll" role="radiogroup">
    <button class="mini on" role="radio" aria-checked="true" style="background:var(--green-100)"><span class="th fill-leaf">12<small>дней</small></span>Стрик</button>
    <button class="mini" role="radio" aria-checked="false" style="background:none"><span class="th fill-sky">310<small>XP за неделю</small></span>Неделя</button>
    <button class="mini" role="radio" aria-checked="false" style="background:none"><span class="th fill-sun">7<small>уровень</small></span>Уровень</button>
    <button class="mini" role="radio" aria-checked="false" style="background:none"><span class="th fill-ember">842<small>слова</small></span>Слова</button>
  </div>

  <div class="list">
    <button class="row" role="switch" aria-checked="true" style="width:100%;border:0;background:none;text-align:left;cursor:pointer"><div class="f1"><div class="t">Показывать имя</div><div class="s">«Сергей» на картинке</div></div><span class="toggle on" aria-hidden="true"></span></button>
  </div>
</main>
<footer class="dock">
  <a class="btn b-leaf" href="Progress.dc.html"><i class="ic ic-share2"></i>Поделиться</a>
  <button class="btn b-ghost sm"><i class="ic ic-download s18"></i>Скачать PNG</button>
</footer>
</div>
