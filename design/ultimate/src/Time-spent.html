<!--meta {"title":"Время обучения"}-->
<style>
.chart{width:100%;height:auto;display:block;font-family:var(--font-body)}
.dot{width:12px;height:12px;border-radius:4px;flex:none;display:inline-block}
</style>
<div class="app">
<header class="hdr">
  <a class="iconbtn" href="Progress.dc.html" aria-label="Назад"><i class="ic ic-back s24"></i></a>
  <div class="ttl">Время обучения<small>10–16 ноября</small></div>
  <span class="gap"></span>
</header>
<main class="body">
  <div class="seg" role="tablist"><button class="on" role="tab" aria-selected="true">Неделя</button><button role="tab" aria-selected="false">Месяц</button><button role="tab" aria-selected="false">Всё время</button></div>
  <section class="card">
    <div class="rowx between" style="align-items:flex-end">
      <div><p class="eyebrow">Всего за неделю</p><div class="rowx s6" style="align-items:baseline;margin-top:4px"><b class="num xl">96</b><span class="h3">мин</span></div></div>
      <div class="right"><span class="badge green"><i class="ic ic-arrow-up s14"></i>+14 мин</span><div class="xs faint" style="margin-top:4px">к прошлой неделе</div></div>
    </div>
    <div class="rowx" style="gap:16px;margin-top:12px">
      <svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Распределение времени: чтение 38 мин (40%), занятия 31, карточки 18, видео 9">
<circle cx="70" cy="70" r="54" fill="none" stroke="var(--progress-track)" stroke-width="20"/>
<circle cx="70" cy="70" r="54" fill="none" stroke="var(--blue-400)" stroke-width="20" stroke-dasharray="131.30 207.99" stroke-dashoffset="0.00" transform="rotate(-90 70 70)"/>
<circle cx="70" cy="70" r="54" fill="none" stroke="var(--green-400)" stroke-width="20" stroke-dasharray="106.56 232.73" stroke-dashoffset="-134.30" transform="rotate(-90 70 70)"/>
<circle cx="70" cy="70" r="54" fill="none" stroke="var(--gold-500)" stroke-width="20" stroke-dasharray="60.62 278.67" stroke-dashoffset="-243.87" transform="rotate(-90 70 70)"/>
<circle cx="70" cy="70" r="54" fill="none" stroke="var(--orange-600)" stroke-width="20" stroke-dasharray="28.81 310.48" stroke-dashoffset="-307.48" transform="rotate(-90 70 70)"/>
<text x="70" y="72" text-anchor="middle" font-family="var(--font-display)" font-weight="700" font-size="21" fill="var(--text-1)">40%</text><text x="70" y="92" text-anchor="middle" font-size="13" fill="var(--text-3)" font-family="var(--font-body)">чтение</text>
      </svg>
      <div class="stack s8 f1">
<div class="rowx s8"><i class="dot" style="background:var(--blue-400)"></i><span class="f1 sm b">Чтение</span><span class="sm muted">38 мин</span></div>
<div class="rowx s8"><i class="dot" style="background:var(--green-400)"></i><span class="f1 sm b">Занятия</span><span class="sm muted">31 мин</span></div>
<div class="rowx s8"><i class="dot" style="background:var(--gold-500)"></i><span class="f1 sm b">Карточки</span><span class="sm muted">18 мин</span></div>
<div class="rowx s8"><i class="dot" style="background:var(--orange-600)"></i><span class="f1 sm b">Видео</span><span class="sm muted">9 мин</span></div>
      </div>
    </div>
  </section>
  <section class="card">
    <div class="rowx between"><b class="sm">Минуты по дням</b><span class="xs faint">≈ 14 мин в день</span></div>
    <svg class="chart" viewBox="0 0 326 130" role="img" aria-label="Минуты по дням: пн 12, вт 16, ср 9, чт 4, пт 18, сб 15, вс 22" style="margin-top:8px">
<rect x="13.7" y="58.9" width="26" height="49.1" rx="6" fill="var(--blue-100)"/>
<text x="26.7" y="53.9" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text-2)">12</text>
<text x="26.7" y="126" text-anchor="middle" font-size="12" fill="var(--text-3)">Пн</text>
<rect x="59.1" y="42.5" width="26" height="65.5" rx="6" fill="var(--blue-100)"/>
<text x="72.1" y="37.5" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text-2)">16</text>
<text x="72.1" y="126" text-anchor="middle" font-size="12" fill="var(--text-3)">Вт</text>
<rect x="104.6" y="71.2" width="26" height="36.8" rx="6" fill="var(--blue-100)"/>
<text x="117.6" y="66.2" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text-2)">9</text>
<text x="117.6" y="126" text-anchor="middle" font-size="12" fill="var(--text-3)">Ср</text>
<rect x="150.0" y="91.6" width="26" height="16.4" rx="6" fill="var(--blue-100)"/>
<text x="163.0" y="86.6" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text-2)">4</text>
<text x="163.0" y="126" text-anchor="middle" font-size="12" fill="var(--text-3)">Чт</text>
<rect x="195.4" y="34.4" width="26" height="73.6" rx="6" fill="var(--blue-100)"/>
<text x="208.4" y="29.4" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text-2)">18</text>
<text x="208.4" y="126" text-anchor="middle" font-size="12" fill="var(--text-3)">Пт</text>
<rect x="240.9" y="46.6" width="26" height="61.4" rx="6" fill="var(--blue-100)"/>
<text x="253.9" y="41.6" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text-2)">15</text>
<text x="253.9" y="126" text-anchor="middle" font-size="12" fill="var(--text-3)">Сб</text>
<rect x="286.3" y="18.0" width="26" height="90.0" rx="6" fill="var(--blue-400)"/>
<text x="299.3" y="13.0" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text-1)">22</text>
<text x="299.3" y="126" text-anchor="middle" font-size="12" fill="var(--text-3)">Вс</text>
<line x1="0" x2="326" y1="108" y2="108" stroke="var(--progress-track)" stroke-width="1.5"/>
    </svg>
  </section>
  <section class="card t-gold rowx top" style="gap:12px">
    <span class="sw s-gold"><i class="ic ic-moon"></i></span>
    <div class="f1"><div class="xs b c-gold">Самое продуктивное время</div><div class="h2" style="margin-top:2px">21:00–22:00</div><div class="sm muted" style="margin-top:2px">В это время точность 91% против 82% утром. Напоминание стоит на 20:30.</div>
    <a class="linkc" href="Notification-settings.dc.html" style="margin-top:10px">Настроить напоминания</a></div>
  </section>
</main>
</div>
