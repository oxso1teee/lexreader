<!--meta {"title":"Дуэль — раунд"}-->
<style>
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.score .pl{display:flex;align-items:center;gap:10px}
.score .pl.r{flex-direction:row-reverse;text-align:right}
.score .sc{font:700 34px/1 var(--font-display);font-variant-numeric:tabular-nums}
.rounds{display:flex;gap:5px;justify-content:center}
.rounds i{width:22px;height:8px;border-radius:4px;background:var(--progress-track)}
.rounds i.w{background:var(--green-400)}.rounds i.l{background:var(--blue-400)}.rounds i.cur{background:var(--orange-600);width:30px}
.q{text-align:center;padding:22px 16px}
.ans{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:var(--r-full);background:var(--blue-100);font:700 13px/1 var(--font-body);color:var(--blue-text)}
</style>
<div class="app">
<header class="lessonbar">
  <a class="iconbtn" href="Quit-confirm.dc.html" aria-label="Выйти из дуэли"><i class="ic ic-close s24"></i></a>
  <div class="f1 center b">Раунд 4 из 10</div>
  <span class="gap" style="width:44px"></span>
</header>
<main class="body" style="padding-top:4px">
  <section class="card score">
    <div class="pl"><span class="avatar me">С</span><div><div class="xs faint b">Ты</div><div class="sc c-green">3</div></div></div>
    <span class="b faint">:</span>
    <div class="pl r"><span class="avatar a1">А</span><div><div class="xs faint b">Аня</div><div class="sc c-blue">2</div></div></div>
  </section>
  <div class="rounds" role="img" aria-label="Раунд 4 из 10: в трёх сыгранных у тебя 3 верных, у Ани 2"><i class="w"></i><i class="l"></i><i class="w"></i><i class="cur"></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <div class="rowx s8">
    <i class="ic ic-timer c-orange"></i>
    <div class="bar lg ember" style="flex:1" role="progressbar" aria-valuenow="7" aria-valuemax="10" aria-label="Осталось 7 секунд"><i style="width:70%"></i></div>
    <span class="mono b c-orange">00:07</span>
  </div>

  <section class="card q grow" style="display:flex;flex-direction:column;justify-content:center">
    <p class="eyebrow">Выбери перевод</p>
    <div class="h1" style="margin-top:10px;font-size:26px">Как перевести<br>«тщательно»?</div>
    <div style="margin-top:14px"><span class="ans"><span class="avatar a1 sm">А</span>Аня уже ответила</span></div>
  </section>

  <div class="stack s8">
    <button class="opt"><span class="k">1</span><span class="en">reluctantly</span></button>
    <button class="opt on"><span class="k">2</span><span class="en">thoroughly</span><i class="ic ic-check-circle c-blue mla"></i></button>
    <button class="opt"><span class="k">3</span><span class="en">restlessly</span></button>
    <button class="opt"><span class="k">4</span><span class="en">briefly</span></button>
  </div>
  <p class="center xs faint" style="margin:0">Очко за каждый верный ответ. При равном счёте побеждает тот, кто отвечал быстрее.</p>
</main>
</div>
