<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Занятие: выбор ответа</title></head>
<body>
<x-dc>
<helmet>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
<style>
body{margin:0;background:var(--paper-200)}
a{color:var(--green-500)}a:hover{color:var(--green-text)}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:var(--paper-50);color:var(--ink-900);font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-leaf{--f:var(--fill-leaf);--e:var(--fill-leaf-edge);--l:#fff}
.b-danger{--f:var(--red-400);--e:#bd1d1d;--l:#fff}
.b-off{--f:var(--paper-100);--e:var(--paper-300);--l:rgba(var(--ink-rgb),.55);cursor:not-allowed}
.b-off:active{transform:none;box-shadow:inset 0 -4px 0 0 var(--e)}
.card{background:var(--paper-0);border:2px solid rgba(var(--ink-rgb),.18);border-radius:20px}
.muted{color:rgba(var(--ink-rgb),.68)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:none;border-radius:12px;color:rgba(var(--ink-rgb),.68);cursor:pointer;text-decoration:none}
.bar{flex:1;height:16px;border-radius:99px;background:var(--paper-100);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--fill-leaf);box-shadow:inset 0 -4px 0 0 rgba(0,0,0,.12);transition:width .4s ease-out;position:relative}
.fill::after{content:"";position:absolute;left:10px;right:10px;top:3px;height:4px;border-radius:99px;background:rgba(0,0,0,.2)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px 18px;border-radius:16px;font:600 17px/1.3 Onest,sans-serif;cursor:pointer;transition:background .12s,border-color .12s}
.num{width:28px;height:28px;border-radius:8px;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:13px;opacity:.6;flex:none}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.panel{position:absolute;left:0;right:0;bottom:0;padding:18px 20px 34px;animation:up .22s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease-out}
.link-secondary{border:0;background:none;font:600 14px/1 Onest,sans-serif;cursor:pointer;padding:12px 4px;text-decoration:underline}
</style>
<link rel="stylesheet" href="design-system.css">
</helmet>
<div class="app">

<div style="display: flex; align-items: center; gap: 10px; padding: 52px 12px 0 8px">
  <a class="iconbtn" href="Main.dc.html" aria-label="Закрыть занятие"><svg class="ico" viewBox="0 0 24 24" style="width: 26px; height: 26px"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
  <div class="bar" role="progressbar" aria-label="Прогресс занятия" aria-valuemin="0" aria-valuemax="12" aria-valuenow="2"><div class="fill" style="width: 16.7%"></div></div>
  <div aria-label="Серия верных ответов" style="display: flex; align-items: center; gap: 4px; font-weight: 700; color: var(--orange-text); font-size: 15px; padding-right: 6px">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z" fill="var(--gold-500)"></path><path d="M12 12c.6 2 3 3 3 5.5a3 3 0 0 1-6 0c0-1.5 1-2.5 1.5-3.5.2 1 .7 1.5 1.2 1.5 0-1.5-.4-2.5.3-3.5z" fill="var(--gold-400)"></path><path d="M12 15.8c.2.9 1.1 1.3 1.1 2.2a1.1 1.1 0 0 1-2.2 0c0-.5.3-.9.5-1.3.1.3.2.5.4.5 0-.5-.1-.9.2-1.4z" fill="var(--gold-100)"></path></svg>3
  </div>
</div>

<div style="padding: 26px 20px 0">
  <div style="font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--blue-text)">Новое слово · задание 3 из 12</div>
  <h1 class="disp" style="margin: 8px 0 0; font-size: 22px; line-height: 1.25; font-weight: 700">Что значит выделенное слово?</h1>

  <div class="card" style="margin-top: 18px; padding: 16px; display: flex; gap: 12px; align-items: flex-start">
    <button class="iconbtn" type="button" aria-label="Прослушать предложение" style="background: var(--fill-sky); color: #fff; box-shadow: inset 0 -4px 0 0 var(--fill-sky-edge); flex: none"><svg class="ico" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg></button>
    <div>
      <p style="margin: 0; font: 400 19px/1.5 'Source Serif 4', Georgia, serif">She was <span style="background: var(--gold-100); border-bottom: 3px solid var(--gold-400); padding: 0 3px; border-radius: 4px; font-weight: 600">reluctant</span> to leave the lighthouse.</p>
      <div class="muted" style="font-size: 12px; margin-top: 6px">из «The Last Lighthouse», глава 3</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px">
    
      <button class="opt" type="button" style="border-width: 2px; border-style: solid; border-color: rgba(var(--ink-rgb),.18); background:var(--paper-0); color: var(--ink-900); box-shadow: inset 0 -4px 0 0 rgba(var(--ink-rgb),.12);"><span class="num">1</span>неохотный</button>
    
      <button class="opt" type="button" style="border-width: 2px; border-style: solid; border-color: rgba(var(--ink-rgb),.18); background:var(--paper-0); color: var(--ink-900); box-shadow: inset 0 -4px 0 0 rgba(var(--ink-rgb),.12);"><span class="num">2</span>уверенный</button>
    
      <button class="opt" type="button" style="border-width: 2px; border-style: solid; border-color: rgba(var(--ink-rgb),.18); background:var(--paper-0); color: var(--ink-900); box-shadow: inset 0 -4px 0 0 rgba(var(--ink-rgb),.12);"><span class="num">3</span>усталый</button>
    
      <button class="opt" type="button" style="border-width: 2px; border-style: solid; border-color: rgba(var(--ink-rgb),.18); background:var(--paper-0); color: var(--ink-900); box-shadow: inset 0 -4px 0 0 rgba(var(--ink-rgb),.12);"><span class="num">4</span>вежливый</button>
    
  </div>
</div>


  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px; border-top: 2px solid rgba(var(--ink-rgb),.1)">
    





</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: null, checked: false };
  }
  renderVals() {
    const texts = ['неохотный', 'уверенный', 'усталый', 'вежливый'];
    const correct = 0;
    const picked = this.state.picked;
    const checked = this.state.checked;
    const base = 'border-width: 2px; border-style: solid; ';
    const S = {
      idle: base + 'border-color: rgba(var(--ink-rgb),.18); background:var(--paper-0); color: var(--ink-900); box-shadow: inset 0 -4px 0 0 rgba(var(--ink-rgb),.12);',
      sel: base + 'border-color: var(--blue-400); background: var(--blue-100); color: var(--blue-text); box-shadow: inset 0 -4px 0 0 var(--blue-400);',
      ok: base + 'border-color: var(--green-400); background: var(--green-100); color: var(--green-500); box-shadow: inset 0 -4px 0 0 var(--green-400);',
      bad: base + 'border-color: var(--red-400); background: var(--red-100); color:var(--red-text); box-shadow: inset 0 -4px 0 0 var(--red-400);',
      dim: base + 'border-color: rgba(var(--ink-rgb),.12); background:var(--paper-0); color:rgba(var(--ink-rgb),.62); box-shadow: inset 0 -4px 0 0 rgba(var(--ink-rgb),.06);'
    };
    const options = texts.map((t, i) => {
      let style = S.idle;
      if (checked) style = i === correct ? S.ok : (i === picked ? S.bad : S.dim);
      else if (i === picked) style = S.sel;
      return { text: t, n: i + 1, style, pick: () => { if (!this.state.checked) this.setState({ picked: i }); } };
    });
    const isRight = checked && picked === correct;
    return {
      options,
      done: checked ? 3 : 2,
      progress: checked ? '25%' : '16.7%',
      combo: isRight ? 4 : 3,
      idle: !checked,
      canCheck: !checked && picked !== null,
      cantCheck: !checked && picked === null,
      showCorrect: isRight,
      showWrong: checked && picked !== correct,
      check: () => { if (this.state.picked !== null) this.setState({ checked: true }); },
      reset: () => this.setState({ picked: null, checked: false })
    };
  }
}
</script>
</body>
</html>
