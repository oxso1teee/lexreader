.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;font-weight:700;font-size:15px}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = Date.now();
    this.iv = setInterval(() => { this.forceUpdate(); if (Date.now() - this.t0 > 3400) clearInterval(this.iv); }, 33);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const el = this.t0 ? Date.now() - this.t0 : 0;
    const p = Math.min(1, Math.max(0, (el - 800) / 1200));
    const e = 1 - Math.pow(1 - p, 2);
    const q = Math.min(1, Math.max(0, (el - 2450) / 700));
    const me = Math.round(e * 10);
    const her = Math.min(7, Math.round(e * 10));
    let s = 41;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cols = ['var(--gold-400)', '#fff', 'var(--green-400)', 'var(--gold-500)', '#bfe6fb'];
    const cf = [];
    for (let i = 0; i < 30; i++) {
      const a = r() * Math.PI * 2;
      const d = 120 + r() * 120;
      const w = 6 + Math.round(r() * 5);
      cf.push({ style: 'width:' + w + 'px;height:' + (r() < .5 ? w : w * 2) + 'px;background:' + cols[i % 5] + ';border-radius:' + (r() < .3 ? '99px' : '2px') + ';--dx:' + Math.round(Math.cos(a) * d - 70) + 'px;--dy:' + Math.round(Math.sin(a) * d) + 'px;--r:' + Math.round(r() * 720 - 360) + 'deg;--d:' + (2.1 + r() * 0.15).toFixed(2) + 's;--t:' + (1.2 + r() * 0.7).toFixed(2) + 's' });
    }
    return { me, her, hMe: 40 + me * 13, hHer: 40 + her * 13, xp: Math.round((1 - Math.pow(1 - q, 3)) * 25), cf };
  }
}
</script>
