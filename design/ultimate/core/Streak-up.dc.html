<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Стрик продлён</title></head>
<body>
<x-dc>
<helmet>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
<style>
body{margin:0;background:var(--paper-200)}
a{color:var(--green-500)}a:hover{color:var(--green-text)}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:var(--paper-50);color:var(--ink-900);font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-ember{--f:var(--fill-ember);--e:var(--fill-ember-edge);--l:#fff}
.card{background:var(--paper-0);border:2px solid rgba(var(--ink-rgb),.18);border-radius:20px}
.muted{color:rgba(var(--ink-rgb),.68)}
@keyframes ignite{0%{transform:scale(.15);filter:grayscale(1)}45%{transform:scale(.15);filter:grayscale(1)}75%{transform:scale(1.18);filter:none}100%{transform:scale(1)}}
.ignite{animation:ignite 1.2s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:50% 85%}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.07,1.1) rotate(3deg)}}
.flick{animation:flick 1s 1.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes glow{0%{opacity:0;transform:scale(.4)}100%{opacity:.55;transform:scale(1)}}
.glow{animation:glow .8s .7s ease-out both}
@keyframes ember{0%{transform:translate(0,0) scale(1);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-170px) scale(.3);opacity:0}}
.em{position:absolute;bottom:40px;left:50%;width:8px;height:8px;border-radius:99px;animation:ember var(--t) var(--d) ease-out infinite}
@keyframes roll{0%,45%{transform:translateY(0)}62%{transform:translateY(-53%)}75%{transform:translateY(-49%)}100%{transform:translateY(-50%)}}
.roll{animation:roll 1.8s .4s cubic-bezier(.3,.7,.4,1) both}
@keyframes fillday{0%,55%{background:var(--paper-0);transform:scale(1)}75%{transform:scale(1.3) rotate(-6deg)}100%{background:var(--gold-500);transform:scale(1)}}
.today{animation:fillday 1.6s 1s ease-out both;border:2px solid var(--gold-500)}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.day{height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.nudge{min-height:44px;padding:0 14px;border-radius:12px;border:0;font:700 14px/1 Onest,sans-serif;cursor:pointer;transition:background .2s,transform .1s}
.nudge:active{transform:translateY(2px)}
@keyframes sent{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.sentpop{animation:sent .35s ease-out}
</style>
<link rel="stylesheet" href="design-system.css">
</helmet>
<div class="app">

<div style="text-align: center; padding-top: 86px">
  <div style="position: relative; display: inline-block; width: 220px; height: 200px">
    <div class="glow" aria-hidden="true" style="position: absolute; left: 20px; top: 30px; width: 180px; height: 180px; border-radius: 999px; background: #ffd9a3"></div>
    <span class="em" style="background:var(--gold-500);--dx:-54px;--d:1.73s;--t:1.65s;margin-left:-15px" aria-hidden="true"></span><span class="em" style="background:var(--gold-400);--dx:23px;--d:1.98s;--t:1.89s;margin-left:27px" aria-hidden="true"></span><span class="em" style="background:var(--gold-500);--dx:40px;--d:1.52s;--t:1.85s;margin-left:30px" aria-hidden="true"></span><span class="em" style="background:var(--gold-400);--dx:23px;--d:2.45s;--t:1.70s;margin-left:0px" aria-hidden="true"></span><span class="em" style="background:var(--gold-500);--dx:45px;--d:1.50s;--t:2.40s;margin-left:8px" aria-hidden="true"></span><span class="em" style="background:var(--gold-400);--dx:57px;--d:2.41s;--t:1.69s;margin-left:-19px" aria-hidden="true"></span><span class="em" style="background:var(--gold-500);--dx:29px;--d:1.77s;--t:1.59s;margin-left:19px" aria-hidden="true"></span><span class="em" style="background:var(--gold-400);--dx:-57px;--d:2.05s;--t:1.65s;margin-left:26px" aria-hidden="true"></span><span class="em" style="background:var(--gold-500);--dx:-25px;--d:2.12s;--t:1.82s;margin-left:-17px" aria-hidden="true"></span><span class="em" style="background:var(--gold-400);--dx:44px;--d:3.01s;--t:2.01s;margin-left:23px" aria-hidden="true"></span>
    <div class="ignite" style="position: absolute; left: 15px; top: 5px">
      <div class="flick">
        <svg viewBox="0 0 120 140" width="190" height="222" aria-hidden="true">
          <defs>
            <radialGradient id="flameGlowSU" cx="50%" cy="62%" r="55%"><stop offset="0" stop-color="var(--gold-400)" stop-opacity=".5"></stop><stop offset="1" stop-color="var(--gold-400)" stop-opacity="0"></stop></radialGradient>
            <linearGradient id="flameOuterSU" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#c81d1d"></stop><stop offset=".5" stop-color="var(--orange-600)"></stop><stop offset="1" stop-color="var(--gold-400)"></stop></linearGradient>
            <linearGradient id="flameInnerSU" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--gold-600)"></stop><stop offset="1" stop-color="#fff6d6"></stop></linearGradient>
          </defs>
          <ellipse cx="60" cy="90" rx="58" ry="50" fill="url(#flameGlowSU)"></ellipse>
          <path d="M60 10c7 21 31 33 31 63a31 31 0 0 1-62 0c0-15 10-26 15-35 0 10 5 15 10 15 0-15-5-26 6-43z" fill="url(#flameOuterSU)"></path>
          <path d="M60 54c5 11 17 16 17 30a17 17 0 0 1-34 0c0-8 5-13 8-19 1 5 4 7 6 7 0-8-2-13 3-18z" fill="url(#flameInnerSU)"></path>
          <ellipse cx="55" cy="104" rx="6" ry="8.5" fill="#fff" opacity=".9"></ellipse>
        </svg>
      </div>
    </div>
  </div>
  <div style="height: 104px; overflow: hidden; margin-top: -4px" aria-label="13 дней подряд">
    <div class="roll" aria-hidden="true">
      <div class="disp" style="font-size: 92px; font-weight: 900; line-height: 104px; color: var(--paper-300)" aria-hidden="true">12</div>
      <div class="disp" style="font-size: 92px; font-weight: 900; line-height: 104px; color: var(--orange-text)">13</div>
    </div>
  </div>
  <div class="disp rise" style="font-size: 22px; font-weight: 700; color: var(--orange-text); animation-delay: 1.2s">дней подряд</div>
</div>

<div class="card rise" style="margin: 24px 20px 0; padding: 14px 16px; animation-delay: .8s">
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: 12px; font-weight: 600">
    <div><div class="day" style="background: var(--gold-500)"></div><div class="muted" style="margin-top: 4px">Пн</div></div>
    <div><div class="day" style="background: var(--gold-500)"></div><div class="muted" style="margin-top: 4px">Вт</div></div>
    <div><div class="day" style="background: var(--gold-500)"></div><div class="muted" style="margin-top: 4px">Ср</div></div>
    <div><div class="day today"></div><div style="margin-top: 4px; color: var(--orange-text); font-weight: 700">Чт</div></div>
    <div><div class="day" style="background: var(--paper-100)"></div><div class="muted" style="margin-top: 4px">Пт</div></div>
    <div><div class="day" style="background: var(--paper-100)"></div><div class="muted" style="margin-top: 4px">Сб</div></div>
    <div><div class="day" style="background: var(--paper-100)"></div><div class="muted" style="margin-top: 4px">Вс</div></div>
  </div>
  <div class="muted" style="font-size: 14px; margin-top: 12px; text-align: center">Позанимайся завтра, и станет 14</div>
</div>

<div class="card rise" style="margin: 12px 20px 0; padding: 12px 14px; display: flex; align-items: center; gap: 12px; animation-delay: 1.4s">
  <span style="width: 40px; height: 40px; border-radius: 999px; background: var(--fill-warm); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none">А</span>
  <div style="flex: 1; min-width: 0">
    <div style="font-weight: 700; font-size: 15px">Аня ещё не занималась</div>
    <div class="muted" style="font-size: 13px">Общая серия: 9 дней</div>
  </div>
  <button class="nudge" type="button" style="background: var(--gold-150); color: var(--orange-text); box-shadow: inset 0 -3px 0 0 #ffd9a3;">Напомнить</button>
</div>

<div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px; animation-delay: 1.9s">
  <a class="btn b-ember" href="Main.dc.html">Продолжить</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: false };
  }
  renderVals() {
    const sent = this.state.sent;
    let s = 21;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const embers = [];
    for (let i = 0; i < 10; i++) {
      embers.push({ style: 'background:' + (i % 2 ? 'var(--gold-400)' : 'var(--gold-500)') + ';--dx:' + Math.round(r() * 120 - 60) + 'px;--d:' + (1.2 + r() * 2).toFixed(2) + 's;--t:' + (1.4 + r() * 1).toFixed(2) + 's;margin-left:' + Math.round(r() * 60 - 30) + 'px' });
    }
    return {
      embers,
      nudgeLabel: sent ? 'Напомнили' : 'Напомнить',
      nudgeCls: sent ? 'nudge sentpop' : 'nudge',
      nudgeStyle: sent ? 'background: var(--green-100); color: var(--green-500);' : 'background: var(--gold-150); color: var(--orange-text); box-shadow: inset 0 -3px 0 0 #ffd9a3;',
      nudge: () => this.setState({ sent: true })
    };
  }
}
</script>
</body>
</html>
