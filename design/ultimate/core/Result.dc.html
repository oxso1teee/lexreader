<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Итог занятия</title></head>
<body>
<x-dc>
<helmet>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
<style>
body{margin:0;background:var(--paper-200)}
a{color:var(--green-500)}a:hover{color:var(--green-text)}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:var(--paper-50);color:var(--ink-900);font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-leaf{--f:var(--fill-leaf);--e:var(--fill-leaf-edge);--l:#fff}
.card{background:var(--paper-0);border:2px solid rgba(var(--ink-rgb),.18);border-radius:20px}
.muted{color:rgba(var(--ink-rgb),.68)}
.stat{flex:1;border-radius:20px;border:2px solid var(--c);overflow:hidden;background:var(--paper-0);text-align:center}
.stat-h{background:var(--c);color:var(--t);font:700 12px/1 Onest,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:8px 4px}
.stat-v{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 4px 16px;font:700 22px/1 Unbounded,sans-serif;color:var(--v)}
@keyframes rise{0%{transform:translateY(30px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spark{0%{transform:translate(0,0) scale(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.rise{animation:rise .5s ease-out both}
.bob{animation:bob 2.4s ease-in-out .5s infinite}
.sp{position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:3px;animation:spark 1.6s ease-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.1) rotate(3deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-origin:50% 90%}
</style>
<link rel="stylesheet" href="design-system.css">
</helmet>
<div class="app">

<div style="position: relative; height: 270px; margin-top: 60px; display: flex; align-items: center; justify-content: center">
  <span class="sp" style="background: var(--gold-400); --dx: -120px; --dy: -80px" aria-hidden="true"></span>
  <span class="sp" style="background: var(--blue-400); --dx: 120px; --dy: -70px; animation-delay: .2s" aria-hidden="true"></span>
  <span class="sp" style="background: var(--gold-500); --dx: -100px; --dy: 60px; animation-delay: .4s" aria-hidden="true"></span>
  <span class="sp" style="background: var(--fill-leaf); --dx: 110px; --dy: 70px; animation-delay: .6s" aria-hidden="true"></span>
  <span class="sp" style="background: var(--fill-red); --dx: 0px; --dy: -120px; animation-delay: .8s" aria-hidden="true"></span>
  <span class="sp" style="background: var(--gold-400); --dx: -40px; --dy: 110px; animation-delay: 1s" aria-hidden="true"></span>
  <div class="rise"><div class="bob">
    <svg viewBox="0 0 128 150" width="170" height="200" aria-hidden="true"><ellipse cx="64" cy="128" rx="34" ry="9" fill="rgba(0,0,0,0.06)"></ellipse><path d="M64 8C78 26 100 44 92 72C87 92 66 104 48 90C32 78 32 54 48 40C58 31 60 20 64 8Z" fill="var(--green-400)"></path><path d="M60 46C70 58 76 68 68 82C63 90 50 90 44 81C39 73 43 61 51 53C55 50 57 48 60 46Z" fill="var(--green-100)" opacity="0.9"></path><ellipse cx="54" cy="62" rx="3.2" ry="4.4" fill="var(--green-600)"></ellipse><ellipse cx="66" cy="62" rx="3.2" ry="4.4" fill="var(--green-600)"></ellipse><path d="M53 71q7 7 14 0" fill="none" stroke="var(--green-600)" stroke-width="2.4" stroke-linecap="round"></path><ellipse cx="90" cy="100" rx="19" ry="12" fill="var(--gold-500)" transform="rotate(-28 90 100)"></ellipse><ellipse cx="94" cy="96" rx="8" ry="5" fill="var(--gold-400)" transform="rotate(-28 94 96)" opacity="0.85"></ellipse></svg>
  </div></div>
</div>

<div style="text-align: center; padding: 0 24px">
  <h1 class="disp" style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 900; color:var(--gold-text)">Занятие завершено!</h1>
  <p class="muted" style="margin: 8px 0 0; font-size: 15px">3 новых слова ушли в повторение</p>
</div>

<div style="display: flex; gap: 10px; padding: 24px 16px 0">
  <div class="stat" style="--c: var(--gold-400); --t: #1a1a1a; --v: var(--gold-700)">
    <div class="stat-h">Опыт</div>
    <div class="stat-v"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="var(--gold-400)" stroke="var(--gold-600)" stroke-width="1.5" stroke-linejoin="round"></path></svg>24</div>
  </div>
  <div class="stat" style="--c: var(--fill-leaf); --t: #fff; --v: var(--green-500)">
    <div class="stat-h">Точность</div>
    <div class="stat-v">92%</div>
  </div>
  <div class="stat" style="--c: var(--fill-sky); --t: #fff; --v: var(--blue-600)">
    <div class="stat-h">Время</div>
    <div class="stat-v">4:38</div>
  </div>
</div>

<div class="card" style="margin: 14px 16px 0; padding: 14px 16px; display: flex; align-items: center; gap: 14px; background: var(--gold-150); border-color: var(--gold-500)">
  <div class="flick" style="flex: none">
    <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z" fill="var(--gold-500)"></path><path d="M12 12c.6 2 3 3 3 5.5a3 3 0 0 1-6 0c0-1.5 1-2.5 1.5-3.5.2 1 .7 1.5 1.2 1.5 0-1.5-.4-2.5.3-3.5z" fill="var(--gold-400)"></path><path d="M12 15.8c.2.9 1.1 1.3 1.1 2.2a1.1 1.1 0 0 1-2.2 0c0-.5.3-.9.5-1.3.1.3.2.5.4.5 0-.5-.1-.9.2-1.4z" fill="var(--gold-100)"></path></svg>
  </div>
  <div>
    <div class="disp" style="font-size: 18px; font-weight: 700; color: var(--orange-text)">13 дней подряд</div>
    <div style="font-size: 14px; color: var(--orange-text); margin-top: 2px">Стрик продлён. До рекорда 8 дней</div>
  </div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px">
  <a class="btn b-leaf" href="Goal-done.dc.html">Продолжить</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
