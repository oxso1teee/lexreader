<style>
body{margin:0;background:var(--paper-200)}
a{color:#fff}a:hover{color:var(--gold-100)}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#1f3a2b;color:#fff;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-sun{--f:var(--gold-400);--e:var(--gold-600);--l:#1a1a1a}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes zoom{0%{transform:scale(0) rotate(-120deg)}65%{transform:scale(1.1) rotate(8deg)}100%{transform:none}}
.zoom{animation:zoom .8s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes roll{0%,55%{transform:translateY(0)}75%{transform:translateY(-53%)}100%{transform:translateY(-50%)}}
.roll{animation:roll 1.4s .9s cubic-bezier(.3,.7,.4,1) both}
@keyframes wave{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2);opacity:0}}
.wave{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:999px;border:5px solid var(--gold-400);animation:wave 1s 1.6s ease-out both}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes star{0%{transform:translate(0,0) scale(0)}30%{transform:translate(0,0) scale(1)}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.st{position:absolute;left:50%;top:50%;animation:star 1.6s var(--d) ease-out both}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:.5}}
.glow{animation:glow 2.4s ease-in-out infinite}
</style>
<link rel="stylesheet" href="design-system.css">

      <svg class="st" viewBox="0 0 24 24" width="18" height="18" style="--dx:-46px;--dy:-143px;--d:1.65s;margin:-9px 0 0 -9px" aria-hidden="true"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="var(--gold-400)"></path></svg>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = Date.now();
    this.ivx = setInterval(() => { this.forceUpdate(); if (Date.now() - this.t0 > 3600) clearInterval(this.ivx); }, 33);
  }
  componentWillUnmount() { clearInterval(this.ivx); }
  cu(to, delay, dur) {
    const el = this.t0 ? Date.now() - this.t0 : 0;
    const p = Math.min(1, Math.max(0, (el - delay) / dur));
    return Math.round(to * (1 - Math.pow(1 - p, 3)));
  }
  renderVals() {
    const stars = [];
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      stars.push({ style: '--dx:' + Math.round(Math.cos(a) * 150) + 'px;--dy:' + Math.round(Math.sin(a) * 150) + 'px;--d:' + (1.6 + (i % 3) * 0.05).toFixed(2) + 's;margin:-9px 0 0 -9px' });
    }
    return { stars, total: this.cu(1500, 1700, 900).toLocaleString("ru-RU"), barW: this.cu(40, 2300, 800) + "%" };
  }
}
</script>
