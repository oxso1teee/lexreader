<!doctype html>
<html lang="ru">
<head>

<title>LexReader — Слова ускользают</title></head>

<helmet>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
<style>
body{margin:0;background:var(--paper-200)}
a{color:var(--green-500)}a:hover{color:var(--green-text)}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:var(--paper-50);color:var(--ink-900);font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.muted{color:rgba(var(--ink-rgb),.68)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:54px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-sky{--f:var(--fill-sky);--e:var(--fill-sky-edge);--l:#fff}
.ghost{background:var(--paper-0);border:2px solid rgba(var(--ink-rgb),.12);border-radius:20px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.scrim{position:absolute;inset:0;background:rgba(var(--ink-rgb),.55);animation:fadein .25s ease-out both}
@keyframes up{0%{transform:translateY(100%)}75%{transform:translateY(-2%)}100%{transform:none}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper-0);border-radius:30px 30px 0 0;padding:12px 22px 30px;animation:up .4s .1s cubic-bezier(.2,.8,.2,1) both}
@keyframes draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
.curve{stroke-dasharray:420;animation:draw 1.2s .5s cubic-bezier(.4,0,.2,1) both}
@keyframes boost{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
.boost{stroke-dasharray:300;animation:boost .9s 1.8s cubic-bezier(.4,0,.2,1) both}
@keyframes ping{0%{r:6;opacity:1}100%{r:18;opacity:0}}
.ping{animation:ping 1.4s 1.7s ease-out infinite}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes fade{0%,100%{opacity:1;filter:blur(0)}50%{opacity:.35;filter:blur(1.2px)}}
.w{display:inline-block;padding:6px 10px;border-radius:10px;background:var(--blue-100);color:var(--blue-text);font:600 15px/1 'Source Serif 4',Georgia,serif;animation:rise .35s var(--d) both, fade 2.6s calc(var(--d) + .4s) ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.swing{animation:swing 1s ease-in-out infinite;transform-origin:50% 0}
.link2{display:block;text-align:center;font:600 15px/1 Onest,sans-serif;color:rgba(var(--ink-rgb),.68);padding:14px 0;text-decoration:underline}
</style>
<link rel="stylesheet" href="design-system.css">

<div class="app">

      </div>
      <div style="flex: 1">
        <h1 class="disp" style="margin: 0; font-size: 21px; line-height: 1.2; font-weight: 900">18 слов начинают забываться</h1>
        <p class="muted" style="margin: 6px 0 0; font-size: 14px">Повтори сейчас, и они продержатся ещё 2 недели</p>
      </div>
    </div>

    <div style="margin-top: 16px; padding: 12px 12px 8px; border-radius: 18px; background: var(--paper-50)">
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700" class="muted"><span>Насколько помнишь</span><span>дни</span></div>
      <svg viewBox="0 0 320 120" width="100%" height="120" role="img" aria-label="Память падает до 70%, повтор поднимает её обратно">
        <path d="M10 104H310" stroke="var(--paper-300)" stroke-width="2"></path>
        <path d="M10 20H310" stroke="var(--paper-100)" stroke-width="2" stroke-dasharray="4 6"></path>
        <text x="12" y="14" text-anchor="start" font-size="11" font-weight="700" fill="rgba(var(--ink-rgb),.62)" font-family="Onest, sans-serif">100%</text>
        <path class="curve" d="M10 20 C60 40 100 58 150 66" fill="none" stroke="var(--blue-400)" stroke-width="5" stroke-linecap="round"></path>
        <path d="M150 66 C200 74 250 86 310 92" fill="none" stroke="rgba(28,176,246,.4)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 8"></path>
        <path class="boost" d="M150 66 L150 22 C210 30 260 38 310 46" fill="none" stroke="var(--green-400)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle class="ping" cx="150" cy="66" r="6" fill="none" stroke="var(--red-400)" stroke-width="3"></circle>
        <circle cx="150" cy="66" r="6" fill="var(--red-400)"></circle>
        <text x="158" y="84" font-size="11" font-weight="700" fill="var(--red-600)" font-family="Onest, sans-serif">сегодня · 70%</text>
        <text x="214" y="70" font-size="11" font-weight="700" fill="var(--green-500)" font-family="Onest, sans-serif" class="rise" style="animation-delay: 2.4s">после повтора</text>
      </svg>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px" aria-label="Слова на повтор">
      <span class="w" style="--d: .5s">reluctant</span><span class="w" style="--d: .6s">gale</span><span class="w" style="--d: .7s">shore</span><span class="w" style="--d: .8s">to drift</span><span class="w" style="--d: .9s">beacon</span><span class="w" style="--d: 1s; background: var(--paper-100); color: rgba(var(--ink-rgb),.68); font-family: Onest, sans-serif; font-size: 13px; font-weight: 700">+13</span>
    </div>

    <div style="margin-top: 18px">
      <a class="btn b-sky" href="Lesson-start.dc.html">Повторить · 3 мин</a>
      <a class="link2" href="Main.dc.html">Напомнить вечером</a>
    </div>
  </div>
</div>
