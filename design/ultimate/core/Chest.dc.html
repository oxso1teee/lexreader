<style>
body{margin:0;background:var(--paper-200)}
a{color:#fff}a:hover{color:var(--gold-100)}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:radial-gradient(ellipse 260px 300px at 50% 44%,#7a4218 0%,#55280d 48%,#2e1406 100%);color:#fff;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
@keyframes tw{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1) rotate(45deg);opacity:1}}
.tw{position:absolute;animation:tw 1.8s ease-in-out infinite}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-sun{--f:var(--gold-400);--e:var(--gold-600);--l:#1a1a1a}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes wiggle{0%,100%{transform:rotate(0)}15%{transform:rotate(-8deg)}30%{transform:rotate(8deg)}45%{transform:rotate(-5deg)}60%{transform:rotate(3deg)}}
.wiggle{animation:wiggle 1.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes lid{0%{transform:none}100%{transform:translate(40px,-150px) rotate(40deg);opacity:0}}
.lidopen{animation:lid .6s cubic-bezier(.3,.7,.4,1) both}
@keyframes beam{0%{opacity:0;transform:scaleY(.2)}100%{opacity:1;transform:scaleY(1)}}
.beam{animation:beam .5s .15s ease-out both;transform-origin:50% 100%}
@keyframes spin{to{transform:rotate(360deg)}}
.rays{animation:spin 10s linear infinite}
@keyframes popr{0%{transform:translateY(60px) scale(.3);opacity:0}70%{transform:translateY(-8px) scale(1.08);opacity:1}100%{transform:none;opacity:1}}
.popr{animation:popr .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes hint{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hint{animation:hint 1.2s ease-in-out infinite}
.rw{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.14)}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}10%{transform:translate(-6px,2px) rotate(-6deg)}20%{transform:translate(6px,-2px) rotate(6deg)}30%{transform:translate(-8px,0) rotate(-8deg)}40%{transform:translate(8px,-3px) rotate(8deg)}50%{transform:translate(-9px,0) rotate(-9deg) scale(1.04)}60%{transform:translate(9px,-4px) rotate(9deg) scale(1.06)}70%{transform:translate(-6px,0) rotate(-5deg) scale(1.08)}80%{transform:translate(4px,-6px) rotate(3deg) scale(1.1)}90%{transform:translate(0,-8px) scale(1.12,0.92)}}
.shake{animation:shake .75s ease-in both;transform-origin:50% 90%}
@keyframes seam{0%,100%{opacity:.2}50%{opacity:1}}
.seam{animation:seam .18s linear infinite}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.flash{position:absolute;inset:0;background:var(--gold-100);animation:flash .5s ease-out both;pointer-events:none;z-index:5}
@keyframes coin{0%{transform:translate(0,0) scale(.3) rotateY(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotateY(720deg);opacity:0}}
.coin{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:99px;background:var(--gold-400);box-shadow:inset 0 -3px 0 0 var(--gold-600), 0 0 0 2px var(--gold-700);animation:coin var(--t) var(--d) cubic-bezier(.15,.7,.3,1) both}
@keyframes land{0%{transform:translateY(0)}40%{transform:translateY(6px) scale(1.06,.94)}100%{transform:none}}
.land{animation:land .4s ease-out both;transform-origin:50% 100%}
.taps{display:flex;gap:6px;justify-content:center;margin-top:14px}
.ri{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
</style>

    <svg class="tw" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="right: 70px; top: 290px; animation-delay: 1.3s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="var(--gold-400)"></path></svg>
    <button type="button" aria-label="Открыть сундук" style="position: relative; border: 0; background: none; padding: 0; cursor: pointer">

          <path d="M82 96h36a6 6 0 0 1 6 6v22a6 6 0 0 1-6 6H82a6 6 0 0 1-6-6v-22a6 6 0 0 1 6-6z" fill="url(#brass)" stroke="#5c3d08" stroke-width="4"></path>
          <circle cx="100" cy="109" r="5.5" fill="#4a1703"></circle>

            <path d="M16 78 Q100 0 184 78 V86 H16z" fill="url(#woodLid)" stroke="#5c3d08" stroke-width="7" stroke-linejoin="round"></path>
            <path d="M34 72 Q100 14 166 72M22 80 Q100 8 178 80" stroke="#b97a12" stroke-width="2" fill="none" opacity=".6"></path>
            <ellipse cx="70" cy="40" rx="26" ry="10" fill="#fff8e0" opacity=".45" transform="rotate(-18 70 40)"></ellipse>
            <rect x="16" y="78" width="168" height="9" fill="url(#brass)" stroke="#5c3d08" stroke-width="2"></rect>
            <path d="M84 62h32a6 6 0 0 1 6 6v10a6 6 0 0 1-6 6H84a6 6 0 0 1-6-6V68a6 6 0 0 1 6-6z" fill="url(#brass)" stroke="#5c3d08" stroke-width="4"></path>
            <circle cx="92" cy="72" r="2.4" fill="#fff6dd"></circle>

        </svg>
      </div>
    </button>

    <div style="text-align: center; padding: 0 28px">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 0, at: 0 };
  }
  componentWillUnmount() { clearTimeout(this.t); clearInterval(this.iv); }
  renderVals() {
    const ph = this.state.phase;
    const o = ph === 2;
    const el = o ? Date.now() - this.state.at : 0;
    const p = Math.min(1, Math.max(0, (el - 500) / 900));
    let sd = 5;
    const r = () => { sd = (sd * 9301 + 49297) % 233280; return sd / 233280; };
    const coins = [];
    for (let i = 0; i < 18; i++) {
      const a = -Math.PI * (0.08 + r() * 0.84);
      const d = 120 + r() * 160;
      coins.push('--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d) + 'px;--d:' + (r() * 0.15).toFixed(2) + 's;--t:' + (0.9 + r() * 0.6).toFixed(2) + 's');
    }
    return {
      open: o, closed: !o, shaking: ph === 1, coins,
      xp: Math.round((1 - Math.pow(1 - p, 3)) * 30),
      wcls: ph === 0 ? 'wiggle' : (ph === 1 ? 'shake' : 'land'),
      lidcls: o ? 'lidopen' : '',
      hintText: ph === 1 ? 'Открывается…' : 'Нажми на сундук',
      aria: o ? 'Сундук открыт' : 'Открыть сундук',
      openIt: () => {
        if (this.state.phase !== 0) return;
        this.setState({ phase: 1 });
        this.t = setTimeout(() => {
          this.setState({ phase: 2, at: Date.now() });
          clearInterval(this.iv);
          this.iv = setInterval(() => { this.forceUpdate(); if (Date.now() - this.state.at > 1600) clearInterval(this.iv); }, 33);
        }, 750);
      }
    };
  }
}
</script>
