@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

@keyframes crown{0%{transform:translateY(-200px) rotate(-30deg)}60%{transform:translateY(6px) rotate(8deg)}78%{transform:translateY(-10px) rotate(-4deg)}100%{transform:none}}

@keyframes fall{0%{transform:translateY(-40px) rotate(0)}100%{transform:translateY(900px) rotate(var(--r))}}
.rain{position:absolute;top:-20px;animation:fall var(--t) var(--d) linear infinite}
@keyframes glow{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.6;transform:scale(1.1)}}
.glow{animation:glow 2.4s ease-in-out infinite}
@keyframes slot{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.slot{animation:slot .35s 1.5s ease-out both}
@keyframes slideIn{from{transform:translateX(-110%)}to{transform:none}}
.slideIn{animation:slideIn .5s 1.7s cubic-bezier(.2,.9,.3,1.1) both}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.s = Date.now();
    this.iv = setInterval(() => { this.forceUpdate(); if (Date.now() - this.s > 1800) clearInterval(this.iv); }, 35);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const p = this.s ? Math.min(1, Math.max(0, (Date.now() - this.s - 300) / 1200)) : 0;
    const e = 1 - Math.pow(1 - p, 3);
    let s = 31;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cols = ['var(--gold-400)', '#fff', 'var(--blue-400)', 'var(--green-200)', '#ffd9a3'];
    const rain = [];
    for (let i = 0; i < 22; i++) {
      const w = 7 + Math.round(r() * 6);
      rain.push({ style: 'left:' + Math.round(r() * 380) + 'px;width:' + w + 'px;height:' + Math.round(w * (1.2 + r())) + 'px;background:' + cols[i % 5] + ';border-radius:' + (i % 4 === 0 ? '99px' : '2px') + ';--t:' + (3 + r() * 2.5).toFixed(2) + 's;--d:' + (r() * 3).toFixed(2) + 's;--r:' + Math.round(r() * 900 - 450) + 'deg' });
    }
    return { rain, n: Math.round(e * 30) };
  }
}
</script>
