<style>

a{color:var(--green-500)}a:hover{color:var(--green-text)}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:var(--paper-50);color:var(--ink-900);font-family:Onest,system-ui,sans-serif;box-sizing:border-box}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-leaf{--f:var(--fill-leaf);--e:var(--fill-leaf-edge);--l:#fff}
.muted{color:rgba(var(--ink-rgb),.68)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:none;border-radius:12px;color:rgba(var(--ink-rgb),.68);cursor:pointer;text-decoration:none}
.bar{flex:1;height:16px;border-radius:99px;background:var(--paper-100);position:relative}
@keyframes fillto{from{width:42%}to{width:50%}}
.fill{height:100%;border-radius:99px;background:var(--gold-500);box-shadow:inset 0 -4px 0 0 rgba(0,0,0,.12);animation:fillto .7s .2s ease-out both}
@keyframes flag{0%{transform:translate(-50%,-100%) scale(0)}70%{transform:translate(-50%,-100%) scale(1.3)}100%{transform:translate(-50%,-100%) scale(1)}}
.flag{position:absolute;left:50%;top:-2px;animation:flag .45s .8s ease-out both;transform-origin:50% 100%}
@keyframes jump{0%,100%{transform:translateY(0) scaleY(1)}10%{transform:translateY(0) scaleY(.88) scaleX(1.08)}40%{transform:translateY(-46px) scaleY(1.06)}60%{transform:translateY(-46px)}88%{transform:translateY(0) scaleY(.92) scaleX(1.05)}}
.jump{animation:jump 1.3s cubic-bezier(.3,.7,.4,1) infinite;transform-origin:50% 100%}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.14}40%,60%{transform:scaleX(.6);opacity:.06}}
.shd{animation:shadow 1.3s cubic-bezier(.3,.7,.4,1) infinite}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}
.bubble{animation:pop .4s .4s cubic-bezier(.2,.9,.3,1.3) both;transform-origin:50% 100%}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.2);opacity:1}75%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
.cf{position:absolute;left:0;top:0;animation:burst var(--t) var(--d) cubic-bezier(.1,.7,.3,1) both}
@keyframes wavef{0%,100%{transform:skewY(0)}50%{transform:skewY(-8deg)}}
.flagw{animation:wavef .5s 1.25s ease-in-out 4;transform-origin:0 50%}
@keyframes tw{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(90deg);opacity:1}}
.tw{position:absolute;animation:tw 1.6s ease-in-out infinite}
.stat{flex:1;padding:12px 8px;border-radius:16px;text-align:center}
</style>

53px;--r:318deg;--d:0.93s;--t:1.22s"></span><span class="cf" style="width:8px;height:8px;background:var(--blue-400);border-radius:2px;--dx:-39px;--dy:126px;--r:-169deg;--d:0.92s;--t:1.19s"></span><span class="cf" style="width:5px;height:5px;background:var(--fill-red);border-radius:99px;--dx:138px;--dy:134px;--r:167deg;--d:0.87s;--t:1.51s"></span><span class="cf" style="width:7px;height:7px;background:var(--gold-500);border-radius:99px;--dx:-20px;--dy:63px;--r:-184deg;--d:0.92s;--t:1.35s"></span><span class="cf" style="width:5px;height:5px;background:var(--gold-400);border-radius:2px;--dx:-128px;--dy:134px;--r:-360deg;--d:0.91s;--t:1.14s"></span><span class="cf" style="width:6px;height:12px;background:var(--fill-leaf);border-radius:99px;--dx:-87px;--dy:127px;--r:74deg;--d:0.87s;--t:1.22s"></span></div>
      <svg class="flag" viewBox="0 0 24 28" width="22" height="26" aria-hidden="true"><path d="M5 26V3" stroke="var(--ink-900)" stroke-width="2.5" stroke-linecap="round"></path><path class="flagw" d="M6 3h13l-3 5 3 5H6z" fill="var(--red-400)"></path></svg>

      <div class="disp" style="font-size: 22px; font-weight: 900; line-height: 1.2">Половина пути!</div>
      <div style="font-size: 16px; margin-top: 6px">Держишь темп. Ещё 6 заданий</div>
      <span aria-hidden="true" style="position: absolute; left: 50%; bottom: -12px; width: 22px; height: 22px; margin-left: -11px; background:var(--paper-0); border-right: 2px solid rgba(var(--ink-rgb),.15); border-bottom: 2px solid rgba(var(--ink-rgb),.15); transform: rotate(45deg)"></span>
    </div>
    <div style="position: relative; height: 230px; margin-top: 26px; display: flex; justify-content: center; align-items: flex-end">

    </div>

  <div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px; animation-delay: 1s">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = Date.now();
    this.iv = setInterval(() => { this.forceUpdate(); if (Date.now() - this.t0 > 2200) clearInterval(this.iv); }, 33);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const el = this.t0 ? Date.now() - this.t0 : 0;
    const p = Math.min(1, Math.max(0, (el - 800) / 900));
    const e = 1 - Math.pow(1 - p, 3);
    let s = 31;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cols = ['var(--gold-500)', 'var(--gold-400)', 'var(--green-400)', 'var(--blue-400)', 'var(--red-400)'];
    const cf = [];
    for (let i = 0; i < 18; i++) {
      const a = Math.PI * (0.15 + r() * 0.7);
      const d = 60 + r() * 120;
      const w = 5 + Math.round(r() * 4);
      cf.push({ style: 'width:' + w + 'px;height:' + (r() < .5 ? w : w * 2) + 'px;background:' + cols[i % 5] + ';border-radius:' + (r() < .3 ? '99px' : '2px') + ';--dx:' + Math.round(Math.cos(a) * d * 1.4) + 'px;--dy:' + Math.round(Math.sin(a) * d) + 'px;--r:' + Math.round(r() * 720 - 360) + 'deg;--d:' + (0.85 + r() * 0.1).toFixed(2) + 's;--t:' + (1 + r() * 0.6).toFixed(2) + 's' });
    }
    return { cf, xp: Math.round(e * 45), combo: Math.round(e * 5) };
  }
}
</script>
