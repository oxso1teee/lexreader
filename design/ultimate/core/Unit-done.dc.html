<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = Date.now();
    this.ivx = setInterval(() => { this.forceUpdate(); if (Date.now() - this.t0 > 2600) clearInterval(this.ivx); }, 33);
  }
  componentWillUnmount() { clearInterval(this.ivx); }
  cu(to, delay, dur) {
    const el = this.t0 ? Date.now() - this.t0 : 0;
    const p = Math.min(1, Math.max(0, (el - delay) / dur));
    return Math.round(to * (1 - Math.pow(1 - p, 3)));
  }
  renderVals() {
    let s = 17;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cols = ['var(--gold-400)', '#fff', 'var(--green-200)', 'var(--gold-500)', 'var(--blue-100)'];
    const cf = [];
    for (let i = 0; i < 30; i++) {
      const a = r() * Math.PI * 2;
      const d = 130 + r() * 110;
      const w = 6 + Math.round(r() * 6);
      cf.push({ style: 'width:' + w + 'px;height:' + (r() < .5 ? w : w * 2) + 'px;background:' + cols[i % 5] + ';border-radius:' + (r() < .3 ? '99px' : '2px') + ';--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d + 40) + 'px;--r:' + Math.round(r() * 720 - 360) + 'deg;--d:' + (0.5 + r() * 0.2).toFixed(2) + 's;--t:' + (1.2 + r() * 0.8).toFixed(2) + 's' });
    }
    return { cf, a: this.cu(42, 1150, 900), b: this.cu(6, 1250, 700), c: this.cu(2, 1350, 500) };
  }
}
</script>
