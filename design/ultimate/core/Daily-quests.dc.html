<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Задания дня</title></head>
<body>
<x-dc>
<helmet>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
<style>
body{margin:0;background:var(--paper-200)}
a{color:var(--green-500)}a:hover{color:var(--green-text)}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:var(--paper-50);color:var(--ink-900);font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-sun{--f:var(--gold-400);--e:var(--gold-600);--l:#1a1a1a}
.card{background:var(--paper-0);border:2px solid rgba(var(--ink-rgb),.18);border-radius:20px}
.muted{color:rgba(var(--ink-rgb),.68)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes fillq{from{width:var(--from)}to{width:100%}}
.fq{height:100%;border-radius:99px;background:var(--gold-400);box-shadow:inset 0 -3px 0 0 var(--gold-600);animation:fillq .7s var(--d) cubic-bezier(.4,0,.2,1) both}
@keyframes chk{0%{transform:scale(0) rotate(-45deg)}70%{transform:scale(1.3)}100%{transform:none}}
.chk{animation:chk .35s var(--d) cubic-bezier(.2,.9,.3,1.3) both}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.wiggle{animation:wiggle .7s 2.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bounce{0%{transform:translateY(-120px)}60%{transform:translateY(0)}75%{transform:translateY(-16px)}100%{transform:none}}
.bounce{animation:bounce .8s .1s cubic-bezier(.3,.7,.4,1) both}
@keyframes tw{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1) rotate(45deg);opacity:1}}
.tw{position:absolute;animation:tw 1.8s ease-in-out infinite}
.q{display:flex;align-items:center;gap:12px;padding:14px 16px}
.qi{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.track{height:12px;border-radius:99px;background:var(--paper-100);overflow:hidden;margin-top:8px}
</style>
<link rel="stylesheet" href="design-system.css">
</helmet>

    <div style="position: relative; width: 170px; height: 142px; margin: 0 auto">
      <div aria-hidden="true" style="position: absolute; left: 50%; top: 54%; width: 220px; height: 190px; margin: -95px 0 0 -110px; border-radius: 999px; background: radial-gradient(ellipse 50% 50% at 50% 50%, var(--gold-150), transparent 72%)"></div>
      <svg class="tw" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="left: 14px; top: 8px; animation-delay: .4s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="var(--gold-400)"></path></svg>
      <svg class="tw" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" style="right: 10px; top: 28px; animation-delay: 1s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="var(--gold-600)"></path></svg>
    <div class="bounce" style="display: inline-block; position: relative"><div class="wiggle">
      <svg viewBox="0 0 120 100" width="170" height="142" aria-hidden="true">
        <defs>
          <linearGradient id="dqWood" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ef9a5c"></stop>
            <stop offset=".45" stop-color="var(--orange-600)"></stop>
            <stop offset="1" stop-color="#7c2d0a"></stop>
          </linearGradient>
          <linearGradient id="dqLid" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffd27a"></stop>
            <stop offset="1" stop-color="var(--gold-600)"></stop>
          </linearGradient>
          <linearGradient id="dqBrass" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe49a"></stop>
            <stop offset="1" stop-color="var(--gold-700)"></stop>
          </linearGradient>
        </defs>
        <ellipse cx="60" cy="98" rx="54" ry="5.5" fill="rgba(0,0,0,.25)"></ellipse>
        <rect x="8" y="40" width="104" height="56" rx="20" fill="url(#dqWood)" stroke="#5c1e05" stroke-width="5"></rect>
        <path d="M40 48v40M80 48v40" stroke="#5c1e05" stroke-width="1.5" opacity=".5"></path>
        <path d="M8 42h14v8a4 4 0 0 1-4 4H8z" fill="url(#dqBrass)"></path>
        <path d="M112 42h-14v8a4 4 0 0 0 4 4h10z" fill="url(#dqBrass)"></path>
        <path d="M8 46 Q60 2 112 46 V54 Q60 62 8 54z" fill="url(#dqLid)" stroke="#5c3d08" stroke-width="5" stroke-linejoin="round"></path>
        <path d="M22 42 Q60 14 98 42" stroke="#b97a12" stroke-width="1.6" fill="none" opacity=".55"></path>
        <ellipse cx="38" cy="22" rx="16" ry="6" fill="#fff" opacity=".3" transform="rotate(-16 38 22)"></ellipse>
        <rect x="46" y="44" width="28" height="22" rx="5" fill="url(#dqBrass)" stroke="#5c3d08" stroke-width="3"></rect>
        <circle cx="60" cy="54" r="3.5" fill="#4a1703"></circle>
        <rect x="8" y="66" width="104" height="6" fill="#5c1e05" opacity=".5"></rect>
      </svg>
    </div></div>
    </div>
    <h1 class="disp rise" style="margin: 14px 24px 0; font-size: 26px; line-height: 1.2; font-weight: 900; animation-delay: 2.4s">Задания дня выполнены!</h1>
    <p class="muted rise" style="margin: 8px 30px 0; font-size: 15px; animation-delay: 2.5s">Сундук твой. Новые задания завтра в полночь</p>
  </div>

  <div class="card rise" style="margin: 22px 20px 0; animation-delay: .3s">
    <div class="q" style="border-bottom: 2px solid var(--paper-400)">
      <div class="qi" style="background: var(--green-100); color: var(--green-500)"><svg class="ico" viewBox="0 0 24 24" style="width: 24px; height: 24px"><path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2z"></path><path d="M22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"></path></svg></div>
      <div style="flex: 1"><div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 15px"><span>Прочитать 10 минут</span><span style="color:var(--gold-text); font-variant-numeric: tabular-nums">10/10</span></div><div class="track"><div class="fq" style="--from: 70%; --d: .6s"></div></div></div>
      <svg class="chk" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" style="--d: 1.3s"><circle cx="12" cy="12" r="11" fill="var(--green-400)"></circle><path d="M7 12l3.5 3.5L17 9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
    <div class="q" style="border-bottom: 2px solid var(--paper-400)">
      <div class="qi" style="background: var(--blue-100); color: var(--blue-text)"><svg class="ico" viewBox="0 0 24 24" style="width: 24px; height: 24px"><rect x="3" y="6" width="14" height="14" rx="2"></rect><path d="M7 2h12a2 2 0 0 1 2 2v12"></path></svg></div>
      <div style="flex: 1"><div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 15px"><span>Повторить 15 слов</span><span style="color:var(--gold-text); font-variant-numeric: tabular-nums">15/15</span></div><div class="track"><div class="fq" style="--from: 80%; --d: 1.2s"></div></div></div>
      <svg class="chk" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" style="--d: 1.9s"><circle cx="12" cy="12" r="11" fill="var(--green-400)"></circle><path d="M7 12l3.5 3.5L17 9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
    <div class="q">
      <div class="qi" style="background: var(--gold-150); color: var(--orange-text)"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z" fill="var(--gold-500)"></path><path d="M12 12c.6 2 3 3 3 5.5a3 3 0 0 1-6 0c0-1.5 1-2.5 1.5-3.5.2 1 .7 1.5 1.2 1.5 0-1.5-.4-2.5.3-3.5z" fill="var(--gold-400)"></path><path d="M12 15.8c.2.9 1.1 1.3 1.1 2.2a1.1 1.1 0 0 1-2.2 0c0-.5.3-.9.5-1.3.1.3.2.5.4.5 0-.5-.1-.9.2-1.4z" fill="var(--gold-100)"></path></svg></div>
      <div style="flex: 1"><div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 15px"><span>5 верных подряд</span><span style="color:var(--gold-text); font-variant-numeric: tabular-nums">5/5</span></div><div class="track"><div class="fq" style="--from: 60%; --d: 1.8s"></div></div></div>
      <svg class="chk" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" style="--d: 2.5s"><circle cx="12" cy="12" r="11" fill="var(--green-400)"></circle><path d="M7 12l3.5 3.5L17 9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
  </div>

  <div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px; animation-delay: 2.8s">
    <a class="btn b-sun" href="Chest.dc.html">Открыть сундук</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = Date.now();
    this.ivx = setInterval(() => { this.forceUpdate(); if (Date.now() - this.t0 > 3000) clearInterval(this.ivx); }, 33);
  }
  componentWillUnmount() { clearInterval(this.ivx); }
  cu(to, delay, dur) {
    const el = this.t0 ? Date.now() - this.t0 : 0;
    const p = Math.min(1, Math.max(0, (el - delay) / dur));
    return Math.round(to * (1 - Math.pow(1 - p, 3)));
  }
  renderVals() {
    return { q1: 7 + this.cu(3, 600, 700), q2: 12 + this.cu(3, 1200, 700), q3: 3 + this.cu(2, 1800, 700) };
  }
}
</script>
