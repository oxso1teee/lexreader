<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Занятие: на слух</title></head>
<body>
<x-dc>
<helmet>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
<style>
body{margin:0;background:var(--paper-200)}
a{color:var(--green-500)}a:hover{color:var(--green-text)}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:var(--paper-50);color:var(--ink-900);font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l)}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-leaf{--f:var(--fill-leaf);--e:var(--fill-leaf-edge);--l:#fff}
.b-ghost{--f:var(--paper-100);--e:var(--shadow-ghost);--l:var(--ink-900)}
.muted{color:rgba(var(--ink-rgb),.68)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:none;border-radius:12px;color:rgba(var(--ink-rgb),.68);cursor:pointer;text-decoration:none}
.bar{flex:1;height:16px;border-radius:99px;background:var(--paper-100);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--fill-leaf);box-shadow:inset 0 -4px 0 0 rgba(0,0,0,.12);position:relative}
.fill::after{content:"";position:absolute;left:10px;right:10px;top:3px;height:4px;border-radius:99px;background:rgba(0,0,0,.2)}
@keyframes wave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.wv{display:block;width:5px;border-radius:3px;background:#fff;animation:wave 1s ease-in-out infinite}
@keyframes blink{50%{opacity:0}}
.caret{display:inline-block;width:2px;height:22px;background:var(--fill-leaf);vertical-align:-4px;margin-left:1px;animation:blink 1s step-end infinite}
</style>
<link rel="stylesheet" href="design-system.css">
</helmet>
<div class="app">

<div style="display: flex; align-items: center; gap: 10px; padding: 52px 12px 0 8px">
  <a class="iconbtn" href="Main.dc.html" aria-label="Закрыть занятие"><svg class="ico" viewBox="0 0 24 24" style="width: 26px; height: 26px"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
  <div class="bar" role="progressbar" aria-label="Прогресс занятия" aria-valuemin="0" aria-valuemax="12" aria-valuenow="11"><div class="fill" style="width: 88%"></div></div>
  <div style="display: flex; align-items: center; gap: 4px; font-weight: 700; color: var(--orange-text); font-size: 15px; padding-right: 6px">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z" fill="var(--gold-500)"></path><path d="M12 12c.6 2 3 3 3 5.5a3 3 0 0 1-6 0c0-1.5 1-2.5 1.5-3.5.2 1 .7 1.5 1.2 1.5 0-1.5-.4-2.5.3-3.5z" fill="var(--gold-400)"></path><path d="M12 15.8c.2.9 1.1 1.3 1.1 2.2a1.1 1.1 0 0 1-2.2 0c0-.5.3-.9.5-1.3.1.3.2.5.4.5 0-.5-.1-.9.2-1.4z" fill="var(--gold-100)"></path></svg>6
  </div>
</div>

<div style="padding: 26px 20px 0">
  <div style="font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--blue-text)">Аудирование · задание 11 из 12</div>
  <h1 class="disp" style="margin: 8px 0 0; font-size: 22px; line-height: 1.25; font-weight: 700">Напиши, что услышишь</h1>

  <div style="display: flex; gap: 14px; justify-content: center; align-items: center; margin-top: 34px">
    <button type="button" aria-label="Прослушать" style="width: 132px; height: 132px; border-radius: 32px; border: 0; background: var(--fill-sky); box-shadow: inset 0 -8px 0 0 var(--fill-sky-edge); display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; padding-bottom: 8px">
      <span class="wv" style="height: 26px"></span><span class="wv" style="height: 44px; animation-delay: .15s"></span><span class="wv" style="height: 58px; animation-delay: .3s"></span><span class="wv" style="height: 40px; animation-delay: .45s"></span><span class="wv" style="height: 24px; animation-delay: .6s"></span>
    </button>
    <button type="button" aria-label="Прослушать медленно" style="width: 76px; height: 76px; border-radius: 22px; border: 2px solid rgba(var(--ink-rgb),.18); background:var(--paper-0); box-shadow: inset 0 -4px 0 0 rgba(var(--ink-rgb),.12); color: var(--blue-text); font: 700 17px/1 Onest, sans-serif; cursor: pointer">0.5×</button>
  </div>

  <label for="ans" class="muted" style="display: block; font-size: 13px; font-weight: 600; margin-top: 34px">Твой ответ</label>
  <div style="margin-top: 8px; min-height: 150px; border-radius: 20px; background:var(--paper-0); border: 2px solid var(--green-400); box-shadow: 0 0 0 4px var(--green-100); padding: 16px; font-size: 20px; line-height: 1.4">
    <span id="ans">She was reluctant to</span><span class="caret"></span>
  </div>
  <div class="muted" style="font-size: 13px; margin-top: 10px">Регистр и знаки препинания не важны</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px; border-top: 2px solid rgba(var(--ink-rgb),.1); display: flex; gap: 12px">
  <a class="btn b-ghost" href="Result.dc.html" style="flex: 0 0 auto; padding-left: 18px; padding-right: 18px">Не могу слушать</a>
  <a class="btn b-leaf" href="Result.dc.html" style="flex: 1">Проверить</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
