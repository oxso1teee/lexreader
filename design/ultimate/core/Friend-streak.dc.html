.inL{animation:inL .65s cubic-bezier(.2,.9,.3,1.1) both}.inR{animation:inR .65s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes ignite{0%,50%{transform:scale(0)}80%{transform:scale(1.25)}100%{transform:scale(1)}}
.ignite{animation:ignite 1s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:50% 85%}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.08) rotate(3deg)}}
.flick{animation:flick 1s 1s ease-in-out infinite;transform-origin:50% 90%}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.2);opacity:1}75%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}

@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.row{display:flex;align-items:center;gap:12px;padding:10px 0}
.sm{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font:700 14px/1 Onest,sans-serif;color:#fff;flex:none}

an class="cf" style="width:10px;height:10px;background:var(--fill-sky);border-radius:2px;--dx:186px;--dy:82px;--r:6deg;--d:0.70s;--t:1.86s"></span><span class="cf" style="width:7px;height:7px;background:var(--fill-leaf);border-radius:2px;--dx:22px;--dy:-214px;--r:-102deg;--d:0.73s;--t:1.54s"></span><span class="cf" style="width:9px;height:9px;background:var(--gold-500);border-radius:2px;--dx:166px;--dy:-21px;--r:-284deg;--d:0.62s;--t:1.33s"></span><span class="cf" style="width:6px;height:6px;background:var(--gold-400);border-radius:2px;--dx:-165px;--dy:1px;--r:-78deg;--d:0.68s;--t:1.82s"></span><span class="cf" style="width:10px;height:10px;background:var(--fill-warm);border-radius:2px;--dx:-11px;--dy:-220px;--r:312deg;--d:0.60s;--t:1.85s"></span><span class="cf" style="width:7px;height:14px;background:var(--fill-sky);border-radius:99px;--dx:134px;--dy:-143px;--r:-145deg;--d:0.70s;--t:1.64s"></span><span class="cf" style="width:9px;height:9px;background:var(--fill-leaf);border-radius:2px;--dx:-136px;--dy:-55px;--r:-108deg;--d:0.65s;--t:1.45s"></span><span class="cf" style="width:9px;height:9px;background:var(--gold-500);border-radius:2px;--dx:-178px;--dy:47px;--r:-101deg;--d:0.64s;--t:1.44s"></span><span class="cf" style="width:9px;height:18px;background:var(--gold-400);border-radius:99px;--dx:-34px;--dy:192px;--r:206deg;--d:0.60s;--t:1.30s"></span><span class="cf" style="width:10px;height:10px;background:var(--fill-warm);border-radius:99px;--dx:-158px;--dy:-96px;--r:154deg;--d:0.66s;--t:1.67s"></span><span class="cf" style="width:10px;height:20px;background:var(--fill-sky);border-radius:2px;--dx:0px;--dy:144px;--r:340deg;--d:0.73s;--t:1.24s"></span><span class="cf" style="width:10px;height:20px;background:var(--fill-leaf);border-radius:99px;--dx:-197px;--dy:-48px;--r:291deg;--d:0.69s;--t:1.24s"></span><span class="cf" style="width:7px;height:7px;background:var(--gold-500);border-radius:99px;--dx:175px;--dy:-113px;--r:231deg;--d:0.62s;--t:1.32s"></span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = Date.now();
    this.ivx = setInterval(() => { this.forceUpdate(); if (Date.now() - this.t0 > 2200) clearInterval(this.ivx); }, 33);
  }
  componentWillUnmount() { clearInterval(this.ivx); }
  cu(to, delay, dur) {
    const el = this.t0 ? Date.now() - this.t0 : 0;
    const p = Math.min(1, Math.max(0, (el - delay) / dur));
    return Math.round(to * (1 - Math.pow(1 - p, 3)));
  }
  renderVals() {
    let s = 61;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cols = ['var(--gold-500)', 'var(--gold-400)', 'var(--fill-warm)', 'var(--blue-500)', 'var(--green-400)'];
    const cf = [];
    for (let i = 0; i < 26; i++) {
      const a = r() * Math.PI * 2;
      const d = 110 + r() * 110;
      const w = 6 + Math.round(r() * 5);
      cf.push({ style: 'width:' + w + 'px;height:' + (r() < .5 ? w : w * 2) + 'px;background:' + cols[i % 5] + ';border-radius:' + (r() < .3 ? '99px' : '2px') + ';--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d) + 'px;--r:' + Math.round(r() * 720 - 360) + 'deg;--d:' + (0.6 + r() * 0.15).toFixed(2) + 's;--t:' + (1.2 + r() * 0.7).toFixed(2) + 's' });
    }
    return { cf, n: this.cu(10, 900, 900) };
  }
}
</script>
