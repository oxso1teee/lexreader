<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = Date.now();
    this.iv = setInterval(() => { this.forceUpdate(); if (Date.now() - this.t0 > 2000) clearInterval(this.iv); }, 40);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const el = this.t0 ? Date.now() - this.t0 : 0;
    const names = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
    const step = Math.min(2, Math.floor(Math.max(0, el - 500) / 400));
    const lit = el >= 500;
    const lv = names.map((t, k) => {
      let style = 'background: var(--paper-100); color:rgba(var(--ink-rgb),.62)';
      if (lit && k < step) style = 'background: var(--green-200); color: var(--green-text)';
      if (lit && k === step) style = 'background: var(--fill-leaf); color: #fff; box-shadow: inset 0 -4px 0 0 var(--fill-leaf-edge)';
      return { t, style };
    });
    let s = 13;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cols = ['var(--green-400)', 'var(--gold-400)', 'var(--blue-400)', 'var(--gold-500)', 'var(--green-200)'];
    const cf = [];
    for (let i = 0; i < 26; i++) {
      const a = r() * Math.PI * 2;
      const d = 100 + r() * 120;
      const w = 6 + Math.round(r() * 5);
      cf.push({ style: 'width:' + w + 'px;height:' + (r() < .5 ? w : w * 2) + 'px;background:' + cols[i % 5] + ';border-radius:' + (r() < .3 ? '99px' : '2px') + ';--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d) + 'px;--r:' + Math.round(r() * 720 - 360) + 'deg;--d:' + (2 + r() * 0.15).toFixed(2) + 's;--t:' + (1.1 + r() * 0.6).toFixed(2) + 's' });
    }
    return { lv, cf };
  }
}
</script>
