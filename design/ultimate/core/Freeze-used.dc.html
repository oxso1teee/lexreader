<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
<style>
body{margin:0;background:var(--paper-200)}
a{color:var(--blue-text)}a:hover{color:var(--blue-text)}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:var(--blue-100);color:var(--ink-900);font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-sky{--f:var(--fill-sky);--e:var(--fill-sky-edge);--l:#fff}
.card{background:var(--paper-0);border:2px solid rgba(var(--blue-600-rgb),.25);border-radius:20px}
.muted{color:rgba(var(--ink-rgb),.68)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes freeze{0%{transform:scale(.3) rotate(-10deg);opacity:0}60%{transform:scale(1.08) rotate(2deg);opacity:1}100%{transform:none}}
.freeze{animation:freeze .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.float{animation:float 3s .8s ease-in-out infinite}
@keyframes shimmer{0%{transform:translateX(-80px) rotate(25deg)}100%{transform:translateX(240px) rotate(25deg)}}
.shim{position:absolute;top:-40px;width:30px;height:260px;background:rgba(255,255,255,.7);animation:shimmer 2.6s 1s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}
.breathe{animation:breathe 2s ease-in-out infinite;transform-origin:50% 85%}
@keyframes snow{0%{transform:translate(0,-30px) rotate(0)}100%{transform:translate(var(--dx),880px) rotate(360deg)}}
.sn{position:absolute;top:0;color:#fff;animation:snow var(--t) var(--d) linear infinite}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes flake{0%{transform:scale(0) rotate(-180deg)}70%{transform:scale(1.3) rotate(10deg)}100%{transform:none}}
.flake{animation:flake .6s 1.2s cubic-bezier(.2,.9,.3,1.2) both}
.day{height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
</style>
<link rel="stylesheet" href="design-system.css">
</helmet>

    <svg class="sn ico" viewBox="0 0 24 24" style="left:44px;width:18px;height:18px;opacity:0.98;--dx:24px;--t:9.71s;--d:-4.95s" aria-hidden="true"><path d="M12 2v20M4.9 4.9l14.2 14.2M2 12h20M4.9 19.1 19.1 4.9"></path></svg>

    <svg class="sn ico" viewBox="0 0 24 24" style="left:96px;width:19px;height:19px;opacity:0.55;--dx:6px;--t:9.52s;--d:-3.89s" aria-hidden="true"><path d="M12 2v20M4.9 4.9l14.2 14.2M2 12h20M4.9 19.1 19.1 4.9"></path></svg>
  
    <svg class="sn ico" viewBox="0 0 24 24" style="left:240px;width:20px;height:20px;opacity:0.92;--dx:-4px;--t:8.53s;--d:-4.59s" aria-hidden="true"><path d="M12 2v20M4.9 4.9l14.2 14.2M2 12h20M4.9 19.1 19.1 4.9"></path></svg>

  <div style="position: relative; text-align: center; padding-top: 130px">

        <div style="position: absolute; inset: 0; border-radius: 36px; background: rgba(255,255,255,.6); border: 4px solid #fff; box-shadow: inset 0 -12px 0 0 rgba(28,176,246,.35), inset 0 0 0 10px rgba(255,255,255,.35); overflow: hidden">

        <div class="breathe" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">
          <svg viewBox="0 0 24 24" width="118" height="118" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z" fill="var(--gold-500)"></path><path d="M12 12c.6 2 3 3 3 5.5a3 3 0 0 1-6 0c0-1.5 1-2.5 1.5-3.5.2 1 .7 1.5 1.2 1.5 0-1.5-.4-2.5.3-3.5z" fill="var(--gold-400)"></path><path d="M12 15.8c.2.9 1.1 1.3 1.1 2.2a1.1 1.1 0 0 1-2.2 0c0-.5.3-.9.5-1.3.1.3.2.5.4.5 0-.5-.1-.9.2-1.4z" fill="var(--gold-100)"></path></svg>
        </div>
      </div>
    </div>
    <h1 class="disp rise" style="margin: 30px 24px 0; font-size: 26px; line-height: 1.2; font-weight: 900; color: var(--blue-text); animation-delay: .5s">Заморозка спасла стрик</h1>
    <p class="rise" style="margin: 12px 30px 0; font-size: 16px; line-height: 1.45; animation-delay: .62s">Вчера ты не занимался, но серия <b>12 дней</b> цела.</p>
  </div>

  <div class="card rise" style="position: relative; margin: 26px 20px 0; padding: 14px 16px; animation-delay: .8s">
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: 12px; font-weight: 600">
      <div><div class="day" style="background: var(--gold-500)"></div><div class="muted" style="margin-top: 4px">Пн</div></div>
      <div><div class="day" style="background: var(--gold-500)"></div><div class="muted" style="margin-top: 4px">Вт</div></div>
      <div><div class="day flake" style="background: var(--blue-400); color: #fff"><svg class="ico" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="M12 2v20M4.9 4.9l14.2 14.2M2 12h20M4.9 19.1 19.1 4.9"></path></svg></div><div style="margin-top: 4px; color: var(--blue-text); font-weight: 700">Ср</div></div>
      <div><div class="day" style="background:var(--paper-0); border: 2px dashed var(--gold-500)"></div><div style="margin-top: 4px; color: var(--orange-text); font-weight: 700">Чт</div></div>
      <div><div class="day" style="background: var(--paper-100)"></div><div class="muted" style="margin-top: 4px">Пт</div></div>
      <div><div class="day" style="background: var(--paper-100)"></div><div class="muted" style="margin-top: 4px">Сб</div></div>
      <div><div class="day" style="background: var(--paper-100)"></div><div class="muted" style="margin-top: 4px">Вс</div></div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    let s = 51;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const snow = [];
    for (let i = 0; i < 12; i++) {
      const w = 10 + Math.round(r() * 10);
      snow.push({ style: 'left:' + Math.round(r() * 370) + 'px;width:' + w + 'px;height:' + w + 'px;opacity:' + (0.5 + r() * 0.5).toFixed(2) + ';--dx:' + Math.round(r() * 60 - 30) + 'px;--t:' + (6 + r() * 5).toFixed(2) + 's;--d:' + (-r() * 8).toFixed(2) + 's' });
    }
    return { snow };
  }
}
</script>
