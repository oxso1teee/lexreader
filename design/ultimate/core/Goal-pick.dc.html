<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
<style>
body{margin:0;background:var(--paper-200)}
a{color:var(--green-500)}a:hover{color:var(--green-text)}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:var(--paper-50);color:var(--ink-900);font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:54px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-leaf{--f:var(--fill-leaf);--e:var(--fill-leaf-edge);--l:#fff}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:rgba(var(--ink-rgb),.62);border:0;background:none}
.bar{flex:1;height:16px;border-radius:99px;background:var(--paper-100);overflow:hidden}
@keyframes grow{from{width:25%}to{width:50%}}
.fill{height:100%;border-radius:99px;background:var(--fill-leaf);box-shadow:inset 0 -4px 0 0 var(--fill-leaf-edge);animation:grow .7s .2s cubic-bezier(.4,0,.2,1) both}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.04)}100%{transform:none;opacity:1}}
.bubble{animation:pop .4s cubic-bezier(.2,.9,.3,1.3) both;transform-origin:0 100%}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px 16px;border-radius:18px;border:2px solid;font:700 16px/1.2 Onest,sans-serif;cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .08s}
.opt:active{transform:translateY(3px)}
.mins{width:62px;height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;transition:background .15s}
.radio{width:26px;height:26px;border-radius:999px;border:2px solid rgba(var(--ink-rgb),.25);display:flex;align-items:center;justify-content:center;flex:none;transition:all .15s}
@keyframes chk{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:none}}
.chk{animation:chk .3s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes swap{0%{transform:translateY(6px);opacity:0}100%{transform:none;opacity:1}}
.swap{animation:swap .3s ease-out both}

<link rel="stylesheet" href="design-system.css">

        <span class="mins" style="background: var(--paper-50); color: var(--ink-900)"><span class="disp" style="font-size: 19px; font-weight: 900; line-height: 1">5</span><span style="font-size: 11px; font-weight: 700; margin-top: 2px">мин</span></span>

        <span class="radio" style=""></span>
      </button>
    
      <button class="opt rise" type="button" role="radio" aria-checked="false" style="background:var(--paper-0); border-color: rgba(var(--ink-rgb),.15); color: var(--ink-900); box-shadow: inset 0 -4px 0 0 rgba(var(--ink-rgb),.08);animation-delay:0.36s">
        <span class="mins" style="background: var(--paper-50); color: var(--ink-900)"><span class="disp" style="font-size: 19px; font-weight: 900; line-height: 1">20</span><span style="font-size: 11px; font-weight: 700; margin-top: 2px">мин</span></span>
        <span style="flex: 1">Интенсив<span style="display: block; font-size: 13px; font-weight: 600; margin-top: 3px">Для тех, кто спешит</span></span>

    <div class="swap" style="animation-name: swap; animation-delay: 0s; --k:1">
      <div style="font-size: 13px; font-weight: 700; color: var(--green-500)">Через месяц это примерно</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 1 };
  }
  renderVals() {
    const data = [
      [5, 'Лёгкий', 'Пара страниц за кофе', 120, 'и первые главы рассказа'],
      [10, 'Обычный', 'Глава за два дня', 260, 'и одна короткая книга'],
      [15, 'Серьёзный', 'Глава в день', 380, 'и полторы книги'],
      [20, 'Интенсив', 'Для тех, кто спешит', 500, 'и две книги B1']
    ];
    const mouths = ['M55 73q5 2 10 0', 'M54 72q6 5 12 0', 'M53 71q7 7 14 0', 'M52 70q8 9 16 0'];
    const i = this.state.i;
    return {
      mouth: mouths[i],
      words: data[i][3],
      books: data[i][4],
      minLabel: data[i][0] + ' мин',
      swapKey: 'animation-name: swap; animation-delay: 0s; --k:' + i,
      goals: data.map((d, k) => {
        const on = k === i;
        return {
          min: d[0], label: d[1], sub: d[2], on,
          checked: on ? 'true' : 'false',
          style: (on ? 'background: var(--green-100); border-color: var(--green-400); color:var(--green-text); box-shadow: inset 0 -4px 0 0 var(--green-400);' : 'background:var(--paper-0); border-color: rgba(var(--ink-rgb),.15); color: var(--ink-900); box-shadow: inset 0 -4px 0 0 rgba(var(--ink-rgb),.08);') + 'animation-delay:' + (0.15 + k * 0.07).toFixed(2) + 's',
          mstyle: on ? 'background: var(--fill-leaf); color: #fff' : 'background: var(--paper-50); color: var(--ink-900)',
          rstyle: on ? 'background: var(--fill-leaf); border-color: var(--green-400)' : '',
          pick: () => this.setState({ i: k })
        };
      })
    };
  }
}
</script>
