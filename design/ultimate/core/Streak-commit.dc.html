<helmet>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
<style>
body{margin:0;background:var(--paper-200)}
a{color:var(--green-500)}a:hover{color:var(--green-text)}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:var(--paper-50);color:var(--ink-900);font-family:Onest,system-ui,sans-serif;box-sizing:border-box}

.disp{font-family:Unbounded,Onest,sans-serif}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:54px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-ember{--f:var(--fill-ember);--e:var(--fill-ember-edge);--l:#fff}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:rgba(var(--ink-rgb),.62);border:0;background:none}
.bar{flex:1;height:16px;border-radius:99px;background:var(--paper-100);overflow:hidden}
@keyframes grow{from{width:50%}to{width:75%}}
.fill{height:100%;border-radius:99px;background:var(--fill-leaf);box-shadow:inset 0 -4px 0 0 var(--fill-leaf-edge);animation:grow .7s .2s cubic-bezier(.4,0,.2,1) both}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.05,.96) rotate(2deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-origin:50% 90%}
@keyframes emb{0%{transform:translate(0,0) scale(1);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-110px) scale(.3);opacity:0}}
.emb{position:absolute;left:50%;bottom:30px;width:7px;height:7px;border-radius:99px;background:var(--gold-400);animation:emb var(--t) var(--d) ease-out infinite}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 14px 16px;border-radius:18px;border:2px solid;cursor:pointer;text-align:left;font-family:Onest,sans-serif;transition:background .15s,border-color .15s,color .15s,transform .08s}
.tile:active{transform:translateY(3px)}
.badge{position:absolute;right:10px;top:10px;width:24px;height:24px;border-radius:99px;background:var(--fill-ember);display:flex;align-items:center;justify-content:center}
@keyframes chk{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:none}}
.chk{animation:chk .3s cubic-bezier(.2,.9,.3,1.3) both}
.dot{aspect-ratio:1;border-radius:999px;transition:background .25s, transform .25s}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}

        <span style="font-size: 14px; font-weight: 700">дней · серьёзно</span>

      <button class="tile rise" type="button" role="radio" aria-checked="false" style="border-color: rgba(var(--ink-rgb),.15); background:var(--paper-0); color: var(--ink-900); box-shadow: inset 0 -5px 0 0 rgba(var(--ink-rgb),.08);animation-delay:0.28s">

    <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700"><span>Твоя серия</span><span style="color: var(--orange-text)">7 дней</span></div>
    <div style="display: grid; grid-template-columns: repeat(25, minmax(0, 1fr)); gap: 4px; margin-top: 10px" aria-hidden="true">

tyle="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span><span class="dot" style="background: var(--paper-100)"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; font-weight: 600; color: rgba(var(--ink-rgb),.68)">
      <svg viewBox="0 0 120 100" width="24" height="20" aria-hidden="true"><rect x="10" y="40" width="100" height="54" rx="10" fill="var(--orange-600)"></rect><path d="M10 46 Q60 6 110 46 V52 H10z" fill="var(--gold-500)"></path><rect x="50" y="44" width="20" height="24" rx="5" fill="var(--gold-400)"></rect></svg>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px">
    <a class="btn b-ember" href="First-text.dc.html">Беру обязательство: 7 дней</a>
  </div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0 };
  }
  renderVals() {
    const data = [[7, 'хороший старт', 'Сундук за первую неделю'], [14, 'уже привычка', 'Сундук и бейдж «Две недели»'], [30, 'серьёзно', 'Сундук, бейдж и рамка аватара'], [50, 'железная воля', 'Всё выше и золотой огонёк']];
    const i = this.state.i;
    const n = data[i][0];
    let s = 9;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const embers = [];
    const cnt = 4 + i * 3;
    for (let k = 0; k < cnt; k++) embers.push({ style: '--dx:' + Math.round(r() * 90 - 45) + 'px;--t:' + (1.4 + r()).toFixed(2) + 's;--d:' + (-r() * 2).toFixed(2) + 's;margin-left:' + Math.round(r() * 40 - 24) + 'px' });
    const dots = [];
    for (let k = 0; k < 50; k++) {
      if (k < n) dots.push('background: ' + (k % 7 === 6 ? 'var(--orange-600)' : 'var(--gold-500)') + '; transition-delay: ' + (k * 0.012).toFixed(3) + 's');
      else dots.push('background: var(--paper-100)');
    }
    return {
      flame: [92, 108, 124, 140][i],
      chosen: n + ' дней',
      reward: data[i][2],
      embers, dots,
      opts: data.map((d, k) => {
        const on = k === i;
        return {
          n: d[0], word: d[1], on,
          checked: on ? 'true' : 'false',
          style: (on ? 'border-color: var(--gold-500); background: var(--gold-150); color: var(--orange-text); box-shadow: inset 0 -5px 0 0 var(--gold-500);' : 'border-color: rgba(var(--ink-rgb),.15); background:var(--paper-0); color: var(--ink-900); box-shadow: inset 0 -5px 0 0 rgba(var(--ink-rgb),.08);') + 'animation-delay:' + (0.1 + k * 0.06).toFixed(2) + 's',
          pick: () => this.setState({ i: k })
        };
      })
    };
  }
}
</script>
