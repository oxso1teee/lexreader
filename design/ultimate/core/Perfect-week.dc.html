body{margin:0;background:var(--paper-200)}
a{color:var(--green-500)}a:hover{color:var(--green-text)}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:var(--paper-50);color:var(--ink-900);font-family:Onest,system-ui,sans-serif;box-sizing:border-box}

.card{background:var(--paper-0);border:2px solid rgba(var(--ink-rgb),.18);border-radius:20px}
.muted{color:rgba(var(--ink-rgb),.68)}
@keyframes halo{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.halo{animation:halo .7s .2s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 10s linear infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.08) rotate(3deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-origin:50% 90%}
@keyframes grow{from{width:0}to{width:100%}}
.grow{animation:grow 1.4s .7s cubic-bezier(.4,0,.2,1) both}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes lit{0%{color:rgba(var(--ink-rgb),.62)}100%{color:var(--orange-text)}}
.lit{animation:lit .2s both}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.2);opacity:1}75%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
.cf{position:absolute;left:0;top:0;animation:burst var(--t) var(--d) cubic-bezier(.1,.7,.3,1) both}

ss="cf" style="width:10px;height:10px;background:var(--gold-500);border-radius:2px;--dx:5px;--dy:-187px;--r:-111deg;--d:2.10s;--t:1.57s"></span><span class="cf" style="width:8px;height:8px;background:var(--fill-leaf);border-radius:2px;--dx:-168px;--dy:128px;--r:77deg;--d:2.21s;--t:1.47s"></span><span class="cf" style="width:10px;height:10px;background:var(--blue-400);border-radius:99px;--dx:-162px;--dy:129px;--r:-217deg;--d:2.18s;--t:1.28s"></span><span class="cf" style="width:6px;height:12px;background:var(--gold-400);border-radius:99px;--dx:193px;--dy:18px;--r:-26deg;--d:2.18s;--t:1.52s"></span><span class="cf" style="width:10px;height:10px;background:var(--gold-500);border-radius:2px;--dx:-26px;--dy:-129px;--r:154deg;--d:2.17s;--t:1.83s"></span><span class="cf" style="width:11px;height:22px;background:var(--fill-leaf);border-radius:2px;--dx:-168px;--dy:-108px;--r:-123deg;--d:2.24s;--t:1.52s"></span><span class="cf" style="width:9px;height:18px;background:var(--blue-400);border-radius:99px;--dx:-137px;--dy:35px;--r:32deg;--d:2.19s;--t:1.28s"></span><span class="cf" style="width:9px;height:9px;background:var(--gold-400);border-radius:2px;--dx:-82px;--dy:-149px;--r:283deg;--d:2.12s;--t:1.84s"></span><span class="cf" style="width:7px;height:14px;background:var(--gold-500);border-radius:2px;--dx:-154px;--dy:-29px;--r:-136deg;--d:2.16s;--t:1.73s"></span><span class="cf" style="width:10px;height:10px;background:var(--fill-leaf);border-radius:2px;--dx:-144px;--dy:75px;--r:304deg;--d:2.18s;--t:1.79s"></span><span class="cf" style="width:6px;height:6px;background:var(--blue-400);border-radius:99px;--dx:-139px;--dy:-81px;--r:-14deg;--d:2.12s;--t:1.75s"></span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = Date.now();
    this.ivx = setInterval(() => { this.forceUpdate(); if (Date.now() - this.t0 > 3200) clearInterval(this.ivx); }, 33);
  }
  componentWillUnmount() { clearInterval(this.ivx); }
  cu(to, delay, dur) {
    const el = this.t0 ? Date.now() - this.t0 : 0;
    const p = Math.min(1, Math.max(0, (el - delay) / dur));
    return Math.round(to * (1 - Math.pow(1 - p, 3)));
  }
  renderVals() {
    let s = 41;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cols = ['var(--gold-400)', 'var(--gold-500)', 'var(--green-400)', 'var(--blue-400)'];
    const cf = [];
    for (let i = 0; i < 24; i++) {
      const a = r() * Math.PI * 2;
      const d = 120 + r() * 100;
      const w = 6 + Math.round(r() * 5);
      cf.push({ style: 'width:' + w + 'px;height:' + (r() < .5 ? w : w * 2) + 'px;background:' + cols[i % 4] + ';border-radius:' + (r() < .3 ? '99px' : '2px') + ';--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d) + 'px;--r:' + Math.round(r() * 720 - 360) + 'deg;--d:' + (2.1 + r() * 0.15).toFixed(2) + 's;--t:' + (1.2 + r() * 0.7).toFixed(2) + 's' });
    }
    return { cf, xp: this.cu(20, 2400, 700) };
  }
}
</script>
