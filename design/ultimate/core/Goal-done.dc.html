<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.s = Date.now();
    this.iv = setInterval(() => { this.forceUpdate(); if (Date.now() - this.s > 1800) clearInterval(this.iv); }, 30);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const p = this.s ? Math.min(1, Math.max(0, (Date.now() - this.s - 200) / 1300)) : 0;
    const e = 1 - Math.pow(1 - p, 3);
    let s = 9;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cols = ['var(--gold-400)', 'var(--green-400)', 'var(--blue-400)', 'var(--gold-500)', 'var(--red-400)'];
    const cf = [];
    for (let i = 0; i < 28; i++) {
      const a = r() * Math.PI * 2;
      const d = 140 + r() * 100;
      const w = 6 + Math.round(r() * 6);
      cf.push({ style: 'width:' + w + 'px;height:' + (r() < .5 ? w : w * 2) + 'px;background:' + cols[i % 5] + ';border-radius:' + (r() < .3 ? '99px' : '2px') + ';--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d + 40) + 'px;--r:' + Math.round(r() * 720 - 360) + 'deg;--d:' + (1.5 + r() * 0.15).toFixed(2) + 's;--t:' + (1.2 + r() * 0.8).toFixed(2) + 's' });
    }
    return { cf, offset: (565.5 * (1 - e)).toFixed(1), offset2: (603.2 * (1 - e)).toFixed(1), xp: Math.round(e * 50) };
  }
}
</script>
