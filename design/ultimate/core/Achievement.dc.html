<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Новое достижение</title></head>
<body>
<x-dc>
<helmet>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
<style>
body{margin:0;background:var(--paper-200)}
a{color:var(--green-500)}a:hover{color:var(--green-text)}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:var(--paper-50);color:var(--ink-900);font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-leaf{--f:var(--fill-leaf);--e:var(--fill-leaf-edge);--l:#fff}
.card{background:var(--paper-0);border:2px solid rgba(var(--ink-rgb),.18);border-radius:20px}
.muted{color:rgba(var(--ink-rgb),.68)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes flip{0%{transform:perspective(700px) rotateY(540deg) scale(.4);opacity:0}60%{transform:perspective(700px) rotateY(-12deg) scale(1.08);opacity:1}80%{transform:perspective(700px) rotateY(6deg) scale(.98)}100%{transform:perspective(700px) rotateY(0) scale(1)}}
.flip{animation:flip 1.1s cubic-bezier(.2,.8,.3,1) both}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hover{animation:hover 3s 1.2s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-160px) rotate(25deg)}100%{transform:translateX(240px) rotate(25deg)}}
.shine{position:absolute;top:-40px;width:40px;height:280px;background:rgba(255,255,255,.55);animation:shine 2.6s 1.2s ease-in-out infinite}
@keyframes rays{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.rays{animation:rays 18s linear infinite}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes tw{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1) rotate(45deg);opacity:1}}
.tw{position:absolute;animation:tw 1.8s ease-in-out infinite}
@keyframes mp{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.mp{animation:mp .35s cubic-bezier(.2,.9,.3,1.3) both}
.mini{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center}
</style>
<link rel="stylesheet" href="design-system.css">
</helmet>
<div class="app">
  <div class="rise" style="text-align: center; padding-top: 64px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--blue-text); animation-delay: .2s">Новое достижение</div>

  <div style="position: relative; height: 290px; display: flex; align-items: center; justify-content: center; margin-top: 14px">
    <svg class="rays" viewBox="0 0 300 300" width="300" height="300" aria-hidden="true" style="position: absolute; opacity: .7">
      <g fill="var(--blue-100)"><path d="M150 150 L140 0 L160 0 Z"></path><path d="M150 150 L140 0 L160 0 Z" transform="rotate(45 150 150)"></path><path d="M150 150 L140 0 L160 0 Z" transform="rotate(90 150 150)"></path><path d="M150 150 L140 0 L160 0 Z" transform="rotate(135 150 150)"></path><path d="M150 150 L140 0 L160 0 Z" transform="rotate(180 150 150)"></path><path d="M150 150 L140 0 L160 0 Z" transform="rotate(225 150 150)"></path><path d="M150 150 L140 0 L160 0 Z" transform="rotate(270 150 150)"></path><path d="M150 150 L140 0 L160 0 Z" transform="rotate(315 150 150)"></path></g>
    </svg>
    <svg class="tw" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="left: 64px; top: 40px; animation-delay: 1s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="var(--gold-400)"></path></svg>
    <svg class="tw" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="right: 70px; top: 70px; animation-delay: 1.4s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="var(--blue-400)"></path></svg>
    <svg class="tw" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="right: 84px; bottom: 30px; animation-delay: 1.8s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="var(--gold-400)"></path></svg>
    <div class="flip"><div class="hover" style="position: relative; width: 200px; height: 258px">
      <svg viewBox="0 0 10 10" preserveAspectRatio="none" style="position: absolute; left: 50%; top: 150px; width: 112px; height: 90px; margin-left: -56px; z-index: -1" aria-hidden="true"><polygon points="1.5,0 8.5,0 8.5,9 5,6.6 1.5,9" fill="var(--gold-600)"></polygon></svg>
      <svg viewBox="0 0 10 10" preserveAspectRatio="none" style="position: absolute; left: 50%; top: 148px; width: 100px; height: 82px; margin-left: -50px; z-index: -1" aria-hidden="true"><polygon points="1.5,0 8.5,0 8.5,8 5,5.8 1.5,8" fill="var(--gold-400)"></polygon></svg>
      <div style="position: absolute; inset: 0 0 60px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--gold-600)"></div>
      <div style="position: absolute; inset: 4px 4px 64px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--blue-700)"></div>
      <div style="position: absolute; inset: 14px 13px 74px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: linear-gradient(135deg, var(--blue-400), var(--blue-500) 55%, var(--blue-700)); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff">
        <span class="shine" aria-hidden="true"></span>
        <svg class="ico" viewBox="0 0 24 24" style="width: 70px; height: 70px; stroke-width: 1.8"><path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2z"></path><path d="M22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"></path></svg>
        <div class="disp" style="font-size: 15px; font-weight: 900; margin-top: 8px">УРОВЕНЬ 2</div>
      </div>
    </div></div>
  </div>

  <div style="text-align: center; padding: 0 28px">
    <h1 class="disp rise" style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 900; animation-delay: .9s">Книжный червь</h1>
    <p class="muted rise" style="margin: 10px 0 0; font-size: 16px; animation-delay: 1s">Прочитано 10 глав на английском</p>
  </div>

  <div class="card rise" style="margin: 22px 20px 0; padding: 14px 16px; animation-delay: 1.15s">
    <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 700"><span>До уровня 3</span><span style="color: var(--blue-text)">10 / 25 глав</span></div>
    <div style="height: 12px; border-radius: 99px; background: var(--paper-100); margin-top: 8px; overflow: hidden"><div style="width: 40.0%; height: 100%; background: var(--fill-sky); border-radius: 99px"></div></div>
    <div style="display: flex; gap: 10px; margin-top: 14px; align-items: center">
      <div class="mini mp" style="background: var(--gold-150); animation-delay: 1.6s"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z" fill="var(--gold-500)"></path><path d="M12 12c.6 2 3 3 3 5.5a3 3 0 0 1-6 0c0-1.5 1-2.5 1.5-3.5.2 1 .7 1.5 1.2 1.5 0-1.5-.4-2.5.3-3.5z" fill="var(--gold-400)"></path><path d="M12 15.8c.2.9 1.1 1.3 1.1 2.2a1.1 1.1 0 0 1-2.2 0c0-.5.3-.9.5-1.3.1.3.2.5.4.5 0-.5-.1-.9.2-1.4z" fill="var(--gold-100)"></path></svg></div>
      <div class="mini mp" style="background: var(--green-100); color: var(--green-500); animation-delay: 1.7s"><svg class="ico" viewBox="0 0 24 24" style="width: 26px; height: 26px"><rect x="3" y="6" width="14" height="14" rx="2"></rect><path d="M7 2h12a2 2 0 0 1 2 2v12"></path></svg></div>
      <div class="mini mp" style="background: var(--paper-100); color:rgba(var(--ink-rgb),.62); animation-delay: 1.8s"><svg class="ico" viewBox="0 0 24 24" style="width: 24px; height: 24px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></div>
      <div class="muted" style="font-size: 13px; flex: 1; text-align: right">Ещё 9 достижений<br>в профиле</div>
    </div>
  </div>

  <div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px; animation-delay: 1.9s">
    <a class="btn b-leaf" href="Main.dc.html">Круто!</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.s = Date.now();
    this.iv = setInterval(() => { this.forceUpdate(); if (Date.now() - this.s > 2400) clearInterval(this.iv); }, 35);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const p = this.s ? Math.min(1, Math.max(0, (Date.now() - this.s - 1300) / 900)) : 0;
    const e = 1 - Math.pow(1 - p, 3);
    const ch = Math.round(e * 10);
    return { ch, w: (ch / 25 * 100).toFixed(1) + '%' };
  }
}
</script>
</body>
</html>
