<style>

    </div>

  </div>

      <div style="font-size: 16px; color:var(--red-text); margin-top: 4px; font-weight: 600">Ей не хотелось уходить с вечеринки.</div>
      <div style="font-size: 13px; color:var(--red-text); margin-top: 6px">reluctant = «неохотно, не хотеть», а не «рад»</div>
