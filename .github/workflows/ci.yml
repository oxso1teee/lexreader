name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Стандартные локальные demo-ключи Supabase CLI — одинаковые для любой
  # локальной установки, не секрет (issuer "supabase-demo").
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: BLLz4pRhZM_placeholder_not_a_real_key_00000000000000000000
  VAPID_PRIVATE_KEY: placeholder_not_a_real_key
  VAPID_CONTACT_EMAIL: ci@example.com
  CRON_SECRET: ci-test-secret
  HEALTH_CHECK_SECRET: ci-test-secret

jobs:
  # P0-АУДИТ 3.22: раньше не было вообще никакого CI — регрессия могла
  # попасть в main через автодеплой Vercel без единого прогона проверок.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # docs/release-2026-08-22/07_TESTIROVANIE_I_CI.md раздел 3: до этого шага
  # находки вроде pdfjs-dist (файл 02, A.1) можно было узнать только вручную
  # запустив `npm audit` — уязвимость провисела необнаруженной примерно
  # неделю. Отдельный job (не шаг внутри checks) — свой явный статус в
  # списке проверок PR, не теряется среди typecheck/lint/build. Не гейтит
  # e2e (needs: checks, не npm-audit) — находка на прямой зависимости не
  # должна блокировать функциональные тесты, только сама себя явно валит.
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:direct

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (Postgres + Auth + Storage)
        run: supabase start
      - name: Apply migrations
        run: supabase db reset
      - run: npx playwright install --with-deps chromium
      - name: Build and start app
        run: |
          npm run build
          npm run start -- -p 3000 &
          npx wait-on http://127.0.0.1:3000/login
      - run: npx playwright test --project=chromium
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
