<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — 30 дней подряд</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#fff}a:hover{color:#fff1b8}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#c2410c;color:#fff;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l)}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-white{--f:#fff;--e:#ffd9a3;--l:#c2410c}
.b-glass{--f:rgba(255,255,255,.16);--e:rgba(0,0,0,.2);--l:#fff}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{0%{transform:translateY(60px) scale(.6);opacity:0}65%{transform:translateY(-8px) scale(1.06);opacity:1}100%{transform:none}}
.enter{animation:enter .7s .1s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bob{animation:bob 2.4s 1.4s ease-in-out infinite}
@keyframes crown{0%{transform:translateY(-200px) rotate(-30deg)}60%{transform:translateY(6px) rotate(8deg)}78%{transform:translateY(-10px) rotate(-4deg)}100%{transform:none}}
.crown{animation:crown .9s .7s cubic-bezier(.3,.7,.4,1) both}
@keyframes fall{0%{transform:translateY(-40px) rotate(0)}100%{transform:translateY(900px) rotate(var(--r))}}
.rain{position:absolute;top:-20px;animation:fall var(--t) var(--d) linear infinite}
@keyframes glow{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.6;transform:scale(1.1)}}
.glow{animation:glow 2.4s ease-in-out infinite}
@keyframes slot{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.slot{animation:slot .35s 1.5s ease-out both}
@keyframes slideIn{from{transform:translateX(-110%)}to{transform:none}}
.slideIn{animation:slideIn .5s 1.7s cubic-bezier(.2,.9,.3,1.1) both}
</style>
</helmet>
<div class="app">
  <sc-for list="{{rain}}" as="p" hint-placeholder-count="0"><span class="rain" style="{{p.style}}" aria-hidden="true"></span></sc-for>

  <div style="position: relative; text-align: center; padding-top: 70px">
    <div class="glow" aria-hidden="true" style="position: absolute; left: 50%; top: 92px; width: 210px; height: 210px; margin-left: -105px; border-radius: 999px; background: #ff9500"></div>
    <div class="enter" style="position: relative; display: inline-block">
      <svg class="crown" viewBox="0 0 128 60" width="96" height="45" aria-hidden="true" style="display: block; margin: 0 auto -8px"><path d="M10 56 L18 12 L42 36 L64 4 L86 36 L110 12 L118 56 Z" fill="#ffc700" stroke="#7a5900" stroke-width="4" stroke-linejoin="round"></path><circle cx="64" cy="4" r="5" fill="#fff"></circle><circle cx="18" cy="12" r="4" fill="#fff"></circle><circle cx="110" cy="12" r="4" fill="#fff"></circle></svg>
      <div class="bob">
        <svg viewBox="0 0 128 150" width="150" height="176" aria-hidden="true"><path d="M64 8C78 26 100 44 92 72C87 92 66 104 48 90C32 78 32 54 48 40C58 31 60 20 64 8Z" fill="#cdeeb0"></path><path d="M60 46C70 58 76 68 68 82C63 90 50 90 44 81C39 73 43 61 51 53C55 50 57 48 60 46Z" fill="#fff" opacity="0.9"></path><path d="M50 62q4-5 8 0M62 62q4-5 8 0" fill="none" stroke="#1c540a" stroke-width="2.6" stroke-linecap="round"></path><path d="M52 70q8 10 16 0z" fill="#1c540a"></path><ellipse cx="90" cy="100" rx="19" ry="12" fill="#ffc700" transform="rotate(-28 90 100)"></ellipse><ellipse cx="94" cy="96" rx="8" ry="5" fill="#fff" transform="rotate(-28 94 96)" opacity="0.85"></ellipse></svg>
      </div>
    </div>
    <div class="disp slot" style="position: relative; font-size: 120px; font-weight: 900; line-height: .95; margin-top: 4px" aria-label="30">{{n}}</div>
    <div class="disp rise" style="position: relative; font-size: 26px; font-weight: 700; animation-delay: .4s">дней подряд</div>
    <p class="rise" style="position: relative; margin: 14px 28px 0; font-size: 17px; line-height: 1.4; font-weight: 600; animation-delay: 1.5s">Месяц без единого пропуска. Привычка уже твоя.</p>
  </div>

  <div class="slideIn" style="position: relative; margin: 24px 20px 0; border-radius: 20px; background: rgba(255,255,255,.16); padding: 14px 16px; display: flex; align-items: center; gap: 14px">
    <div style="width: 48px; height: 48px; border-radius: 14px; background: #ddf4ff; color: #0c7c9c; display: flex; align-items: center; justify-content: center; flex: none"><svg class="ico" viewBox="0 0 24 24" style="width: 26px; height: 26px"><path d="M12 2v20M4.9 4.9l14.2 14.2M2 12h20M4.9 19.1 19.1 4.9"></path></svg></div>
    <div><div style="font-weight: 700; font-size: 16px">Награда: +1 заморозка</div><div style="font-size: 14px; opacity: .9">Следующий рубеж: 50 дней</div></div>
  </div>

  <div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px; display: flex; gap: 12px; animation-delay: 2s">
    <button class="btn b-glass" type="button" style="flex: 0 0 auto; padding-left: 18px; padding-right: 18px"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg>Поделиться</button>
    <a class="btn b-white" href="Main.dc.html" style="flex: 1">Продолжить</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.s = Date.now();
    this.iv = setInterval(() => { this.forceUpdate(); if (Date.now() - this.s > 1800) clearInterval(this.iv); }, 35);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const p = this.s ? Math.min(1, Math.max(0, (Date.now() - this.s - 300) / 1200)) : 0;
    const e = 1 - Math.pow(1 - p, 3);
    let s = 31;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cols = ['#ffc700', '#fff', '#1cb0f6', '#cdeeb0', '#ffd9a3'];
    const rain = [];
    for (let i = 0; i < 22; i++) {
      const w = 7 + Math.round(r() * 6);
      rain.push({ style: 'left:' + Math.round(r() * 380) + 'px;width:' + w + 'px;height:' + Math.round(w * (1.2 + r())) + 'px;background:' + cols[i % 5] + ';border-radius:' + (i % 4 === 0 ? '99px' : '2px') + ';--t:' + (3 + r() * 2.5).toFixed(2) + 's;--d:' + (r() * 3).toFixed(2) + 's;--r:' + Math.round(r() * 900 - 450) + 'deg' });
    }
    return { rain, n: Math.round(e * 30) };
  }
}
</script>
</body>
</html>
