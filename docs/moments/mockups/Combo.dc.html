<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — 5 верных подряд</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#166534}a:hover{color:#123706}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#f5f1ea;color:#1a1a1a;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-leaf{--f:#2b820f;--e:#1c540a;--l:#fff}
.muted{color:rgba(26,26,26,.68)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:none;border-radius:12px;color:rgba(26,26,26,.68);cursor:pointer;text-decoration:none}
.bar{flex:1;height:16px;border-radius:99px;background:#ece6db;overflow:hidden;position:relative}
@keyframes heat{0%{background:#2b820f;width:50%}40%{background:#2b820f;width:58%}100%{background:#ff9500;width:58%}}
.fill{height:100%;border-radius:99px;box-shadow:inset 0 -4px 0 0 rgba(0,0,0,.12);position:relative;animation:heat 1s .2s ease-out both}
.fill::after{content:"";position:absolute;left:10px;right:10px;top:3px;height:4px;border-radius:99px;background:rgba(255,255,255,.4)}
@keyframes glowbar{0%,100%{box-shadow:0 0 0 0 rgba(255,149,0,0)}50%{box-shadow:0 0 0 5px rgba(255,149,0,.25)}}
.barglow{animation:glowbar 1.4s 1.2s ease-in-out infinite;border-radius:99px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px 18px;border-radius:16px;font:600 17px/1.3 Onest,sans-serif;border:2px solid rgba(26,26,26,.18);background:#fff;box-shadow:inset 0 -4px 0 0 rgba(26,26,26,.12);color:rgba(26,26,26,.5)}
.num{width:28px;height:28px;border-radius:8px;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:13px;opacity:.6;flex:none}
@keyframes drop{0%{transform:translate(-50%,-160%) scale(.85) rotate(-4deg)}55%{transform:translate(-50%,10%) scale(1.05) rotate(1.5deg)}75%{transform:translate(-50%,-3%) scale(.99)}100%{transform:translate(-50%,0) scale(1)}}
.toast{position:absolute;left:50%;top:112px;width:334px;animation:drop .7s .55s cubic-bezier(.2,.9,.3,1.2) both;z-index:5}
@keyframes sweep{0%{transform:translateX(-120px) skewX(-20deg)}100%{transform:translateX(420px) skewX(-20deg)}}
.sweep{position:absolute;top:0;bottom:0;width:60px;background:rgba(255,255,255,.35);animation:sweep 1.1s 1.3s ease-in-out both}
@keyframes flick{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.15) rotate(4deg)}}
.flick{animation:flick .8s ease-in-out infinite;transform-origin:50% 90%}
@keyframes numpop{0%,55%{transform:scale(1)}70%{transform:scale(1.6)}100%{transform:scale(1)}}
.numpop{display:inline-block;animation:numpop 1s .2s ease-out both}
@keyframes peek{0%{transform:translateX(110px) rotate(25deg)}70%{transform:translateX(-6px) rotate(-14deg)}100%{transform:translateX(0) rotate(-10deg)}}
.peek{animation:peek .6s 1.1s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes wob{0%,100%{rotate:0deg}50%{rotate:-6deg}}
.wob{animation:wob 1.6s 1.8s ease-in-out infinite}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.panel{position:absolute;left:0;right:0;bottom:0;padding:18px 20px 34px;animation:up .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes burst{0%{transform:translate(0,0) scale(.2);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.cf{position:absolute;left:0;top:0;border-radius:2px;animation:burst var(--t) var(--d) cubic-bezier(.1,.7,.3,1) both}
@keyframes check{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.chk{stroke-dasharray:24;animation:check .35s .15s ease-out both}
</style>
</helmet>
<div class="app">

<div style="display: flex; align-items: center; gap: 10px; padding: 52px 12px 0 8px">
  <a class="iconbtn" href="Quit-confirm.dc.html" aria-label="Закрыть занятие"><svg class="ico" viewBox="0 0 24 24" style="width: 26px; height: 26px"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
  <div class="bar barglow" role="progressbar" aria-label="Прогресс занятия" aria-valuemin="0" aria-valuemax="12" aria-valuenow="7"><div class="fill"></div></div>
  <div style="display: flex; align-items: center; gap: 4px; font-weight: 700; color: #c2410c; font-size: 15px; padding-right: 6px">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z" fill="#ff9500"></path></svg><span class="numpop">5</span>
  </div>
</div>

<div class="toast" role="status">
  <div style="position: relative; border-radius: 24px; background: #ff9500; box-shadow: inset 0 -6px 0 0 #db7a00; padding: 16px 18px 20px; display: flex; align-items: center; gap: 14px; color: #1a1a1a; overflow: hidden">
    <span class="sweep" aria-hidden="true"></span>
    <div class="flick" style="flex: none; position: relative"><svg viewBox="0 0 24 24" width="54" height="54" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z" fill="#fff"></path><path d="M12 12c.6 2 3 3 3 5.5a3 3 0 0 1-6 0c0-1.5 1-2.5 1.5-3.5.2 1 .7 1.5 1.2 1.5 0-1.5-.4-2.5.3-3.5z" fill="#ffc700"></path></svg></div>
    <div style="position: relative">
      <div class="disp" style="font-size: 22px; font-weight: 900; line-height: 1.1">5 верных подряд!</div>
      <div style="font-size: 14px; font-weight: 700; margin-top: 4px">Полоска горит · +5 XP</div>
    </div>
  </div>
  <div style="position: absolute; left: 50px; top: 46px; width: 0; height: 0">
    <sc-for list="{{cf}}" as="c" hint-placeholder-count="0"><span class="cf" style="{{c.style}}"></span></sc-for>
  </div>
</div>

<div style="padding: 150px 20px 0; opacity: .5">
  <div style="font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #0c7c9c">Задание 7 из 12</div>
  <h1 class="disp" style="margin: 8px 0 0; font-size: 22px; line-height: 1.25; font-weight: 700">Выбери перевод: «refuge»</h1>
  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px">
    <div class="opt" style="border-color: #2b820f; background: #e3f6d3; color: #166534; box-shadow: inset 0 -4px 0 0 #2b820f"><span class="num">1</span>убежище</div>
    <div class="opt"><span class="num">2</span>отказ</div>
    <div class="opt"><span class="num">3</span>берег</div>
  </div>
</div>

<div class="peek" style="position: absolute; right: -18px; top: 430px" aria-hidden="true">
  <div class="wob"><svg viewBox="0 0 128 150" width="110" height="128"><path d="M64 8C78 26 100 44 92 72C87 92 66 104 48 90C32 78 32 54 48 40C58 31 60 20 64 8Z" fill="#2b820f"></path><path d="M60 46C70 58 76 68 68 82C63 90 50 90 44 81C39 73 43 61 51 53C55 50 57 48 60 46Z" fill="#e3f6d3" opacity="0.9"></path><path d="M50 62q4-5 8 0M62 62q4-5 8 0" fill="none" stroke="#1c540a" stroke-width="2.6" stroke-linecap="round"></path><path d="M52 70q8 10 16 0z" fill="#1c540a"></path><ellipse cx="90" cy="100" rx="19" ry="12" fill="#ff9500" transform="rotate(-28 90 100)"></ellipse><ellipse cx="94" cy="96" rx="8" ry="5" fill="#ffc700" transform="rotate(-28 94 96)" opacity="0.85"></ellipse></svg></div>
</div>

<div class="panel" style="background: #e3f6d3" role="status">
  <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 14px">
    <div style="width: 44px; height: 44px; border-radius: 999px; background: #fff; color: #2b820f; display: flex; align-items: center; justify-content: center"><svg class="ico" viewBox="0 0 24 24" style="width: 26px; height: 26px; stroke-width: 3"><path class="chk" d="M5 12l5 5L20 7"></path></svg></div>
    <div style="flex: 1">
      <div class="disp" style="font-size: 20px; font-weight: 700; color: #166534">В точку!</div>
      <div style="font-size: 14px; font-weight: 600; color: #166534">+15 XP · полоска стала оранжевой</div>
    </div>
  </div>
  <a class="btn b-leaf" href="Halfway.dc.html">Продолжить</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    let s = 5;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cols = ['#ffc700', '#fff', '#ff9500', '#df2d2d'];
    const cf = [];
    for (let i = 0; i < 18; i++) {
      const a = r() * Math.PI * 2;
      const d = 60 + r() * 90;
      const w = 5 + Math.round(r() * 5);
      cf.push({ style: 'width:' + w + 'px;height:' + w + 'px;background:' + cols[i % 4] + ';border-radius:' + (i % 3 === 0 ? '99px' : '2px') + ';--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d) + 'px;--d:' + (1.05 + r() * 0.15).toFixed(2) + 's;--t:' + (0.8 + r() * 0.5).toFixed(2) + 's' });
    }
    return { cf };
  }
}
</script>
</body>
</html>
