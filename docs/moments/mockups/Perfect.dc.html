<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Занятие без ошибок</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#1a1a1a}a:hover{color:#000}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#ffc700;color:#1a1a1a;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-dark{--f:#1a1a1a;--e:#000;--l:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.rays{animation:spin 16s linear infinite}
@keyframes raysin{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.raysin{animation:raysin .8s .3s ease-out both}
@keyframes stamp{0%{transform:scale(2.4) rotate(-25deg);opacity:0}55%{transform:scale(.88) rotate(4deg);opacity:1}75%{transform:scale(1.06) rotate(-2deg)}100%{transform:none}}
.stamp{animation:stamp .7s .15s cubic-bezier(.3,.7,.4,1) both}
@keyframes wave{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.wave{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:999px;border:6px solid #fff;animation:wave .9s .62s ease-out both}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.2);opacity:1}75%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
.cf{position:absolute;left:0;top:0;animation:burst var(--t) var(--d) cubic-bezier(.1,.7,.3,1) both}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes tw{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1) rotate(45deg);opacity:1}}
.tw{position:absolute;animation:tw 1.8s ease-in-out infinite}
@keyframes bonus{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.bonus{animation:bonus 1.6s 2s ease-in-out infinite}
</style>
</helmet>
<div class="app">

<div style="position: relative; height: 380px; margin-top: 40px; display: flex; align-items: center; justify-content: center">
  <div class="raysin" style="position: absolute">
    <svg class="rays" viewBox="0 0 300 300" width="340" height="340" aria-hidden="true">
      <g fill="#ffe066">
        <path d="M150 150 L138 0 L162 0 Z"></path><path d="M150 150 L138 0 L162 0 Z" transform="rotate(30 150 150)"></path><path d="M150 150 L138 0 L162 0 Z" transform="rotate(60 150 150)"></path><path d="M150 150 L138 0 L162 0 Z" transform="rotate(90 150 150)"></path><path d="M150 150 L138 0 L162 0 Z" transform="rotate(120 150 150)"></path><path d="M150 150 L138 0 L162 0 Z" transform="rotate(150 150 150)"></path><path d="M150 150 L138 0 L162 0 Z" transform="rotate(180 150 150)"></path><path d="M150 150 L138 0 L162 0 Z" transform="rotate(210 150 150)"></path><path d="M150 150 L138 0 L162 0 Z" transform="rotate(240 150 150)"></path><path d="M150 150 L138 0 L162 0 Z" transform="rotate(270 150 150)"></path><path d="M150 150 L138 0 L162 0 Z" transform="rotate(300 150 150)"></path><path d="M150 150 L138 0 L162 0 Z" transform="rotate(330 150 150)"></path>
      </g>
    </svg>
  </div>
  <span class="wave" aria-hidden="true"></span>
  <div style="position: absolute; left: 50%; top: 50%; width: 0; height: 0">
    <sc-for list="{{cf}}" as="c" hint-placeholder-count="0"><span class="cf" style="{{c.style}}"></span></sc-for>
  </div>
  <svg class="tw" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="left: 50px; top: 56px"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#fff"></path></svg>
  <svg class="tw" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="right: 56px; top: 84px; animation-delay: .6s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#fff"></path></svg>
  <svg class="tw" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="right: 76px; bottom: 54px; animation-delay: 1.1s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#fff"></path></svg>
  <svg class="tw" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="left: 80px; bottom: 70px; animation-delay: 1.5s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#fff"></path></svg>
  <div class="stamp" style="position: relative">
    <svg viewBox="0 0 200 200" width="210" height="210" role="img" aria-label="Значок: 12 из 12 без ошибок">
      <path d="M100 8l26 54 59 8-43 41 10 59-52-28-52 28 10-59L15 70l59-8z" fill="#fff" stroke="#e0a500" stroke-width="8" stroke-linejoin="round"></path>
      <path d="M100 40l16 34 37 5-27 26 6 37-32-18-32 18 6-37-27-26 37-5z" fill="#ffc700"></path>
      <text x="100" y="128" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="900" font-size="40" fill="#7a5900">{{n}}</text>
    </svg>
  </div>
</div>

<div style="text-align: center; padding: 0 28px">
  <h1 class="disp rise" style="margin: 0; font-size: 30px; line-height: 1.15; font-weight: 900; animation-delay: .8s">Без единой ошибки!</h1>
  <p class="rise" style="margin: 10px 0 0; font-size: 17px; font-weight: 600; animation-delay: .95s">12 заданий из 12 верно с первого раза</p>
</div>

<div class="rise" style="margin: 26px 20px 0; animation-delay: 1.15s">
  <div class="bonus" style="border-radius: 20px; background: #fff; padding: 16px 18px; display: flex; align-items: center; gap: 14px; box-shadow: inset 0 -5px 0 0 #e0a500">
    <svg viewBox="0 0 24 24" width="38" height="38" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="#ffc700" stroke="#e0a500" stroke-width="1.5" stroke-linejoin="round"></path></svg>
    <div style="flex: 1">
      <div class="disp" style="font-size: 22px; font-weight: 900; color: #7a5900">+{{xp}} XP</div>
      <div style="font-size: 14px; font-weight: 600">бонус за чистое занятие</div>
    </div>
  </div>
  <div style="display: flex; gap: 8px; margin-top: 10px">
    <div style="flex: 1; padding: 12px 8px; border-radius: 16px; background: rgba(255,255,255,.55); text-align: center"><div class="disp" style="font-size: 20px; font-weight: 900">100%</div><div style="font-size: 12px; font-weight: 700; margin-top: 2px">точность</div></div>
    <div style="flex: 1; padding: 12px 8px; border-radius: 16px; background: rgba(255,255,255,.55); text-align: center"><div class="disp" style="font-size: 20px; font-weight: 900">3:12</div><div style="font-size: 12px; font-weight: 700; margin-top: 2px">время</div></div>
    <div style="flex: 1; padding: 12px 8px; border-radius: 16px; background: rgba(255,255,255,.55); text-align: center"><div class="disp" style="font-size: 20px; font-weight: 900">12</div><div style="font-size: 12px; font-weight: 700; margin-top: 2px">подряд</div></div>
  </div>
</div>

<div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px; animation-delay: 1.8s">
  <a class="btn b-dark" href="Goal-done.dc.html">Забрать бонус</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.s = Date.now();
    this.iv = setInterval(() => { this.forceUpdate(); if (Date.now() - this.s > 2600) clearInterval(this.iv); }, 40);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  k(delay, dur) {
    if (!this.s) return 0;
    const p = Math.min(1, Math.max(0, (Date.now() - this.s - delay) / dur));
    return 1 - Math.pow(1 - p, 3);
  }
  renderVals() {
    let s = 3;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cols = ['#fff', '#2b820f', '#1cb0f6', '#ff9500', '#df2d2d'];
    const cf = [];
    for (let i = 0; i < 30; i++) {
      const a = r() * Math.PI * 2;
      const d = 130 + r() * 110;
      const w = 6 + Math.round(r() * 6);
      cf.push({ style: 'width:' + w + 'px;height:' + (r() < .5 ? w : w * 2) + 'px;background:' + cols[i % 5] + ';border-radius:' + (r() < .3 ? '99px' : '2px') + ';--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d + 40) + 'px;--r:' + Math.round(r() * 720 - 360) + 'deg;--d:' + (0.6 + r() * 0.15).toFixed(2) + 's;--t:' + (1.2 + r() * 0.8).toFixed(2) + 's' });
    }
    return {
      cf,
      n: Math.round(this.k(250, 700) * 12),
      xp: Math.round(this.k(1300, 600) * 10)
    };
  }
}
</script>
</body>
</html>
