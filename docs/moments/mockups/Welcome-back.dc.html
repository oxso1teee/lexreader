<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — С возвращением</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#fff}a:hover{color:#fff1b8}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#2b820f;color:#fff;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-white{--f:#fff;--e:#cdeeb0;--l:#166534}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes enter{0%{transform:translateY(240px)}60%{transform:translateY(-20px)}80%{transform:translateY(6px)}100%{transform:none}}
.enter{animation:enter .8s cubic-bezier(.3,.7,.4,1) both}
@keyframes wave{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(18deg)}}
.wave{animation:wave .6s .8s ease-in-out 6;transform-origin:50% 95%}
@keyframes jump{0%,100%{transform:translateY(0) scaleY(1)}12%{transform:translateY(0) scaleY(.9) scaleX(1.06)}40%,58%{transform:translateY(-22px)}85%{transform:translateY(0) scaleY(.95)}}
.jump{animation:jump 1.4s 1.2s cubic-bezier(.3,.7,.4,1) infinite;transform-origin:50% 100%}
@keyframes floatl{0%{transform:translate(0,40px) rotate(0);opacity:0}15%{opacity:.8}100%{transform:translate(var(--dx),-760px) rotate(var(--r));opacity:0}}
.lf{position:absolute;bottom:-20px;width:16px;height:16px;border-radius:0 70% 0 70%;animation:floatl var(--t) var(--d) linear infinite}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.slide{animation:slide .45s cubic-bezier(.2,.9,.3,1.1) both}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.14);font-size:15px;font-weight:600}
.link2{display:block;text-align:center;font:600 15px/1 Onest,sans-serif;color:#fff;padding:16px 0 0;text-decoration:underline}
</style>
</helmet>
<div class="app">
  <div aria-hidden="true" style="position: absolute; width: 420px; height: 420px; border-radius: 999px; background: #1c540a; opacity: .45; left: -110px; top: -170px"></div>
  <sc-for list="{{leaves}}" as="l" hint-placeholder-count="0"><span class="lf" style="{{l.style}}" aria-hidden="true"></span></sc-for>

  <div style="position: relative; text-align: center; padding-top: 90px">
    <div class="enter" style="display: inline-flex; align-items: flex-end">
      <div class="jump"><svg viewBox="0 0 128 150" width="150" height="176" aria-hidden="true"><path d="M64 8C78 26 100 44 92 72C87 92 66 104 48 90C32 78 32 54 48 40C58 31 60 20 64 8Z" fill="#cdeeb0"></path><path d="M60 46C70 58 76 68 68 82C63 90 50 90 44 81C39 73 43 61 51 53C55 50 57 48 60 46Z" fill="#fff" opacity="0.9"></path><path d="M50 62q4-5 8 0M62 62q4-5 8 0" fill="none" stroke="#1c540a" stroke-width="2.6" stroke-linecap="round"></path><path d="M52 70q8 10 16 0z" fill="#1c540a"></path><ellipse cx="90" cy="100" rx="19" ry="12" fill="#ff9500" transform="rotate(-28 90 100)"></ellipse><ellipse cx="94" cy="96" rx="8" ry="5" fill="#ffc700" transform="rotate(-28 94 96)" opacity="0.85"></ellipse></svg></div>
      <div class="wave" style="margin-left: -18px; margin-bottom: 92px"><svg viewBox="0 0 40 60" width="34" height="50" aria-hidden="true"><ellipse cx="20" cy="22" rx="14" ry="20" fill="#ffc700"></ellipse></svg></div>
    </div>
    <h1 class="disp rise" style="margin: 18px 24px 0; font-size: 28px; line-height: 1.15; font-weight: 900; animation-delay: .7s">С возвращением, Сергей!</h1>
    <p class="rise" style="margin: 12px 30px 0; font-size: 16px; line-height: 1.45; opacity: .95; animation-delay: .82s">Тебя не было 5 дней. Ничего страшного: слова никуда не делись.</p>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 8px; padding: 26px 20px 0">
    <div class="item slide" style="animation-delay: 1s"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"></rect><path d="M7 2h12a2 2 0 0 1 2 2v12"></path></svg>Лёгкий повтор: 8 слов, которые подзабылись</div>
    <div class="item slide" style="animation-delay: 1.12s"><svg class="ico" viewBox="0 0 24 24"><path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2z"></path><path d="M22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"></path></svg>Потом глава 3 с места, где остановился</div>
  </div>

  <div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 30px; animation-delay: 1.35s">
    <a class="btn b-white" href="Lesson-start.dc.html">Мягкий старт · 3 мин</a>
    <a class="link2" href="Main.dc.html">Сразу на главную</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    let s = 81;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cols = ['#cdeeb0', '#ffc700', '#e3f6d3'];
    const leaves = [];
    for (let i = 0; i < 9; i++) {
      leaves.push({ style: 'left:' + Math.round(r() * 370) + 'px;background:' + cols[i % 3] + ';--dx:' + Math.round(r() * 80 - 40) + 'px;--r:' + Math.round(r() * 360) + 'deg;--t:' + (7 + r() * 5).toFixed(2) + 's;--d:' + (-r() * 9).toFixed(2) + 's' });
    }
    return { leaves };
  }
}
</script>
</body>
</html>
