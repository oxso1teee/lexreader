<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Включить напоминания</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#166534}a:hover{color:#123706}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#f5f1ea;color:#1a1a1a;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-leaf{--f:#2b820f;--e:#1c540a;--l:#fff}
.muted{color:rgba(26,26,26,.68)}
@keyframes ring{0%,60%,100%{transform:rotate(0)}5%{transform:rotate(18deg)}10%{transform:rotate(-16deg)}15%{transform:rotate(12deg)}20%{transform:rotate(-8deg)}25%{transform:rotate(4deg)}30%{transform:rotate(0)}}
.bell{animation:ring 2.2s .6s ease-in-out infinite;transform-origin:50% 8%}
@keyframes arc{0%,60%,100%{opacity:0;transform:scale(.7)}10%{opacity:1;transform:scale(1)}30%{opacity:0;transform:scale(1.25)}}
.arc{animation:arc 2.2s .6s ease-out infinite;transform-origin:50% 50%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes drop{0%{transform:translateY(-60px) scale(.92);opacity:0}65%{transform:translateY(6px) scale(1.01);opacity:1}100%{transform:none;opacity:1}}
.notif{animation:drop .6s .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.chip{flex:1;min-height:52px;border-radius:14px;border-width:2px;border-style:solid;font:700 17px/1 Onest,sans-serif;cursor:pointer;transition:background .12s,border-color .12s,transform .08s}
.chip:active{transform:translateY(3px)}
.link2{display:block;text-align:center;font:600 15px/1 Onest,sans-serif;color:rgba(26,26,26,.68);padding:16px 0 0;text-decoration:underline}
</style>
</helmet>
<div class="app">
  <div style="display: flex; justify-content: center; align-items: flex-end; padding-top: 80px">
    <div class="bob"><svg viewBox="0 0 128 150" width="120" height="140" aria-hidden="true"><ellipse cx="64" cy="128" rx="34" ry="9" fill="rgba(0,0,0,0.06)"></ellipse><path d="M64 8C78 26 100 44 92 72C87 92 66 104 48 90C32 78 32 54 48 40C58 31 60 20 64 8Z" fill="#2b820f"></path><path d="M60 46C70 58 76 68 68 82C63 90 50 90 44 81C39 73 43 61 51 53C55 50 57 48 60 46Z" fill="#e3f6d3" opacity="0.9"></path><ellipse cx="54" cy="62" rx="3.4" ry="4.6" fill="#1c540a"></ellipse><ellipse cx="66" cy="62" rx="3.4" ry="4.6" fill="#1c540a"></ellipse><path d="M54 72q6 5 12 0" fill="none" stroke="#1c540a" stroke-width="2.4" stroke-linecap="round"></path><ellipse cx="90" cy="100" rx="19" ry="12" fill="#ff9500" transform="rotate(-28 90 100)"></ellipse><ellipse cx="94" cy="96" rx="8" ry="5" fill="#ffc700" transform="rotate(-28 94 96)" opacity="0.85"></ellipse></svg></div>
    <div style="position: relative; margin-left: -10px; margin-bottom: 70px; width: 80px; height: 72px">
      <svg class="arc" viewBox="0 0 80 72" width="80" height="72" aria-hidden="true" style="position: absolute; inset: 0"><path d="M6 20a36 36 0 0 0 0 30M74 20a36 36 0 0 1 0 30" fill="none" stroke="#ffc700" stroke-width="4" stroke-linecap="round"></path></svg>
      <div class="bell" style="position: absolute; left: 8px; top: 4px"><svg viewBox="0 0 24 24" width="64" height="64" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" fill="#ffc700" stroke="#7a5900" stroke-width="1.5" stroke-linejoin="round"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0" fill="none" stroke="#7a5900" stroke-width="1.8" stroke-linecap="round"></path></svg></div>
    </div>
  </div>

  <div style="text-align: center; padding: 18px 28px 0">
    <h1 class="disp rise" style="margin: 0; font-size: 25px; line-height: 1.2; font-weight: 900; animation-delay: .2s">Напомнить, если забудешь?</h1>
    <p class="muted rise" style="margin: 10px 0 0; font-size: 16px; line-height: 1.45; animation-delay: .3s">Одно сообщение вечером и только если ты ещё не занимался. Без спама.</p>
  </div>

  <div class="notif" style="margin: 22px 20px 0; padding: 12px 14px; border-radius: 18px; background: #fff; border: 2px solid rgba(26,26,26,.12); display: flex; gap: 12px; align-items: center">
    <div style="width: 38px; height: 38px; border-radius: 10px; background: #2b820f; flex: none; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 128 150" width="22" height="26" aria-hidden="true"><path d="M64 8C78 26 100 44 92 72C87 92 66 104 48 90C32 78 32 54 48 40C58 31 60 20 64 8Z" fill="#fff"></path></svg></div>
    <div style="flex: 1; min-width: 0">
      <div style="display: flex; justify-content: space-between; font-size: 12px"><b>LexReader</b><span class="muted">{{time}}</span></div>
      <div style="font-size: 14px; margin-top: 2px">Мара всё ещё на маяке. 3 минуты, и серия в безопасности</div>
    </div>
  </div>

  <div class="rise" style="padding: 20px 20px 0; animation-delay: .8s">
    <div class="muted" style="font-size: 13px; font-weight: 700; margin-bottom: 8px">Во сколько напоминать</div>
    <div style="display: flex; gap: 8px" role="radiogroup" aria-label="Время напоминания">
      <sc-for list="{{times}}" as="t" hint-placeholder-count="3">
        <button class="chip" type="button" role="radio" aria-checked="{{t.checked}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
  </div>

  <div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 30px; animation-delay: 1s">
    <a class="btn b-leaf" href="Main.dc.html">Включить в {{time}}</a>
    <a class="link2" href="Main.dc.html">Не сейчас</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { t: 1 };
  }
  renderVals() {
    const labels = ['19:00', '21:00', '22:30'];
    const on = 'background: #e3f6d3; border-color: #2b820f; color: #166534; box-shadow: inset 0 -4px 0 0 #2b820f;';
    const off = 'background: #fff; border-color: rgba(26,26,26,.18); color: #1a1a1a; box-shadow: inset 0 -4px 0 0 rgba(26,26,26,.1);';
    return {
      time: labels[this.state.t],
      times: labels.map((l, i) => ({
        label: l,
        checked: i === this.state.t ? 'true' : 'false',
        style: i === this.state.t ? on : off,
        pick: () => this.setState({ t: i })
      }))
    };
  }
}
</script>
</body>
</html>
