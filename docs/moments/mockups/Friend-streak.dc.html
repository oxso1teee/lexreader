<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Общая серия с другом</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#166534}a:hover{color:#123706}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#f5f1ea;color:#1a1a1a;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l)}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-ember{--f:#c2410c;--e:#9a330a;--l:#fff}
.b-ghost{--f:#ece6db;--e:#c9c2b6;--l:#1a1a1a}
.card{background:#fff;border:2px solid rgba(26,26,26,.18);border-radius:20px}
.muted{color:rgba(26,26,26,.68)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.av{width:96px;height:96px;border-radius:999px;display:flex;align-items:center;justify-content:center;font:900 36px/1 Unbounded,sans-serif;color:#fff;border:5px solid #fff}
@keyframes inL{0%{transform:translateX(-140px) rotate(-20deg)}70%{transform:translateX(12px) rotate(6deg)}100%{transform:none}}
@keyframes inR{0%{transform:translateX(140px) rotate(20deg)}70%{transform:translateX(-12px) rotate(-6deg)}100%{transform:none}}
.inL{animation:inL .65s cubic-bezier(.2,.9,.3,1.1) both}.inR{animation:inR .65s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes ignite{0%,50%{transform:scale(0)}80%{transform:scale(1.25)}100%{transform:scale(1)}}
.ignite{animation:ignite 1s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:50% 85%}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.08) rotate(3deg)}}
.flick{animation:flick 1s 1s ease-in-out infinite;transform-origin:50% 90%}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.2);opacity:1}75%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
.cf{position:absolute;left:0;top:0;animation:burst var(--t) var(--d) cubic-bezier(.1,.7,.3,1) both}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.row{display:flex;align-items:center;gap:12px;padding:10px 0}
.sm{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font:700 14px/1 Onest,sans-serif;color:#fff;flex:none}
</style>
</helmet>
<div class="app">
  <div style="position: relative; display: flex; justify-content: center; align-items: center; gap: 0; padding-top: 120px; height: 300px">
    <div style="position: absolute; left: 50%; top: 175px; width: 0; height: 0">
      <sc-for list="{{cf}}" as="c" hint-placeholder-count="0"><span class="cf" style="{{c.style}}"></span></sc-for>
    </div>
    <div class="inL"><div class="av" style="background: #0b79b0">С</div></div>
    <div class="ignite" style="margin: 0 -14px; position: relative; z-index: 2"><div class="flick"><svg viewBox="0 0 24 24" width="92" height="92" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z" fill="#ff9500" stroke="#fff" stroke-width="1.2"></path><path d="M12 12c.6 2 3 3 3 5.5a3 3 0 0 1-6 0c0-1.5 1-2.5 1.5-3.5.2 1 .7 1.5 1.2 1.5 0-1.5-.4-2.5.3-3.5z" fill="#ffc700"></path></svg></div></div>
    <div class="inR"><div class="av" style="background: #8b5cf6">А</div></div>
  </div>

  <div style="text-align: center; padding: 0 28px">
    <div class="disp rise" style="font-size: 64px; font-weight: 900; line-height: 1; color: #c2410c; animation-delay: .9s; font-variant-numeric: tabular-nums">{{n}}</div>
    <h1 class="disp rise" style="margin: 6px 0 0; font-size: 22px; line-height: 1.2; font-weight: 900; animation-delay: 1s">дней вместе с Аней</h1>
    <p class="muted rise" style="margin: 10px 0 0; font-size: 15px; animation-delay: 1.1s">Каждый занимается сам, серия общая. Пропустит один, сгорит у обоих</p>
  </div>

  <div class="card rise" style="margin: 22px 20px 0; padding: 4px 16px; animation-delay: 1.3s">
    <div class="row" style="border-bottom: 2px solid #f0ebe2"><span class="sm" style="background: #8b5cf6">А</span><b style="flex: 1">Аня</b><span style="display: flex; align-items: center; gap: 4px; font-weight: 700; color: #c2410c"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z" fill="#ff9500"></path></svg>10</span></div>
    <div class="row"><span class="sm" style="background: #0b79b0">М</span><b style="flex: 1">Макс</b><span style="display: flex; align-items: center; gap: 4px; font-weight: 700; color: #c2410c"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z" fill="#ff9500"></path></svg>4</span></div>
  </div>

  <div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px; display: flex; gap: 12px; animation-delay: 1.6s">
    <button class="btn b-ghost" type="button" style="flex: 0 0 auto; padding-left: 16px; padding-right: 16px"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"></path></svg>Позвать</button>
    <a class="btn b-ember" href="Main.dc.html" style="flex: 1">Так держать</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = Date.now();
    this.ivx = setInterval(() => { this.forceUpdate(); if (Date.now() - this.t0 > 2200) clearInterval(this.ivx); }, 33);
  }
  componentWillUnmount() { clearInterval(this.ivx); }
  cu(to, delay, dur) {
    const el = this.t0 ? Date.now() - this.t0 : 0;
    const p = Math.min(1, Math.max(0, (el - delay) / dur));
    return Math.round(to * (1 - Math.pow(1 - p, 3)));
  }
  renderVals() {
    let s = 61;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cols = ['#ff9500', '#ffc700', '#8b5cf6', '#0b79b0', '#2b820f'];
    const cf = [];
    for (let i = 0; i < 26; i++) {
      const a = r() * Math.PI * 2;
      const d = 110 + r() * 110;
      const w = 6 + Math.round(r() * 5);
      cf.push({ style: 'width:' + w + 'px;height:' + (r() < .5 ? w : w * 2) + 'px;background:' + cols[i % 5] + ';border-radius:' + (r() < .3 ? '99px' : '2px') + ';--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d) + 'px;--r:' + Math.round(r() * 720 - 360) + 'deg;--d:' + (0.6 + r() * 0.15).toFixed(2) + 's;--t:' + (1.2 + r() * 0.7).toFixed(2) + 's' });
    }
    return { cf, n: this.cu(10, 900, 900) };
  }
}
</script>
</body>
</html>
