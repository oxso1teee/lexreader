<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Слова ускользают</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;family=Source+Serif+4:opsz,wght@8..60,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#166534}a:hover{color:#123706}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#f5f1ea;color:#1a1a1a;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.muted{color:rgba(26,26,26,.68)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:54px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-sky{--f:#0b79b0;--e:#075a85;--l:#fff}
.ghost{background:#fff;border:2px solid rgba(26,26,26,.12);border-radius:20px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.scrim{position:absolute;inset:0;background:rgba(26,26,26,.55);animation:fadein .25s ease-out both}
@keyframes up{0%{transform:translateY(100%)}75%{transform:translateY(-2%)}100%{transform:none}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:30px 30px 0 0;padding:12px 22px 30px;animation:up .4s .1s cubic-bezier(.2,.8,.2,1) both}
@keyframes draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
.curve{stroke-dasharray:420;animation:draw 1.2s .5s cubic-bezier(.4,0,.2,1) both}
@keyframes boost{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
.boost{stroke-dasharray:300;animation:boost .9s 1.8s cubic-bezier(.4,0,.2,1) both}
@keyframes ping{0%{r:6;opacity:1}100%{r:18;opacity:0}}
.ping{animation:ping 1.4s 1.7s ease-out infinite}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes fade{0%,100%{opacity:1;filter:blur(0)}50%{opacity:.35;filter:blur(1.2px)}}
.w{display:inline-block;padding:6px 10px;border-radius:10px;background:#ddf4ff;color:#075a85;font:600 15px/1 'Source Serif 4',Georgia,serif;animation:rise .35s var(--d) both, fade 2.6s calc(var(--d) + .4s) ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.swing{animation:swing 1s ease-in-out infinite;transform-origin:50% 0}
.link2{display:block;text-align:center;font:600 15px/1 Onest,sans-serif;color:rgba(26,26,26,.68);padding:16px 0 0;text-decoration:underline}
</style>
</helmet>
<div class="app">
  <div aria-hidden="true" style="padding: 60px 16px 0">
    <div style="height: 40px; width: 70%; border-radius: 12px; background: #ece6db"></div>
    <div style="height: 230px; margin-top: 20px; border-radius: 24px; background: #2b820f"></div>
    <div style="display: flex; gap: 12px; margin-top: 14px"><div class="ghost" style="flex: 1; height: 80px"></div><div class="ghost" style="flex: 1; height: 80px"></div></div>
  </div>
  <div class="scrim" aria-hidden="true"></div>

  <div class="sheet" role="dialog" aria-label="Пора повторить слова">
    <div style="width: 44px; height: 5px; border-radius: 99px; background: rgba(26,26,26,.18); margin: 0 auto 14px"></div>

    <div style="display: flex; align-items: center; gap: 12px">
      <div style="position: relative; width: 60px; height: 70px; flex: none">
        <svg viewBox="0 0 128 150" width="60" height="70" aria-hidden="true"><path d="M64 8C78 26 100 44 92 72C87 92 66 104 48 90C32 78 32 54 48 40C58 31 60 20 64 8Z" fill="#2b820f"></path><path d="M60 46C70 58 76 68 68 82C63 90 50 90 44 81C39 73 43 61 51 53C55 50 57 48 60 46Z" fill="#e3f6d3" opacity="0.9"></path><ellipse cx="54" cy="62" rx="3.4" ry="4.6" fill="#1c540a"></ellipse><ellipse cx="66" cy="62" rx="3.4" ry="4.6" fill="#1c540a"></ellipse><ellipse cx="60" cy="74" rx="4" ry="3.4" fill="#1c540a"></ellipse><ellipse cx="90" cy="100" rx="19" ry="12" fill="#ff9500" transform="rotate(-28 90 100)"></ellipse></svg>
      </div>
      <div style="flex: 1">
        <h1 class="disp" style="margin: 0; font-size: 21px; line-height: 1.2; font-weight: 900">18 слов начинают забываться</h1>
        <p class="muted" style="margin: 6px 0 0; font-size: 14px">Повтори сейчас, и они продержатся ещё 2 недели</p>
      </div>
    </div>

    <div style="margin-top: 16px; padding: 12px 12px 8px; border-radius: 18px; background: #f5f1ea">
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700" class="muted"><span>Насколько помнишь</span><span>дни</span></div>
      <svg viewBox="0 0 320 120" width="100%" height="120" role="img" aria-label="Память падает до 70%, повтор поднимает её обратно">
        <path d="M10 104H310" stroke="#d6cfc3" stroke-width="2"></path>
        <path d="M10 20H310" stroke="#ece6db" stroke-width="2" stroke-dasharray="4 6"></path>
        <text x="12" y="14" text-anchor="start" font-size="10" font-weight="700" fill="rgba(26,26,26,.5)" font-family="Onest, sans-serif">100%</text>
        <path class="curve" d="M10 20 C60 40 100 58 150 66" fill="none" stroke="#1cb0f6" stroke-width="5" stroke-linecap="round"></path>
        <path d="M150 66 C200 74 250 86 310 92" fill="none" stroke="rgba(28,176,246,.4)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 8"></path>
        <path class="boost" d="M150 66 L150 22 C210 30 260 38 310 46" fill="none" stroke="#2b820f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle class="ping" cx="150" cy="66" r="6" fill="none" stroke="#df2d2d" stroke-width="3"></circle>
        <circle cx="150" cy="66" r="6" fill="#df2d2d"></circle>
        <text x="158" y="84" font-size="11" font-weight="700" fill="#c21b1b" font-family="Onest, sans-serif">сегодня · 70%</text>
        <text x="214" y="70" font-size="11" font-weight="700" fill="#166534" font-family="Onest, sans-serif" class="rise" style="animation-delay: 2.4s">после повтора</text>
      </svg>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px" aria-label="Слова на повтор">
      <span class="w" style="--d: .5s">reluctant</span><span class="w" style="--d: .6s">gale</span><span class="w" style="--d: .7s">shore</span><span class="w" style="--d: .8s">to drift</span><span class="w" style="--d: .9s">beacon</span><span class="w" style="--d: 1s; background: #ece6db; color: rgba(26,26,26,.68); font-family: Onest, sans-serif; font-size: 13px; font-weight: 700">+13</span>
    </div>

    <div style="margin-top: 18px">
      <a class="btn b-sky" href="Lesson-start.dc.html">Повторить · 3 мин</a>
      <a class="link2" href="Main.dc.html">Напомнить вечером</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
