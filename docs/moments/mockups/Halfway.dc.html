<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Половина пути</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#166534}a:hover{color:#123706}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#f5f1ea;color:#1a1a1a;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-leaf{--f:#2b820f;--e:#1c540a;--l:#fff}
.muted{color:rgba(26,26,26,.68)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:none;border-radius:12px;color:rgba(26,26,26,.68);cursor:pointer;text-decoration:none}
.bar{flex:1;height:16px;border-radius:99px;background:#ece6db;position:relative}
@keyframes fillto{from{width:42%}to{width:50%}}
.fill{height:100%;border-radius:99px;background:#ff9500;box-shadow:inset 0 -4px 0 0 rgba(0,0,0,.12);animation:fillto .7s .2s ease-out both}
@keyframes flag{0%{transform:translate(-50%,-100%) scale(0)}70%{transform:translate(-50%,-100%) scale(1.3)}100%{transform:translate(-50%,-100%) scale(1)}}
.flag{position:absolute;left:50%;top:-2px;animation:flag .45s .8s ease-out both;transform-origin:50% 100%}
@keyframes jump{0%,100%{transform:translateY(0) scaleY(1)}10%{transform:translateY(0) scaleY(.88) scaleX(1.08)}40%{transform:translateY(-46px) scaleY(1.06)}60%{transform:translateY(-46px)}88%{transform:translateY(0) scaleY(.92) scaleX(1.05)}}
.jump{animation:jump 1.3s cubic-bezier(.3,.7,.4,1) infinite;transform-origin:50% 100%}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.14}40%,60%{transform:scaleX(.6);opacity:.06}}
.shd{animation:shadow 1.3s cubic-bezier(.3,.7,.4,1) infinite}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}
.bubble{animation:pop .4s .4s cubic-bezier(.2,.9,.3,1.3) both;transform-origin:50% 100%}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.2);opacity:1}75%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
.cf{position:absolute;left:0;top:0;animation:burst var(--t) var(--d) cubic-bezier(.1,.7,.3,1) both}
@keyframes wavef{0%,100%{transform:skewY(0)}50%{transform:skewY(-8deg)}}
.flagw{animation:wavef .5s 1.25s ease-in-out 4;transform-origin:0 50%}
@keyframes tw{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(90deg);opacity:1}}
.tw{position:absolute;animation:tw 1.6s ease-in-out infinite}
.stat{flex:1;padding:12px 8px;border-radius:16px;text-align:center}
</style>
</helmet>
<div class="app">
  <div style="display: flex; align-items: center; gap: 10px; padding: 52px 20px 0 8px">
    <a class="iconbtn" href="Quit-confirm.dc.html" aria-label="Закрыть занятие"><svg class="ico" viewBox="0 0 24 24" style="width: 26px; height: 26px"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <div class="bar" role="progressbar" aria-label="Прогресс занятия" aria-valuemin="0" aria-valuemax="12" aria-valuenow="6">
      <div class="fill"></div>
      <div style="position: absolute; left: 50%; top: 0; width: 0; height: 0"><sc-for list="{{cf}}" as="c" hint-placeholder-count="0"><span class="cf" style="{{c.style}}"></span></sc-for></div>
      <svg class="flag" viewBox="0 0 24 28" width="22" height="26" aria-hidden="true"><path d="M5 26V3" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"></path><path class="flagw" d="M6 3h13l-3 5 3 5H6z" fill="#df2d2d"></path></svg>
    </div>
  </div>

  <div style="text-align: center; padding-top: 110px">
    <div class="bubble" style="display: inline-block; position: relative; background: #fff; border: 2px solid rgba(26,26,26,.15); border-radius: 22px; padding: 16px 22px; max-width: 300px">
      <div class="disp" style="font-size: 22px; font-weight: 900; line-height: 1.2">Половина пути!</div>
      <div style="font-size: 16px; margin-top: 6px">Держишь темп. Ещё 6 заданий</div>
      <span aria-hidden="true" style="position: absolute; left: 50%; bottom: -12px; width: 22px; height: 22px; margin-left: -11px; background: #fff; border-right: 2px solid rgba(26,26,26,.15); border-bottom: 2px solid rgba(26,26,26,.15); transform: rotate(45deg)"></span>
    </div>
    <div style="position: relative; height: 230px; margin-top: 26px; display: flex; justify-content: center; align-items: flex-end">
      <div class="shd" aria-hidden="true" style="position: absolute; bottom: 4px; width: 110px; height: 18px; border-radius: 50%; background: #1a1a1a"></div>
      <svg class="tw" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="left: 90px; top: 40px"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#ffc700"></path></svg><svg class="tw" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="right: 96px; top: 70px; animation-delay: .7s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#ff9500"></path></svg>
      <div class="jump"><svg viewBox="0 0 128 150" width="160" height="188" aria-hidden="true"><path d="M64 8C78 26 100 44 92 72C87 92 66 104 48 90C32 78 32 54 48 40C58 31 60 20 64 8Z" fill="#2b820f"></path><path d="M60 46C70 58 76 68 68 82C63 90 50 90 44 81C39 73 43 61 51 53C55 50 57 48 60 46Z" fill="#e3f6d3" opacity="0.9"></path><path d="M50 62q4-5 8 0M62 62q4-5 8 0" fill="none" stroke="#1c540a" stroke-width="2.6" stroke-linecap="round"></path><path d="M52 70q8 9 16 0z" fill="#1c540a"></path><ellipse cx="90" cy="100" rx="19" ry="12" fill="#ff9500" transform="rotate(-28 90 100)"></ellipse><ellipse cx="94" cy="96" rx="8" ry="5" fill="#ffc700" transform="rotate(-28 94 96)" opacity="0.85"></ellipse></svg></div>
    </div>
    <div class="rise" style="display: flex; gap: 8px; margin: 22px 20px 0; animation-delay: .7s">
      <div class="stat" style="background: #ffe8c2; color: #9a330a"><div class="disp" style="font-size: 22px; font-weight: 900">{{combo}}</div><div style="font-size: 12px; font-weight: 700; margin-top: 2px">подряд верно</div></div>
      <div class="stat" style="background: #fff1b8; color: #7a5900"><div class="disp" style="font-size: 22px; font-weight: 900">+{{xp}}</div><div style="font-size: 12px; font-weight: 700; margin-top: 2px">XP уже</div></div>
      <div class="stat" style="background: #e3f6d3; color: #166534"><div class="disp" style="font-size: 22px; font-weight: 900">2</div><div style="font-size: 12px; font-weight: 700; margin-top: 2px">мин до финиша</div></div>
    </div>
  </div>

  <div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px; animation-delay: 1s">
    <a class="btn b-leaf" href="Lesson-listen.dc.html">Продолжить</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = Date.now();
    this.iv = setInterval(() => { this.forceUpdate(); if (Date.now() - this.t0 > 2200) clearInterval(this.iv); }, 33);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const el = this.t0 ? Date.now() - this.t0 : 0;
    const p = Math.min(1, Math.max(0, (el - 800) / 900));
    const e = 1 - Math.pow(1 - p, 3);
    let s = 31;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cols = ['#ff9500', '#ffc700', '#2b820f', '#1cb0f6', '#df2d2d'];
    const cf = [];
    for (let i = 0; i < 18; i++) {
      const a = Math.PI * (0.15 + r() * 0.7);
      const d = 60 + r() * 120;
      const w = 5 + Math.round(r() * 4);
      cf.push({ style: 'width:' + w + 'px;height:' + (r() < .5 ? w : w * 2) + 'px;background:' + cols[i % 5] + ';border-radius:' + (r() < .3 ? '99px' : '2px') + ';--dx:' + Math.round(Math.cos(a) * d * 1.4) + 'px;--dy:' + Math.round(Math.sin(a) * d) + 'px;--r:' + Math.round(r() * 720 - 360) + 'deg;--d:' + (0.85 + r() * 0.1).toFixed(2) + 's;--t:' + (1 + r() * 0.6).toFixed(2) + 's' });
    }
    return { cf, xp: Math.round(e * 45), combo: Math.round(e * 5) };
  }
}
</script>
</body>
</html>
