<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Мой английский обновился</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#166534}a:hover{color:#123706}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#f5f1ea;color:#1a1a1a;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.muted{color:rgba(26,26,26,.68)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:54px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-leaf{--f:#2b820f;--e:#1c540a;--l:#fff}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes merge{0%{transform:translateX(var(--x)) scale(.8);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.twin{animation:merge .7s .1s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(28,176,246,.35)}50%{box-shadow:0 0 0 12px rgba(28,176,246,0)}}
.halo{animation:glow 2s .8s ease-out infinite}
@keyframes up{0%{transform:translateY(8px);opacity:0}100%{transform:none;opacity:1}}
.delta{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;padding:3px 7px;border-radius:8px;animation:up .3s var(--d) ease-out both}
.sk{padding:10px 0}
.track{height:12px;border-radius:99px;background:#ece6db;overflow:hidden;margin-top:7px;position:relative}
.was{position:absolute;top:0;bottom:0;width:3px;background:rgba(26,26,26,.35);border-radius:2px}
</style>
</helmet>
<div class="app">
  <div style="text-align: center; padding-top: 56px">
    <div style="display: inline-flex; align-items: center; justify-content: center; position: relative; width: 150px; height: 120px">
      <div class="twin" style="--x: -40px; position: absolute; left: 14px; top: 8px; opacity: .45"><svg viewBox="0 0 128 150" width="82" height="96" aria-hidden="true"><path d="M64 8C78 26 100 44 92 72C87 92 66 104 48 90C32 78 32 54 48 40C58 31 60 20 64 8Z" fill="#1cb0f6"></path></svg></div>
      <div class="twin halo" style="--x: 40px; position: relative; border-radius: 999px; padding: 6px; background: #ddf4ff"><svg viewBox="0 0 128 150" width="82" height="96" aria-hidden="true"><path d="M64 8C78 26 100 44 92 72C87 92 66 104 48 90C32 78 32 54 48 40C58 31 60 20 64 8Z" fill="#2b820f"></path><path d="M60 46C70 58 76 68 68 82C63 90 50 90 44 81C39 73 43 61 51 53C55 50 57 48 60 46Z" fill="#e3f6d3" opacity="0.9"></path><ellipse cx="54" cy="62" rx="3.4" ry="4.6" fill="#1c540a"></ellipse><ellipse cx="66" cy="62" rx="3.4" ry="4.6" fill="#1c540a"></ellipse><path d="M54 72q6 5 12 0" fill="none" stroke="#1c540a" stroke-width="2.4" stroke-linecap="round"></path><ellipse cx="90" cy="100" rx="19" ry="12" fill="#ff9500" transform="rotate(-28 90 100)"></ellipse></svg></div>
    </div>
    <div class="rise" style="font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #0c7c9c; margin-top: 8px; animation-delay: .5s">Мой английский · неделя 3</div>
    <h1 class="disp rise" style="margin: 6px 24px 0; font-size: 23px; line-height: 1.2; font-weight: 900; animation-delay: .6s">Оценка обновилась</h1>
    <p class="muted rise" style="margin: 6px 30px 0; font-size: 15px; animation-delay: .7s">По 41 занятию и 6 главам за неделю</p>
  </div>

  <div class="rise" style="margin: 16px 20px 0; padding: 4px 16px 8px; border-radius: 20px; background: #fff; border: 2px solid rgba(26,26,26,.12); animation-delay: .8s">
    <sc-for list="{{skills}}" as="k" hint-placeholder-count="4">
      <div class="sk" style="{{k.row}}">
        <div style="display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 700">
          <span>{{k.name}}</span>
          <span class="delta" style="{{k.dstyle}}">{{k.delta}}</span>
        </div>
        <div class="track"><div style="height: 100%; width: {{k.w}}; border-radius: 99px; background: {{k.col}}"></div><span class="was" style="{{k.was}}"></span></div>
      </div>
    </sc-for>
  </div>

  <div class="rise" style="margin: 12px 20px 0; padding: 12px 14px; border-radius: 18px; background: #fff1b8; display: flex; gap: 12px; align-items: flex-start; animation-delay: 2.2s">
    <div style="width: 40px; height: 40px; border-radius: 12px; background: #ffc700; display: flex; align-items: center; justify-content: center; flex: none"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: #4d3800; stroke-width: 2.4; stroke-linecap: round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2"></path></svg></div>
    <div>
      <div style="font-size: 12px; font-weight: 700; color: #7a5900; text-transform: uppercase; letter-spacing: .05em">Фокус на неделю</div>
      <div style="font-size: 15px; font-weight: 700; margin-top: 3px; color: #4d3800">12 слов узнаёшь в тексте, но не вспоминаешь сам</div>
    </div>
  </div>

  <div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px; animation-delay: 2.4s">
    <a class="btn b-leaf" href="Lesson-start.dc.html">Потренировать фокус · 4 мин</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = Date.now();
    this.iv = setInterval(() => { this.forceUpdate(); if (Date.now() - this.t0 > 2400) clearInterval(this.iv); }, 33);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const el = this.t0 ? Date.now() - this.t0 : 0;
    const data = [['Чтение', 58, 66, '#2b820f'], ['Словарь', 49, 55, '#2b820f'], ['На слух', 40, 43, '#1cb0f6'], ['Грамматика', 46, 44, '#c2410c']];
    const skills = data.map((d, k) => {
      const p = Math.min(1, Math.max(0, (el - 1000 - k * 150) / 700));
      const e = 1 - Math.pow(1 - p, 3);
      const v = d[1] + (d[2] - d[1]) * e;
      const diff = d[2] - d[1];
      return {
        name: d[0],
        w: v.toFixed(1) + '%',
        col: d[3],
        was: 'left: ' + d[1] + '%',
        delta: (diff > 0 ? '+' : '−') + Math.abs(diff),
        dstyle: (diff > 0 ? 'background: #e3f6d3; color: #166534;' : 'background: #ffdede; color: #c21b1b;') + '--d: ' + (1.6 + k * 0.15).toFixed(2) + 's',
        row: k < 3 ? 'border-bottom: 2px solid #f0ebe2' : ''
      };
    });
    return { skills };
  }
}
</script>
</body>
</html>
