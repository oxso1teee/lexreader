<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Нет интернета</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#166534}a:hover{color:#123706}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#f5f1ea;color:#1a1a1a;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-leaf{--f:#2b820f;--e:#1c540a;--l:#fff}
.card{background:#fff;border:2px solid rgba(26,26,26,.18);border-radius:20px}
.muted{color:rgba(26,26,26,.68)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.sway{animation:sway 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes plug{0%,100%{transform:translateX(0)}50%{transform:translateX(-8px)}}
.plug{animation:plug 1.8s ease-in-out infinite}
@keyframes spark{0%,70%,100%{opacity:0}80%{opacity:1}}
.spark{animation:spark 1.8s ease-in-out infinite}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.cover{width:34px;height:46px;border-radius:6px;flex:none;display:flex;align-items:flex-end;padding:3px;color:#fff;font:700 5px/1.1 Unbounded,sans-serif}
.retry{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;margin-top:14px;border:0;background:none;font:600 15px/1 Onest,sans-serif;color:rgba(26,26,26,.68);cursor:pointer;text-decoration:underline}
@keyframes toastin{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}
.toast{margin-bottom:12px;padding:12px 14px;border-radius:14px;background:#1a1a1a;color:#fff;font-size:14px;font-weight:600;text-align:center;animation:toastin .3s ease-out both}
</style>
</helmet>
<div class="app">
  <div style="text-align: center; padding-top: 120px">
    <div style="position: relative; display: inline-block; width: 260px; height: 170px">
      <div class="sway" style="position: absolute; left: 0; bottom: 0"><svg viewBox="0 0 128 150" width="120" height="140" aria-hidden="true"><ellipse cx="64" cy="128" rx="34" ry="9" fill="rgba(0,0,0,0.06)"></ellipse><path d="M64 8C78 26 100 44 92 72C87 92 66 104 48 90C32 78 32 54 48 40C58 31 60 20 64 8Z" fill="#2b820f"></path><path d="M60 46C70 58 76 68 68 82C63 90 50 90 44 81C39 73 43 61 51 53C55 50 57 48 60 46Z" fill="#e3f6d3" opacity="0.9"></path><path d="M49 58l8-2M71 58l-8-2" stroke="#1c540a" stroke-width="2.4" stroke-linecap="round"></path><ellipse cx="54" cy="62" rx="3.4" ry="4.6" fill="#1c540a"></ellipse><ellipse cx="66" cy="62" rx="3.4" ry="4.6" fill="#1c540a"></ellipse><ellipse cx="60" cy="75" rx="3.4" ry="4" fill="#1c540a"></ellipse><ellipse cx="90" cy="100" rx="19" ry="12" fill="#ff9500" transform="rotate(-28 90 100)"></ellipse></svg></div>
      <svg viewBox="0 0 150 80" width="150" height="80" aria-hidden="true" style="position: absolute; right: 0; bottom: 18px">
        <path d="M0 60 C30 60 30 30 60 30 S80 50 92 50" fill="none" stroke="#6b7280" stroke-width="5" stroke-linecap="round"></path>
        <g class="plug"><rect x="92" y="40" width="20" height="20" rx="4" fill="#6b7280"></rect><path d="M112 45h8M112 55h8" stroke="#6b7280" stroke-width="4" stroke-linecap="round"></path></g>
        <rect x="134" y="34" width="14" height="32" rx="4" fill="#d6cfc3"></rect>
        <g class="spark"><path d="M126 32l4 6M128 50h-6M126 68l4-6" stroke="#ffc700" stroke-width="3" stroke-linecap="round"></path></g>
      </svg>
    </div>
    <h1 class="disp rise" style="margin: 18px 24px 0; font-size: 26px; line-height: 1.2; font-weight: 900">Нет интернета</h1>
    <p class="muted rise" style="margin: 10px 30px 0; font-size: 16px; line-height: 1.45; animation-delay: .1s">Не беда: скачанные тексты читаются и без сети. Прогресс отправим, когда связь вернётся</p>
  </div>

  <div class="card rise" style="margin: 22px 20px 0; animation-delay: .2s">
    <div class="muted" style="padding: 12px 14px 0; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase">Доступно офлайн</div>
    <div class="row" style="border-bottom: 2px solid #f0ebe2">
      <div class="cover" style="background: #0b79b0">THE LAST LIGHT­HOUSE</div>
      <div style="flex: 1"><div style="font-weight: 700; font-size: 15px">The Last Lighthouse</div><div class="muted" style="font-size: 12px; margin-top: 2px">Глава 3 · 64%</div></div>
      <svg class="ico" viewBox="0 0 24 24" style="color: #166534"><path d="M5 12l5 5L20 7"></path></svg>
    </div>
    <div class="row">
      <div style="width: 34px; height: 46px; border-radius: 6px; background: #ddf4ff; color: #0c7c9c; display: flex; align-items: center; justify-content: center; flex: none"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"></rect><path d="M7 2h12a2 2 0 0 1 2 2v12"></path></svg></div>
      <div style="flex: 1"><div style="font-weight: 700; font-size: 15px">Повтор слов</div><div class="muted" style="font-size: 12px; margin-top: 2px">18 карточек</div></div>
      <svg class="ico" viewBox="0 0 24 24" style="color: #166534"><path d="M5 12l5 5L20 7"></path></svg>
    </div>
  </div>

  <div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 30px; animation-delay: .35s">
    <sc-if value="{{tried}}" hint-placeholder-val="{{ false }}"><div class="toast" role="status">Сети пока нет. Попробуем сами через минуту</div></sc-if>
    <a class="btn b-leaf" href="Reader.dc.html">Читать офлайн</a>
    <button class="retry" type="button" onClick="{{retry}}">
      <sc-if value="{{checking}}" hint-placeholder-val="{{ false }}"><svg class="ico spin" viewBox="0 0 24 24" style="width: 16px; height: 16px"><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg></sc-if>
      {{retryLabel}}
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { checking: false, tried: false };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const c = this.state.checking;
    return {
      checking: c,
      retryLabel: c ? 'Проверяем связь…' : 'Проверить снова',
      tried: this.state.tried && !c,
      retry: () => {
        this.setState({ checking: true });
        clearTimeout(this.t);
        this.t = setTimeout(() => this.setState({ checking: false, tried: true }), 1800);
      }
    };
  }
}
</script>
</body>
</html>
