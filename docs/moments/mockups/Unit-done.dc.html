<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Раздел пройден</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#fff}a:hover{color:#fff1b8}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#0b79b0;color:#fff;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-white{--f:#fff;--e:#bfe6f8;--l:#075a85}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes up{0%{transform:translateY(80px) scale(.6);opacity:0}60%{transform:translateY(-10px) scale(1.06);opacity:1}100%{transform:none}}
.up{animation:up .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes shine{0%{transform:translateX(-90px) rotate(20deg)}100%{transform:translateX(150px) rotate(20deg)}}
.shine{position:absolute;top:-30px;width:26px;height:200px;background:rgba(255,255,255,.6);animation:shine 2.4s 1s ease-in-out infinite}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.2);opacity:1}75%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
.cf{position:absolute;left:0;top:0;animation:burst var(--t) var(--d) cubic-bezier(.1,.7,.3,1) both}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes unlock{0%,40%{transform:rotate(0)}55%{transform:rotate(-14deg)}70%{transform:rotate(10deg)}100%{transform:rotate(0)}}
.unlock{animation:unlock 1s 1.6s ease-in-out both}
@keyframes shackle{0%,60%{transform:translateY(0)}100%{transform:translateY(-6px) rotate(-25deg)}}
.shackle{transform-origin:16px 11px;animation:shackle .5s 2.2s ease-out both}
</style>
</helmet>
<div class="app">
  <div aria-hidden="true" style="position: absolute; width: 480px; height: 480px; border-radius: 999px; background: #075a85; opacity: .45; left: -45px; top: 40px"></div>

  <div style="position: relative; text-align: center; padding-top: 86px">
    <div style="position: absolute; left: 50%; top: 190px; width: 0; height: 0">
      <sc-for list="{{cf}}" as="c" hint-placeholder-count="0"><span class="cf" style="{{c.style}}"></span></sc-for>
    </div>
    <div class="up" style="display: inline-block; position: relative; width: 160px; height: 190px; overflow: hidden">
      <svg viewBox="0 0 160 190" width="160" height="190" aria-hidden="true">
        <path d="M30 14h100v42c0 32-22 56-50 56S30 88 30 56z" fill="#ffc700" stroke="#7a5900" stroke-width="6" stroke-linejoin="round"></path>
        <path d="M30 26H10v16c0 18 12 30 24 30M130 26h20v16c0 18-12 30-24 30" fill="none" stroke="#7a5900" stroke-width="6" stroke-linecap="round"></path>
        <rect x="68" y="112" width="24" height="30" fill="#e0a500" stroke="#7a5900" stroke-width="6"></rect>
        <rect x="40" y="142" width="80" height="26" rx="8" fill="#ffc700" stroke="#7a5900" stroke-width="6"></rect>
        <text x="80" y="76" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="900" font-size="34" fill="#7a5900">2</text>
      </svg>
      <span class="shine" aria-hidden="true"></span>
    </div>
    <div class="rise" style="font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; margin-top: 18px; animation-delay: .7s">Раздел 2 пройден</div>
    <h1 class="disp rise" style="margin: 8px 24px 0; font-size: 30px; line-height: 1.15; font-weight: 900; animation-delay: .8s">Путешествия</h1>
    <p class="rise" style="margin: 10px 30px 0; font-size: 16px; opacity: .92; animation-delay: .9s">Теперь ты закажешь билет и спросишь дорогу</p>
  </div>

  <div class="rise" style="position: relative; display: flex; gap: 10px; margin: 26px 20px 0; animation-delay: 1.1s">
    <div style="flex: 1; border-radius: 18px; background: rgba(255,255,255,.16); padding: 14px; text-align: center"><div class="disp" style="font-size: 24px; font-weight: 900">{{a}}</div><div style="font-size: 13px; opacity: .9; margin-top: 4px">новых слова</div></div>
    <div style="flex: 1; border-radius: 18px; background: rgba(255,255,255,.16); padding: 14px; text-align: center"><div class="disp" style="font-size: 24px; font-weight: 900">{{b}}</div><div style="font-size: 13px; opacity: .9; margin-top: 4px">занятий</div></div>
    <div style="flex: 1; border-radius: 18px; background: rgba(255,255,255,.16); padding: 14px; text-align: center"><div class="disp" style="font-size: 24px; font-weight: 900">{{c}}</div><div style="font-size: 13px; opacity: .9; margin-top: 4px">текста</div></div>
  </div>

  <div class="rise" style="position: relative; margin: 12px 20px 0; border-radius: 18px; background: #fff; color: #1a1a1a; padding: 12px 14px; display: flex; align-items: center; gap: 12px; animation-delay: 1.3s">
    <div class="unlock" style="width: 44px; height: 44px; border-radius: 14px; background: #e3f6d3; color: #166534; display: flex; align-items: center; justify-content: center; flex: none">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round"><rect x="7" y="15" width="18" height="13" rx="3"></rect><path class="shackle" d="M11 15v-4a5 5 0 0 1 10 0v4"></path></svg>
    </div>
    <div><div style="font-size: 12px; font-weight: 700; color: #166534; text-transform: uppercase; letter-spacing: .05em">Открыт раздел 3</div><div style="font-weight: 700; font-size: 16px; margin-top: 2px">Работа и учёба</div></div>
  </div>

  <div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px; animation-delay: 1.8s">
    <a class="btn b-white" href="Path.dc.html">К разделу 3</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = Date.now();
    this.ivx = setInterval(() => { this.forceUpdate(); if (Date.now() - this.t0 > 2600) clearInterval(this.ivx); }, 33);
  }
  componentWillUnmount() { clearInterval(this.ivx); }
  cu(to, delay, dur) {
    const el = this.t0 ? Date.now() - this.t0 : 0;
    const p = Math.min(1, Math.max(0, (el - delay) / dur));
    return Math.round(to * (1 - Math.pow(1 - p, 3)));
  }
  renderVals() {
    let s = 17;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cols = ['#ffc700', '#fff', '#cdeeb0', '#ff9500', '#ddf4ff'];
    const cf = [];
    for (let i = 0; i < 30; i++) {
      const a = r() * Math.PI * 2;
      const d = 130 + r() * 110;
      const w = 6 + Math.round(r() * 6);
      cf.push({ style: 'width:' + w + 'px;height:' + (r() < .5 ? w : w * 2) + 'px;background:' + cols[i % 5] + ';border-radius:' + (r() < .3 ? '99px' : '2px') + ';--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d + 40) + 'px;--r:' + Math.round(r() * 720 - 360) + 'deg;--d:' + (0.5 + r() * 0.2).toFixed(2) + 's;--t:' + (1.2 + r() * 0.8).toFixed(2) + 's' });
    }
    return { cf, a: this.cu(42, 1150, 900), b: this.cu(6, 1250, 700), c: this.cu(2, 1350, 500) };
  }
}
</script>
</body>
</html>
