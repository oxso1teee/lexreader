<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Итоги рейтинга недели</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#166534}a:hover{color:#123706}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#f5f1ea;color:#1a1a1a;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-leaf{--f:#2b820f;--e:#1c540a;--l:#fff}
.muted{color:rgba(26,26,26,.68)}
.av{width:56px;height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;font:900 20px/1 Unbounded,sans-serif;color:#fff;border:3px solid #fff;margin:0 auto}
@keyframes up{0%{transform:scaleY(0)}70%{transform:scaleY(1.06)}100%{transform:scaleY(1)}}
.col{transform-origin:50% 100%;animation:up .6s cubic-bezier(.2,.9,.3,1.1) both;border-radius:16px 16px 0 0;display:flex;justify-content:center;padding-top:10px;font:900 26px/1 Unbounded,sans-serif;box-shadow:inset 0 -6px 0 0 rgba(0,0,0,.08)}
@keyframes drop{0%{transform:translateY(-40px) scale(.6);opacity:0}70%{transform:translateY(4px) scale(1.05);opacity:1}100%{transform:none;opacity:1}}
.drop{animation:drop .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;font-size:15px}
.sm{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font:700 14px/1 Onest,sans-serif;color:#fff;flex:none}
@keyframes crown{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-4px) rotate(6deg)}}
.crown{animation:crown 1.8s 2s ease-in-out infinite}
@keyframes crowndrop{0%{transform:translateY(-80px) rotate(-30deg);opacity:0}70%{transform:translateY(4px) rotate(8deg);opacity:1}100%{transform:none;opacity:1}}
.crowndrop{animation:crowndrop .55s 1.6s cubic-bezier(.3,.7,.4,1) both}
@keyframes me{0%{box-shadow:0 0 0 0 rgba(43,130,15,.4)}100%{box-shadow:0 0 0 10px rgba(43,130,15,0)}}
.me{animation:rise .45s 1.9s cubic-bezier(.2,.8,.2,1) both,me 1.6s 2.4s ease-out infinite}
</style>
</helmet>
<div class="app">
  <div style="text-align: center; padding: 60px 24px 0">
    <div class="rise" style="font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #0c7c9c">Рейтинг недели · 13–19 окт</div>
    <h1 class="disp rise" style="margin: 8px 0 0; font-size: 26px; line-height: 1.2; font-weight: 900; animation-delay: .1s">Ты на 4 месте!</h1>
    <p class="muted rise" style="margin: 6px 0 0; font-size: 15px; animation-delay: .2s">До бронзы не хватило 40 XP</p>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 10px; padding: 26px 24px 0; height: 300px">
    <div style="flex: 1; text-align: center">
      <div class="drop" style="animation-delay: 1.1s"><div class="av" style="background: #0b79b0">М</div><div style="font-weight: 700; font-size: 14px; margin-top: 6px">Макс</div><div class="muted" style="font-size: 12px">{{x2}} XP</div></div>
      <div class="col" style="height: 110px; margin-top: 8px; background: #d6dde3; color: #4b5563; animation-delay: .7s">2</div>
    </div>
    <div style="flex: 1; text-align: center">
      <div class="drop" style="animation-delay: 1.4s">
        <svg class="crowndrop" viewBox="0 0 128 60" width="40" height="19" aria-hidden="true" style="display: block; margin: 0 auto 2px"><g class="crown" style="transform-origin: 64px 30px"><path d="M10 56 L18 12 L42 36 L64 4 L86 36 L110 12 L118 56 Z" fill="#ffc700" stroke="#7a5900" stroke-width="6" stroke-linejoin="round"></path></g></svg>
        <div class="av" style="background: #8b5cf6; width: 64px; height: 64px">А</div><div style="font-weight: 700; font-size: 14px; margin-top: 6px">Аня</div><div class="muted" style="font-size: 12px">{{x1}} XP</div>
      </div>
      <div class="col" style="height: 150px; margin-top: 8px; background: #ffc700; color: #7a5900; animation-delay: 1s">1</div>
    </div>
    <div style="flex: 1; text-align: center">
      <div class="drop" style="animation-delay: .8s"><div class="av" style="background: #c2410c">Л</div><div style="font-weight: 700; font-size: 14px; margin-top: 6px">Лена</div><div class="muted" style="font-size: 12px">{{x3}} XP</div></div>
      <div class="col" style="height: 80px; margin-top: 8px; background: #f0c9a4; color: #7c3a10; animation-delay: .4s">3</div>
    </div>
  </div>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 6px; margin-top: 14px">
    <div class="row me" style="background: #e3f6d3; border: 2px solid #2b820f">
      <span style="width: 20px; font-weight: 700; color: #166534">4</span><span class="sm" style="background: #2b820f">С</span><b style="flex: 1">Ты</b><span style="font-weight: 700; color: #166534">310 XP</span>
    </div>
    <div class="row rise" style="background: #fff; animation-delay: 2s">
      <span style="width: 20px; font-weight: 700" class="muted">5</span><span class="sm" style="background: #6b7280">Д</span><span style="flex: 1">Дима</span><span class="muted" style="font-weight: 700">280 XP</span>
    </div>
  </div>

  <div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px; animation-delay: 2.3s">
    <a class="btn b-leaf" href="Progress.dc.html">Новая неделя уже началась</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.s = Date.now();
    this.iv = setInterval(() => { this.forceUpdate(); if (Date.now() - this.s > 2400) clearInterval(this.iv); }, 35);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  k(delay) {
    if (!this.s) return 0;
    const p = Math.min(1, Math.max(0, (Date.now() - this.s - delay) / 700));
    return 1 - Math.pow(1 - p, 3);
  }
  renderVals() {
    return { x3: Math.round(this.k(800) * 350), x2: Math.round(this.k(1100) * 420), x1: Math.round(this.k(1400) * 510) };
  }
}
</script>
</body>
</html>
