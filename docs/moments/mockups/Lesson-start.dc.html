<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Старт занятия</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#166534}a:hover{color:#123706}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#f5f1ea;color:#1a1a1a;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.muted{color:rgba(26,26,26,.68)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:54px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-leaf{--f:#2b820f;--e:#1c540a;--l:#fff}
.b-off{--f:#ece6db;--e:#d6cfc3;--l:rgba(26,26,26,.5);cursor:default}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bob{animation:bob 2s ease-in-out infinite}
@keyframes flip{0%{transform:rotateY(0)}45%,100%{transform:rotateY(-180deg)}}
.page{animation:flip 1.1s ease-in-out infinite;transform-origin:0 50%;backface-visibility:hidden}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(43,130,15,.45)}100%{box-shadow:0 0 0 16px rgba(43,130,15,0)}}
.go{animation:rise .4s cubic-bezier(.2,.9,.3,1.2) both, pulse 1.4s .4s ease-out infinite;border-radius:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite}
@keyframes chk{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:none}}
.chk{animation:chk .3s cubic-bezier(.2,.9,.3,1.3) both}
.step{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:15px;font-weight:600;transition:color .2s}
.si{width:26px;height:26px;border-radius:99px;display:flex;align-items:center;justify-content:center;flex:none}
.pill{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;padding:10px 4px;border-radius:14px}
@keyframes tip{0%{opacity:0;transform:translateY(8px)}10%,90%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
</style>
</helmet>
<div class="app">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 52px 20px 0">
    <a href="Main.dc.html" aria-label="Закрыть" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: rgba(26,26,26,.55)"><svg class="ico" viewBox="0 0 24 24" style="width: 26px; height: 26px"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <span style="padding: 6px 12px; border-radius: 99px; background: #ddf4ff; color: #0c7c9c; font-size: 13px; font-weight: 700">Раздел 2 · Занятие 4</span>
  </div>

  <div style="text-align: center; padding-top: 28px">
    <div style="position: relative; display: inline-flex; align-items: flex-end; gap: 4px">
      <div class="bob"><svg viewBox="0 0 128 150" width="110" height="129" aria-hidden="true"><ellipse cx="64" cy="128" rx="34" ry="9" fill="rgba(0,0,0,0.06)"></ellipse><path d="M64 8C78 26 100 44 92 72C87 92 66 104 48 90C32 78 32 54 48 40C58 31 60 20 64 8Z" fill="#2b820f"></path><path d="M60 46C70 58 76 68 68 82C63 90 50 90 44 81C39 73 43 61 51 53C55 50 57 48 60 46Z" fill="#e3f6d3" opacity="0.9"></path><ellipse cx="56" cy="64" rx="3" ry="2" fill="#1c540a"></ellipse><ellipse cx="68" cy="64" rx="3" ry="2" fill="#1c540a"></ellipse><ellipse cx="90" cy="100" rx="19" ry="12" fill="#ff9500" transform="rotate(-28 90 100)"></ellipse><ellipse cx="94" cy="96" rx="8" ry="5" fill="#ffc700" transform="rotate(-28 94 96)" opacity="0.85"></ellipse></svg></div>
      <div style="position: relative; width: 104px; height: 68px; margin-bottom: 14px; perspective: 400px" aria-hidden="true">
        <div style="position: absolute; left: 0; top: 0; width: 52px; height: 68px; background: #fff; border: 2px solid rgba(26,26,26,.18); border-radius: 8px 2px 2px 8px"></div>
        <div style="position: absolute; left: 52px; top: 0; width: 52px; height: 68px; background: #fff; border: 2px solid rgba(26,26,26,.18); border-radius: 2px 8px 8px 2px"></div>
        <div class="page" style="position: absolute; left: 52px; top: 0; width: 52px; height: 68px; background: #ddf4ff; border: 2px solid #1cb0f6; border-radius: 2px 8px 8px 2px"></div>
      </div>
    </div>
    <h1 class="disp" style="margin: 14px 24px 0; font-size: 23px; line-height: 1.2; font-weight: 900">Глава 3: «Шторм»</h1>
    <p class="muted" style="margin: 6px 0 0; font-size: 15px">≈ 4 минуты · можно прервать в любой момент</p>
  </div>

  <div class="rise" style="display: flex; gap: 8px; margin: 18px 20px 0; animation-delay: .1s">
    <div class="pill" style="background: #fff1b8; color: #7a5900"><span class="disp" style="font-size: 20px; font-weight: 900">8</span><span style="font-size: 12px; font-weight: 700">новых слов</span></div>
    <div class="pill" style="background: #ddf4ff; color: #0c7c9c"><span class="disp" style="font-size: 20px; font-weight: 900">6</span><span style="font-size: 12px; font-weight: 700">на повтор</span></div>
    <div class="pill" style="background: #e3f6d3; color: #166534"><span class="disp" style="font-size: 20px; font-weight: 900">12</span><span style="font-size: 12px; font-weight: 700">заданий</span></div>
  </div>

  <div class="rise" style="margin: 14px 20px 0; padding: 4px 16px; border-radius: 20px; background: #fff; border: 2px solid rgba(26,26,26,.12); animation-delay: .2s" aria-live="polite">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
      <div class="step" style="{{s.row}}">
        <span class="si" style="{{s.bg}}">
          <sc-if value="{{s.done}}" hint-placeholder-val="{{ true }}"><svg class="chk" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12l5 5L20 7" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
          <sc-if value="{{s.busy}}" hint-placeholder-val="{{ false }}"><svg class="ico spin" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: #2b820f; stroke-width: 3"><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg></sc-if>
        </span>
        {{s.t}}
      </div>
    </sc-for>
  </div>

  <div style="margin: 14px 20px 0; padding: 12px 14px; border-radius: 18px; background: #fff1b8; display: flex; gap: 12px; align-items: flex-start">
    <svg class="ico" viewBox="0 0 24 24" style="width: 24px; height: 24px; color: #7a5900"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"></path></svg>
    <div style="font-size: 14px; line-height: 1.45; color: #4d3800"><b>Совет.</b> Зажми слово в тексте и проведи пальцем, чтобы перевести всю фразу.</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px">
    <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}"><div class="go"><a class="btn b-leaf" href="Lesson-choice.dc.html">Поехали</a></div></sc-if>
    <sc-if value="{{wait}}" hint-placeholder-val="{{ true }}"><div class="btn b-off" aria-disabled="true">{{pct}}%</div></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = Date.now();
    this.iv = setInterval(() => { this.forceUpdate(); if (Date.now() - this.t0 > 2600) clearInterval(this.iv); }, 40);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const el = this.t0 ? Date.now() - this.t0 : 0;
    const marks = [700, 1400, 2100];
    const labels = ['Берём слова из главы 3', 'Добавляем твои повторы', 'Собираем задания'];
    const steps = labels.map((t, k) => {
      const done = el >= marks[k];
      const busy = !done && (k === 0 || el >= marks[k - 1]);
      return {
        t, done, busy,
        bg: done ? 'background: #2b820f' : (busy ? 'background: #e3f6d3' : 'background: #ece6db'),
        row: (k < 2 ? 'border-bottom: 2px solid #f0ebe2;' : '') + (done || busy ? 'color: #1a1a1a' : 'color: rgba(26,26,26,.45)')
      };
    });
    const pct = Math.min(100, Math.round(el / 21));
    const ready = el >= 2200;
    return { steps, ready, wait: !ready, pct };
  }
}
</script>
</body>
</html>
