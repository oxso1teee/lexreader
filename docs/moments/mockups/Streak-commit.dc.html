<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Обещание стрика</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#166534}a:hover{color:#123706}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#f5f1ea;color:#1a1a1a;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:54px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-ember{--f:#c2410c;--e:#9a330a;--l:#fff}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:rgba(26,26,26,.55);border:0;background:none}
.bar{flex:1;height:16px;border-radius:99px;background:#ece6db;overflow:hidden}
@keyframes grow{from{width:50%}to{width:75%}}
.fill{height:100%;border-radius:99px;background:#2b820f;box-shadow:inset 0 -4px 0 0 #1c540a;animation:grow .7s .2s cubic-bezier(.4,0,.2,1) both}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.05,.96) rotate(2deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-origin:50% 90%}
@keyframes emb{0%{transform:translate(0,0) scale(1);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-110px) scale(.3);opacity:0}}
.emb{position:absolute;left:50%;bottom:30px;width:7px;height:7px;border-radius:99px;background:#ffc700;animation:emb var(--t) var(--d) ease-out infinite}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 14px 16px;border-radius:18px;border:2px solid;cursor:pointer;text-align:left;font-family:Onest,sans-serif;transition:background .15s,border-color .15s,color .15s,transform .08s}
.tile:active{transform:translateY(3px)}
.badge{position:absolute;right:10px;top:10px;width:24px;height:24px;border-radius:99px;background:#c2410c;display:flex;align-items:center;justify-content:center}
@keyframes chk{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:none}}
.chk{animation:chk .3s cubic-bezier(.2,.9,.3,1.3) both}
.dot{aspect-ratio:1;border-radius:999px;transition:background .25s, transform .25s}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
</style>
</helmet>
<div class="app">
  <div style="display: flex; align-items: center; gap: 8px; padding: 52px 16px 0 6px">
    <a class="iconbtn" href="Goal-pick.dc.html" aria-label="Назад"><svg class="ico" viewBox="0 0 24 24" style="width: 26px; height: 26px"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div class="bar" role="progressbar" aria-label="Шаг 3 из 4" aria-valuemin="0" aria-valuemax="4" aria-valuenow="3"><div class="fill"></div></div>
  </div>

  <div style="text-align: center; padding: 14px 24px 0">
    <div style="position: relative; display: inline-flex; align-items: flex-end; justify-content: center; width: 180px; height: 150px">
      <sc-for list="{{embers}}" as="e" hint-placeholder-count="0"><span class="emb" style="{{e.style}}" aria-hidden="true"></span></sc-for>
      <div class="flick"><svg viewBox="0 0 24 24" width="{{flame}}" height="{{flame}}" aria-hidden="true" style="transition: width .35s cubic-bezier(.2,.9,.3,1.3), height .35s cubic-bezier(.2,.9,.3,1.3); display: block"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z" fill="#ff9500"></path><path d="M12 12c.6 2 3 3 3 5.5a3 3 0 0 1-6 0c0-1.5 1-2.5 1.5-3.5.2 1 .7 1.5 1.2 1.5 0-1.5-.4-2.5.3-3.5z" fill="#ffc700"></path></svg></div>
    </div>
    <h1 class="disp" style="margin: 6px 0 0; font-size: 23px; line-height: 1.2; font-weight: 900">Сколько дней подряд берёшь на себя?</h1>
    <p class="muted" style="margin: 8px 0 0; font-size: 15px; color: rgba(26,26,26,.68)">Кто ставит цель, занимается в 3 раза чаще</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 18px 20px 0" role="radiogroup" aria-label="Цель стрика">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
      <button class="tile rise" type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="{{o.style}}">
        <sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><span class="badge"><svg class="chk" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12l5 5L20 7" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></sc-if>
        <span class="disp" style="font-size: 32px; font-weight: 900; line-height: 1">{{o.n}}</span>
        <span style="font-size: 14px; font-weight: 700">дней · {{o.word}}</span>
      </button>
    </sc-for>
  </div>

  <div style="margin: 14px 20px 0; padding: 14px 16px; border-radius: 18px; background: #fff; border: 2px solid rgba(26,26,26,.12)">
    <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700"><span>Твоя серия</span><span style="color: #c2410c">{{chosen}}</span></div>
    <div style="display: grid; grid-template-columns: repeat(25, minmax(0, 1fr)); gap: 4px; margin-top: 10px" aria-hidden="true">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="50"><span class="dot" style="{{d}}"></span></sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; font-weight: 600; color: rgba(26,26,26,.68)">
      <svg viewBox="0 0 120 100" width="24" height="20" aria-hidden="true"><rect x="10" y="40" width="100" height="54" rx="10" fill="#c2410c"></rect><path d="M10 46 Q60 6 110 46 V52 H10z" fill="#ff9500"></path><rect x="50" y="44" width="20" height="24" rx="5" fill="#ffc700"></rect></svg>
      {{reward}}
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px">
    <a class="btn b-ember" href="First-text.dc.html">Беру обязательство: {{chosen}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0 };
  }
  renderVals() {
    const data = [[7, 'хороший старт', 'Сундук за первую неделю'], [14, 'уже привычка', 'Сундук и бейдж «Две недели»'], [30, 'серьёзно', 'Сундук, бейдж и рамка аватара'], [50, 'железная воля', 'Всё выше и золотой огонёк']];
    const i = this.state.i;
    const n = data[i][0];
    let s = 9;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const embers = [];
    const cnt = 4 + i * 3;
    for (let k = 0; k < cnt; k++) embers.push({ style: '--dx:' + Math.round(r() * 90 - 45) + 'px;--t:' + (1.4 + r()).toFixed(2) + 's;--d:' + (-r() * 2).toFixed(2) + 's;margin-left:' + Math.round(r() * 40 - 24) + 'px' });
    const dots = [];
    for (let k = 0; k < 50; k++) {
      if (k < n) dots.push('background: ' + (k % 7 === 6 ? '#c2410c' : '#ff9500') + '; transition-delay: ' + (k * 0.012).toFixed(3) + 's');
      else dots.push('background: #ece6db');
    }
    return {
      flame: [92, 108, 124, 140][i],
      chosen: n + ' дней',
      reward: data[i][2],
      embers, dots,
      opts: data.map((d, k) => {
        const on = k === i;
        return {
          n: d[0], word: d[1], on,
          checked: on ? 'true' : 'false',
          style: (on ? 'border-color: #ff9500; background: #ffe8c2; color: #9a330a; box-shadow: inset 0 -5px 0 0 #ff9500;' : 'border-color: rgba(26,26,26,.15); background: #fff; color: #1a1a1a; box-shadow: inset 0 -5px 0 0 rgba(26,26,26,.08);') + 'animation-delay:' + (0.1 + k * 0.06).toFixed(2) + 's',
          pick: () => this.setState({ i: k })
        };
      })
    };
  }
}
</script>
</body>
</html>
