<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Запуск</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;family=Source+Serif+4:opsz,wght@8..60,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#fff}a:hover{color:#fff1b8}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#2b820f;color:#fff;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:54px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-white{--f:#fff;--e:#cdeeb0;--l:#166534}
.b-out{--f:transparent;--e:rgba(255,255,255,.0);--l:#fff;border:2px solid rgba(255,255,255,.55);box-shadow:none;min-height:50px;padding:12px 20px}
@keyframes drop{0%{transform:translateY(-420px) scaleY(1.15)}55%{transform:translateY(0) scaleY(1)}65%{transform:translateY(0) scale(1.18,.78)}78%{transform:translateY(-34px) scale(.95,1.06)}90%{transform:translateY(0) scale(1.05,.95)}100%{transform:none}}
.drop{animation:drop 1.1s .15s cubic-bezier(.4,0,.2,1) both;transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03,.97)}}
.breathe{animation:breathe 2.6s 1.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.eye{animation:blink 3.4s 1.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.3);opacity:.6}100%{transform:scale(2.6);opacity:0}}
.rip{position:absolute;left:50%;bottom:-6px;width:150px;height:36px;margin-left:-75px;border-radius:50%;border:3px solid #cdeeb0;animation:rip 1.6s .75s ease-out both}
@keyframes lt{0%{transform:translateY(40px) scale(.6);opacity:0}60%{transform:translateY(-8px) scale(1.08);opacity:1}100%{transform:none;opacity:1}}
.lt{display:inline-block;animation:lt .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes orbit{0%{transform:translate(var(--x0),var(--y0)) scale(.4);opacity:0}25%{opacity:1}100%{transform:translate(var(--x1),var(--y1)) scale(1);opacity:1}}
@keyframes hover{0%,100%{translate:0 0}50%{translate:0 -7px}}
.word{position:absolute;left:50%;top:50%;white-space:nowrap;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.22);font:600 15px/1 'Source Serif 4',Georgia,serif;animation:orbit .8s var(--d) cubic-bezier(.2,.9,.3,1.1) both, hover 3s calc(var(--d) + .8s) ease-in-out infinite}
.word b{font:700 11px/1 Onest,sans-serif;opacity:.7;margin-left:6px;letter-spacing:.04em}
@keyframes load{from{width:0}to{width:100%}}
.loadbar{height:100%;border-radius:99px;background:#fff;animation:load 1.6s .4s cubic-bezier(.6,0,.3,1) both}
@keyframes fadeout{to{opacity:0;height:0;margin:0}}
.loadwrap{animation:fadeout .3s 2.05s ease-in forwards}
</style>
</helmet>
<div class="app">
  <div aria-hidden="true" style="position: absolute; width: 560px; height: 560px; border-radius: 999px; background: #1c540a; opacity: .35; left: -280px; bottom: -230px"></div>
  <div aria-hidden="true" style="position: absolute; width: 320px; height: 320px; border-radius: 999px; background: #1c540a; opacity: .3; right: -160px; top: -100px"></div>

  <div style="position: absolute; left: 0; right: 0; top: 150px; height: 300px">
    <sc-for list="{{words}}" as="w" hint-placeholder-count="0">
      <span class="word" style="{{w.style}}" aria-hidden="true">{{w.t}}<b>{{w.l}}</b></span>
    </sc-for>
    <div style="position: absolute; left: 0; right: 0; bottom: 30px; display: flex; justify-content: center">
      <span class="rip" aria-hidden="true"></span>
      <div class="drop"><div class="breathe">
        <svg viewBox="0 0 128 150" width="160" height="188" aria-hidden="true"><ellipse cx="64" cy="128" rx="34" ry="9" fill="rgba(0,0,0,0.18)"></ellipse><path d="M64 8C78 26 100 44 92 72C87 92 66 104 48 90C32 78 32 54 48 40C58 31 60 20 64 8Z" fill="#cdeeb0"></path><path d="M60 46C70 58 76 68 68 82C63 90 50 90 44 81C39 73 43 61 51 53C55 50 57 48 60 46Z" fill="#fff" opacity="0.95"></path><ellipse class="eye" cx="54" cy="62" rx="3.4" ry="4.6" fill="#1c540a"></ellipse><ellipse class="eye" cx="66" cy="62" rx="3.4" ry="4.6" fill="#1c540a"></ellipse><path d="M54 72q6 5 12 0" fill="none" stroke="#1c540a" stroke-width="2.4" stroke-linecap="round"></path><ellipse cx="90" cy="100" rx="19" ry="12" fill="#ff9500" transform="rotate(-28 90 100)"></ellipse><ellipse cx="94" cy="96" rx="8" ry="5" fill="#ffc700" transform="rotate(-28 94 96)"></ellipse></svg>
      </div></div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 470px; text-align: center">
    <div class="disp" style="font-size: 40px; font-weight: 900; letter-spacing: -.01em" aria-label="LexReader">
      <sc-for list="{{letters}}" as="c" hint-placeholder-count="9"><span class="lt" aria-hidden="true" style="{{c.style}}">{{c.ch}}</span></sc-for>
    </div>
    <div class="rise" style="font-size: 17px; font-weight: 600; margin-top: 12px; opacity: .92; animation-delay: 1.6s">Учи язык, читая то, что любишь</div>
    <div class="loadwrap" style="width: 120px; height: 6px; margin: 26px auto 0; border-radius: 99px; background: rgba(255,255,255,.22); overflow: hidden" aria-hidden="true"><div class="loadbar"></div></div>
  </div>

  <div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 38px; display: flex; flex-direction: column; gap: 10px; animation-delay: 2.2s">
    <a class="btn b-white" href="Goal-pick.dc.html">Начать бесплатно</a>
    <a class="btn b-out" href="Main.dc.html">У меня уже есть аккаунт</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ws = [['reading', 'EN', -150, -120], ['lesen', 'DE', 70, -135], ['leer', 'ES', -165, -20], ['leggere', 'IT', 72, -45], ['читать', 'RU', -180, 70], ['lire', 'FR', 108, 75]];
    const words = ws.map((w, i) => ({
      t: w[0], l: w[1],
      style: '--x0:-50%;--y0:40px;--x1:' + w[2] + 'px;--y1:' + w[3] + 'px;--d:' + (1.05 + i * 0.09).toFixed(2) + 's'
    }));
    const letters = 'LexReader'.split('').map((ch, i) => ({ ch, style: 'animation-delay:' + (0.95 + i * 0.05).toFixed(2) + 's' + (i >= 3 ? ';color:#fff1b8' : '') }));
    return { words, letters };
  }
}
</script>
</body>
</html>
