<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Цель дня выполнена</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#166534}a:hover{color:#123706}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#f5f1ea;color:#1a1a1a;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-leaf{--f:#2b820f;--e:#1c540a;--l:#fff}
.card{background:#fff;border:2px solid rgba(26,26,26,.18);border-radius:20px}
.muted{color:rgba(26,26,26,.68)}
@keyframes pop{0%{transform:scale(0)}65%{transform:scale(1.25)}100%{transform:scale(1)}}
.pop{animation:pop .45s 1.55s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes ringpulse{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.ringpulse{animation:ringpulse .5s 1.55s ease-out both}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.2);opacity:1}75%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
.cf{position:absolute;left:0;top:0;animation:burst var(--t) var(--d) cubic-bezier(.1,.7,.3,1) both}
.dg{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600}
@keyframes dpop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:none}}
.dpop{animation:dpop .4s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes check{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.chk{stroke-dasharray:24;animation:check .35s 1.75s ease-out both}
</style>
</helmet>
<div class="app">

<div style="position: relative; height: 330px; margin-top: 70px; display: flex; align-items: center; justify-content: center">
  <div style="position: absolute; left: 50%; top: 50%; width: 0; height: 0">
    <sc-for list="{{cf}}" as="c" hint-placeholder-count="0"><span class="cf" style="{{c.style}}"></span></sc-for>
  </div>
  <div class="ringpulse">
    <svg viewBox="0 0 220 220" width="240" height="240" role="img" aria-label="Цель дня: 50 из 50 XP">
      <circle cx="110" cy="110" r="90" fill="none" stroke="#fff1b8" stroke-width="22"></circle>
      <circle cx="110" cy="110" r="90" fill="none" stroke="#ffc700" stroke-width="22" stroke-linecap="round" stroke-dasharray="565.5" stroke-dashoffset="{{offset}}" transform="rotate(-90 110 110)"></circle>
      <circle cx="110" cy="110" r="96" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="4" stroke-linecap="round" stroke-dasharray="603.2" stroke-dashoffset="{{offset2}}" transform="rotate(-90 110 110)"></circle>
    </svg>
  </div>
  <div style="position: absolute; text-align: center">
    <div class="pop" style="width: 64px; height: 64px; border-radius: 999px; background: #2b820f; box-shadow: inset 0 -5px 0 0 #1c540a; display: flex; align-items: center; justify-content: center; margin: 0 auto">
      <svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true" style="fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round"><path class="chk" d="M5 12l5 5L20 7"></path></svg>
    </div>
    <div class="disp" style="font-size: 26px; font-weight: 900; margin-top: 8px; color: #7a5900">{{xp}}/50</div>
    <div class="muted" style="font-size: 13px; font-weight: 600">XP сегодня</div>
  </div>
</div>

<div style="text-align: center; padding: 0 28px">
  <h1 class="disp rise" style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 900; animation-delay: 1.6s">Цель дня выполнена!</h1>
  <p class="muted rise" style="margin: 10px 0 0; font-size: 16px; animation-delay: 1.75s">Завтра цель та же: 50 XP, около 10 минут</p>
</div>

<div class="card rise" style="margin: 24px 20px 0; padding: 14px 16px; animation-delay: 1.9s">
  <div style="font-weight: 700; font-size: 14px">Цель выполнена 4 дня из 4 на этой неделе</div>
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 12px">
    <div class="dg"><svg class="dpop" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" style="animation-delay: 2.05s"><circle cx="12" cy="12" r="10" fill="#ffc700"></circle><path d="M7.5 12l3 3 6-6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg><span class="muted">Пн</span></div>
    <div class="dg"><svg class="dpop" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" style="animation-delay: 2.13s"><circle cx="12" cy="12" r="10" fill="#ffc700"></circle><path d="M7.5 12l3 3 6-6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg><span class="muted">Вт</span></div>
    <div class="dg"><svg class="dpop" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" style="animation-delay: 2.21s"><circle cx="12" cy="12" r="10" fill="#ffc700"></circle><path d="M7.5 12l3 3 6-6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg><span class="muted">Ср</span></div>
    <div class="dg"><svg class="dpop" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" style="animation-delay: 2.4s"><circle cx="12" cy="12" r="11" fill="#ff9500"></circle><path d="M7.5 12l3 3 6-6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="color: #7a5900; font-weight: 700">Чт</span></div>
    <div class="dg"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#ece6db" stroke-width="3"></circle></svg><span class="muted">Пт</span></div>
    <div class="dg"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#ece6db" stroke-width="3"></circle></svg><span class="muted">Сб</span></div>
    <div class="dg"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#ece6db" stroke-width="3"></circle></svg><span class="muted">Вс</span></div>
  </div>
</div>

<div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px; animation-delay: 2.4s">
  <a class="btn b-leaf" href="Streak-up.dc.html">Продолжить</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.s = Date.now();
    this.iv = setInterval(() => { this.forceUpdate(); if (Date.now() - this.s > 1800) clearInterval(this.iv); }, 30);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const p = this.s ? Math.min(1, Math.max(0, (Date.now() - this.s - 200) / 1300)) : 0;
    const e = 1 - Math.pow(1 - p, 3);
    let s = 9;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cols = ['#ffc700', '#2b820f', '#1cb0f6', '#ff9500', '#df2d2d'];
    const cf = [];
    for (let i = 0; i < 28; i++) {
      const a = r() * Math.PI * 2;
      const d = 140 + r() * 100;
      const w = 6 + Math.round(r() * 6);
      cf.push({ style: 'width:' + w + 'px;height:' + (r() < .5 ? w : w * 2) + 'px;background:' + cols[i % 5] + ';border-radius:' + (r() < .3 ? '99px' : '2px') + ';--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d + 40) + 'px;--r:' + Math.round(r() * 720 - 360) + 'deg;--d:' + (1.5 + r() * 0.15).toFixed(2) + 's;--t:' + (1.2 + r() * 0.8).toFixed(2) + 's' });
    }
    return { cf, offset: (565.5 * (1 - e)).toFixed(1), offset2: (603.2 * (1 - e)).toFixed(1), xp: Math.round(e * 50) };
  }
}
</script>
</body>
</html>
