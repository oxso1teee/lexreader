<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Вернуть стрик</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#166534}a:hover{color:#123706}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#f5f1ea;color:#1a1a1a;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-ember{--f:#c2410c;--e:#9a330a;--l:#fff}
.card{background:#fff;border:2px solid rgba(26,26,26,.18);border-radius:20px}
.muted{color:rgba(26,26,26,.68)}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:.7}100%{transform:translate(var(--dx),-90px) scale(1.6);opacity:0}}
.smoke{position:absolute;left:50%;top:20px;width:26px;height:26px;margin-left:-13px;border-radius:999px;background:#d6cfc3;animation:smoke 2.6s ease-out infinite}
@keyframes ember{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
.ember{animation:ember 1.4s ease-in-out infinite;transform-origin:12px 18px}
@keyframes glowe{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.45;transform:scale(1)}}
.glowe{animation:glowe 1.4s ease-in-out infinite}
@keyframes sink{0%{transform:translateY(-30px) scale(1.1);filter:none}100%{transform:none;filter:grayscale(1)}}
.sink{animation:sink .9s cubic-bezier(.3,.7,.4,1) both}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,149,0,.5)}100%{box-shadow:0 0 0 14px rgba(255,149,0,0)}}
.ring{animation:ring 1.4s 1.3s ease-out infinite}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.draw{transform-origin:0 50%;animation:draw .4s ease-out both}
.step{flex:1;text-align:center}
.dot{width:50px;height:50px;border-radius:999px;margin:0 auto;display:flex;align-items:center;justify-content:center;font:700 16px/1 Unbounded,sans-serif}
.link2{display:block;text-align:center;font:600 15px/1 Onest,sans-serif;color:rgba(26,26,26,.68);padding:16px 0 0;text-decoration:underline}
</style>
</helmet>
<div class="app">
  <div style="text-align: center; padding-top: 140px">
    <div style="position: relative; display: inline-block; width: 170px; height: 180px">
      <span class="smoke" style="--dx: -14px" aria-hidden="true"></span>
      <span class="smoke" style="--dx: 10px; animation-delay: .9s" aria-hidden="true"></span>
      <span class="smoke" style="--dx: -4px; animation-delay: 1.8s" aria-hidden="true"></span>
      <div class="glowe" aria-hidden="true" style="position: absolute; left: 50%; bottom: 20px; width: 90px; height: 90px; margin-left: -45px; border-radius: 999px; background: #ff9500"></div>
      <div class="sink" style="position: absolute; left: 5px; top: 18px">
        <svg viewBox="0 0 24 24" width="160" height="160" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z" fill="#d6cfc3"></path></svg>
      </div>
      <svg viewBox="0 0 24 24" width="160" height="160" aria-hidden="true" style="position: absolute; left: 5px; top: 18px"><path class="ember" d="M12 14c.6 1.6 2.4 2.4 2.4 4.4a2.4 2.4 0 0 1-4.8 0c0-1.2.8-2 1.2-2.8.2.8.6 1.2 1 1.2 0-1.2-.3-2 .2-2.8z" fill="#ff9500"></path></svg>
    </div>
    <h1 class="disp rise" style="margin: 18px 24px 0; font-size: 26px; line-height: 1.2; font-weight: 900; animation-delay: .6s">Стрик прервался</h1>
    <p class="muted rise" style="margin: 10px 30px 0; font-size: 16px; line-height: 1.45; animation-delay: .72s">Было <b style="color: #1a1a1a">12 дней</b>. Огонёк ещё тлеет: позанимайся 3 дня подряд, и все 12 дней вернутся.</p>
  </div>

  <div class="card rise" style="margin: 26px 20px 0; padding: 16px; animation-delay: .9s">
    <div style="display: flex; align-items: flex-start; gap: 6px">
      <div class="step"><div class="dot ring" style="background: #fff; border: 3px dashed #ff9500; color: #c2410c">1</div><div style="font-size: 13px; font-weight: 700; margin-top: 6px; color: #c2410c">Сегодня</div></div>
      <div class="draw" style="flex: 0 0 24px; height: 3px; background: #ece6db; margin-top: 25px; border-radius: 9px; animation-delay: 1.05s"></div>
      <div class="step"><div class="dot" style="background: #ece6db; color: rgba(26,26,26,.5)">2</div><div class="muted" style="font-size: 13px; font-weight: 600; margin-top: 6px">Завтра</div></div>
      <div class="draw" style="flex: 0 0 24px; height: 3px; background: #ece6db; margin-top: 25px; border-radius: 9px; animation-delay: 1.15s"></div>
      <div class="step"><div class="dot" style="background: #ece6db"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z" fill="rgba(26,26,26,.35)"></path></svg></div><div class="muted" style="font-size: 13px; font-weight: 600; margin-top: 6px">Снова 12</div></div>
    </div>
  </div>

  <div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 30px; animation-delay: 1.3s">
    <a class="btn b-ember" href="Lesson-start.dc.html">Вернуть стрик · день 1</a>
    <a class="link2" href="Main.dc.html">Начать новую серию</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
