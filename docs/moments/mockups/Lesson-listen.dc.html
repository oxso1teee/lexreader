<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Занятие: на слух</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#166534}a:hover{color:#123706}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#f5f1ea;color:#1a1a1a;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l)}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-leaf{--f:#2b820f;--e:#1c540a;--l:#fff}
.b-ghost{--f:#ece6db;--e:#c9c2b6;--l:#1a1a1a}
.muted{color:rgba(26,26,26,.68)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:none;border-radius:12px;color:rgba(26,26,26,.68);cursor:pointer;text-decoration:none}
.bar{flex:1;height:16px;border-radius:99px;background:#ece6db;overflow:hidden}
.fill{height:100%;border-radius:99px;background:#2b820f;box-shadow:inset 0 -4px 0 0 rgba(0,0,0,.12);position:relative}
.fill::after{content:"";position:absolute;left:10px;right:10px;top:3px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
@keyframes wave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.wv{display:block;width:5px;border-radius:3px;background:#fff;animation:wave 1s ease-in-out infinite}
@keyframes blink{50%{opacity:0}}
.caret{display:inline-block;width:2px;height:22px;background:#2b820f;vertical-align:-4px;margin-left:1px;animation:blink 1s step-end infinite}
</style>
</helmet>
<div class="app">

<div style="display: flex; align-items: center; gap: 10px; padding: 52px 12px 0 8px">
  <a class="iconbtn" href="Main.dc.html" aria-label="Закрыть занятие"><svg class="ico" viewBox="0 0 24 24" style="width: 26px; height: 26px"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
  <div class="bar" role="progressbar" aria-label="Прогресс занятия" aria-valuemin="0" aria-valuemax="12" aria-valuenow="11"><div class="fill" style="width: 88%"></div></div>
  <div style="display: flex; align-items: center; gap: 4px; font-weight: 700; color: #c2410c; font-size: 15px; padding-right: 6px">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z" fill="#ff9500"></path></svg>6
  </div>
</div>

<div style="padding: 26px 20px 0">
  <div style="font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #0c7c9c">Аудирование · задание 11 из 12</div>
  <h1 class="disp" style="margin: 8px 0 0; font-size: 22px; line-height: 1.25; font-weight: 700">Напиши, что услышишь</h1>

  <div style="display: flex; gap: 14px; justify-content: center; align-items: center; margin-top: 34px">
    <button type="button" aria-label="Прослушать" style="width: 132px; height: 132px; border-radius: 32px; border: 0; background: #0b79b0; box-shadow: inset 0 -8px 0 0 #075a85; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; padding-bottom: 8px">
      <span class="wv" style="height: 26px"></span><span class="wv" style="height: 44px; animation-delay: .15s"></span><span class="wv" style="height: 58px; animation-delay: .3s"></span><span class="wv" style="height: 40px; animation-delay: .45s"></span><span class="wv" style="height: 24px; animation-delay: .6s"></span>
    </button>
    <button type="button" aria-label="Прослушать медленно" style="width: 76px; height: 76px; border-radius: 22px; border: 2px solid rgba(26,26,26,.18); background: #fff; box-shadow: inset 0 -4px 0 0 rgba(26,26,26,.12); color: #0c7c9c; font: 700 17px/1 Onest, sans-serif; cursor: pointer">0.5×</button>
  </div>

  <label for="ans" class="muted" style="display: block; font-size: 13px; font-weight: 600; margin-top: 34px">Твой ответ</label>
  <div style="margin-top: 8px; min-height: 150px; border-radius: 20px; background: #fff; border: 2px solid #2b820f; box-shadow: 0 0 0 4px #e3f6d3; padding: 16px; font-size: 20px; line-height: 1.4">
    <span id="ans">She was reluctant to</span><span class="caret"></span>
  </div>
  <div class="muted" style="font-size: 13px; margin-top: 10px">Регистр и знаки препинания не важны</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px; border-top: 2px solid rgba(26,26,26,.1); display: flex; gap: 12px">
  <a class="btn b-ghost" href="Result.dc.html" style="flex: 0 0 auto; padding-left: 18px; padding-right: 18px">Не могу слушать</a>
  <a class="btn b-leaf" href="Result.dc.html" style="flex: 1">Проверить</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
