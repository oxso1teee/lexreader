<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Победа в дуэли</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#fff}a:hover{color:#fff1b8}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#0b79b0;color:#fff;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:54px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-white{--f:#fff;--e:#bfe6fb;--l:#075a85}
.b-ghost{--f:rgba(255,255,255,.14);--e:rgba(0,0,0,.18);--l:#fff}
@keyframes inL{0%{transform:translateX(-200px)}70%{transform:translateX(10px)}100%{transform:none}}
@keyframes inR{0%{transform:translateX(200px)}70%{transform:translateX(-10px)}100%{transform:none}}
.inL{animation:inL .5s .1s cubic-bezier(.2,.9,.3,1.1) both}
.inR{animation:inR .5s .1s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes clash{0%{transform:scale(0) rotate(-30deg);opacity:0}60%{transform:scale(1.4) rotate(8deg);opacity:1}100%{transform:none;opacity:1}}
.clash{animation:clash .4s .55s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes crown{0%{transform:translateY(-140px) rotate(-30deg);opacity:0}60%{transform:translateY(6px) rotate(6deg);opacity:1}80%{transform:translateY(-4px)}100%{transform:none;opacity:1}}
.crown{animation:crown .6s 2.1s cubic-bezier(.3,.7,.4,1) both}
@keyframes win{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.winner{animation:win .5s 2.1s ease-in-out 2}
@keyframes sadden{to{filter:grayscale(.6);opacity:.75;transform:scale(.92)}}
.loser{animation:sadden .4s 2.1s ease-out both}
.av{width:86px;height:86px;border-radius:999px;display:flex;align-items:center;justify-content:center;font:900 34px/1 Unbounded,sans-serif;border:4px solid #fff}
.col{width:100%;border-radius:14px 14px 6px 6px;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font:900 26px/1 Unbounded,sans-serif;transition:height .05s linear}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.2);opacity:1}75%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
.cf{position:absolute;left:0;top:0;animation:burst var(--t) var(--d) cubic-bezier(.1,.7,.3,1) both}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;font-weight:700;font-size:15px}
</style>
</helmet>
<div class="app">
  <div aria-hidden="true" style="position: absolute; width: 480px; height: 480px; border-radius: 999px; background: #075a85; opacity: .5; left: -45px; top: 30px"></div>

  <div class="rise" style="position: relative; text-align: center; padding-top: 64px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #bfe6fb">Дуэль · 10 заданий</div>

  <div style="position: relative; display: flex; align-items: flex-end; gap: 22px; padding: 26px 40px 0; height: 400px">
    <div style="position: absolute; left: 50%; top: 120px; width: 0; height: 0">
      <sc-for list="{{cf}}" as="c" hint-placeholder-count="0"><span class="cf" style="{{c.style}}"></span></sc-for>
    </div>
    <div class="inL" style="flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end">
      <svg class="crown" viewBox="0 0 128 60" width="56" height="26" aria-hidden="true" style="margin-bottom: 4px"><path d="M10 56 L18 12 L42 36 L64 4 L86 36 L110 12 L118 56 Z" fill="#ffc700" stroke="#7a5900" stroke-width="6" stroke-linejoin="round"></path></svg>
      <div class="av winner" style="background: #2b820f">С</div>
      <div style="font-weight: 700; font-size: 16px; margin: 8px 0 10px">Ты</div>
      <div class="col" style="height: {{hMe}}px; background: #ffc700; color: #4d3800; box-shadow: inset 0 -6px 0 0 #e0a500">{{me}}</div>
    </div>
    <div class="clash disp" style="position: absolute; left: 50%; top: 150px; width: 54px; height: 54px; margin-left: -27px; border-radius: 999px; background: #fff; color: #075a85; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 900">VS</div>
    <div class="inR" style="flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end">
      <div class="av loser" style="background: #8b5cf6">А</div>
      <div style="font-weight: 700; font-size: 16px; margin: 8px 0 10px">Аня</div>
      <div class="col" style="height: {{hHer}}px; background: rgba(255,255,255,.22); color: #fff">{{her}}</div>
    </div>
  </div>

  <div style="position: relative; text-align: center; padding: 22px 24px 0">
    <h1 class="disp rise" style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 900; animation-delay: 2.2s">Победа!</h1>
    <p class="rise" style="margin: 8px 0 0; font-size: 16px; opacity: .92; animation-delay: 2.3s">10 из 10 и на 18 секунд быстрее</p>
    <div class="rise" style="display: flex; gap: 8px; justify-content: center; margin-top: 16px; animation-delay: 2.45s">
      <span class="chip" style="background: #ffc700; color: #4d3800">+{{xp}} XP</span>
      <span class="chip" style="background: rgba(255,255,255,.16)">3 победы подряд</span>
    </div>
  </div>

  <div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px; display: flex; gap: 12px; animation-delay: 2.7s">
    <a class="btn b-ghost" href="Duel-invite.dc.html" style="flex: 0 0 auto; width: auto; padding-left: 18px; padding-right: 18px">Реванш</a>
    <a class="btn b-white" href="Main.dc.html" style="flex: 1">Забрать награду</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = Date.now();
    this.iv = setInterval(() => { this.forceUpdate(); if (Date.now() - this.t0 > 3400) clearInterval(this.iv); }, 33);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const el = this.t0 ? Date.now() - this.t0 : 0;
    const p = Math.min(1, Math.max(0, (el - 800) / 1200));
    const e = 1 - Math.pow(1 - p, 2);
    const q = Math.min(1, Math.max(0, (el - 2450) / 700));
    const me = Math.round(e * 10);
    const her = Math.min(7, Math.round(e * 10));
    let s = 41;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cols = ['#ffc700', '#fff', '#2b820f', '#ff9500', '#bfe6fb'];
    const cf = [];
    for (let i = 0; i < 30; i++) {
      const a = r() * Math.PI * 2;
      const d = 120 + r() * 120;
      const w = 6 + Math.round(r() * 5);
      cf.push({ style: 'width:' + w + 'px;height:' + (r() < .5 ? w : w * 2) + 'px;background:' + cols[i % 5] + ';border-radius:' + (r() < .3 ? '99px' : '2px') + ';--dx:' + Math.round(Math.cos(a) * d - 70) + 'px;--dy:' + Math.round(Math.sin(a) * d) + 'px;--r:' + Math.round(r() * 720 - 360) + 'deg;--d:' + (2.1 + r() * 0.15).toFixed(2) + 's;--t:' + (1.2 + r() * 0.7).toFixed(2) + 's' });
    }
    return { me, her, hMe: 40 + me * 13, hHer: 40 + her * 13, xp: Math.round((1 - Math.pow(1 - q, 3)) * 25), cf };
  }
}
</script>
</body>
</html>
