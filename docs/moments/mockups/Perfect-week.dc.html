<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LexReader — Идеальная неделя</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;family=Unbounded:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4da}
a{color:#166534}a:hover{color:#123706}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#f5f1ea;color:#1a1a1a;font-family:Onest,system-ui,sans-serif;box-sizing:border-box}
.app *{box-sizing:border-box}
.disp{font-family:Unbounded,Onest,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;font:700 16px/1.2 Onest,sans-serif;text-decoration:none;cursor:pointer;min-height:52px;padding:14px 20px 18px;box-shadow:inset 0 -4px 0 0 var(--e);background:var(--f);color:var(--l);width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b-ember{--f:#c2410c;--e:#9a330a;--l:#fff}
.card{background:#fff;border:2px solid rgba(26,26,26,.18);border-radius:20px}
.muted{color:rgba(26,26,26,.68)}
@keyframes halo{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.halo{animation:halo .7s .2s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 10s linear infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.08) rotate(3deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-origin:50% 90%}
@keyframes grow{from{width:0}to{width:100%}}
.grow{animation:grow 1.4s .7s cubic-bezier(.4,0,.2,1) both}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes lit{0%{color:rgba(26,26,26,.5)}100%{color:#c2410c}}
.lit{animation:lit .2s both}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.2);opacity:1}75%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
.cf{position:absolute;left:0;top:0;animation:burst var(--t) var(--d) cubic-bezier(.1,.7,.3,1) both}
</style>
</helmet>
<div class="app">
  <div style="text-align: center; padding-top: 96px">
    <div style="position: relative; display: inline-block; width: 230px; height: 230px">
      <div class="halo" style="position: absolute; inset: 0">
        <svg class="spin" viewBox="0 0 230 230" width="230" height="230" aria-hidden="true"><circle cx="115" cy="115" r="100" fill="none" stroke="#ffc700" stroke-width="12" stroke-dasharray="20 14" stroke-linecap="round"></circle></svg>
      </div>
      <div style="position: absolute; inset: 30px; border-radius: 999px; background: #fff1b8"></div>
      <div class="flick" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 24 24" width="130" height="130" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z" fill="#ff9500"></path><path d="M12 12c.6 2 3 3 3 5.5a3 3 0 0 1-6 0c0-1.5 1-2.5 1.5-3.5.2 1 .7 1.5 1.2 1.5 0-1.5-.4-2.5.3-3.5z" fill="#ffc700"></path></svg>
      </div>
      <div style="position: absolute; left: 50%; top: 50%; width: 0; height: 0">
        <sc-for list="{{cf}}" as="c" hint-placeholder-count="0"><span class="cf" style="{{c.style}}"></span></sc-for>
      </div>
    </div>
    <h1 class="disp rise" style="margin: 18px 24px 0; font-size: 28px; line-height: 1.15; font-weight: 900; animation-delay: 2s">Идеальная неделя!</h1>
    <p class="muted rise" style="margin: 10px 30px 0; font-size: 16px; animation-delay: 2.1s">7 дней из 7, ни одной заморозки</p>
  </div>

  <div class="card rise" style="margin: 26px 20px 0; padding: 16px; animation-delay: .5s">
    <div style="position: relative; height: 40px; border-radius: 99px; background: #ece6db; overflow: hidden">
      <div class="grow" style="position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: #ff9500; box-shadow: inset 0 -5px 0 0 #db7a00"></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; font-weight: 700; margin-top: 8px">
      <span class="lit" style="animation-delay: .8s">Пн</span><span class="lit" style="animation-delay: 1s">Вт</span><span class="lit" style="animation-delay: 1.2s">Ср</span><span class="lit" style="animation-delay: 1.4s">Чт</span><span class="lit" style="animation-delay: 1.6s">Пт</span><span class="lit" style="animation-delay: 1.8s">Сб</span><span class="lit" style="animation-delay: 2s">Вс</span>
    </div>
  </div>

  <div class="rise" style="margin: 12px 20px 0; border-radius: 18px; background: #fff1b8; padding: 12px 16px; display: flex; align-items: center; gap: 12px; animation-delay: 2.3s">
    <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="#ffc700" stroke="#e0a500" stroke-width="1.5" stroke-linejoin="round"></path></svg>
    <div style="font-size: 15px; font-weight: 700; color: #7a5900">+{{xp}} XP за идеальную неделю</div>
  </div>

  <div class="rise" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px; animation-delay: 2.6s">
    <a class="btn b-ember" href="Main.dc.html">Новая неделя, вперёд</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = Date.now();
    this.ivx = setInterval(() => { this.forceUpdate(); if (Date.now() - this.t0 > 3200) clearInterval(this.ivx); }, 33);
  }
  componentWillUnmount() { clearInterval(this.ivx); }
  cu(to, delay, dur) {
    const el = this.t0 ? Date.now() - this.t0 : 0;
    const p = Math.min(1, Math.max(0, (el - delay) / dur));
    return Math.round(to * (1 - Math.pow(1 - p, 3)));
  }
  renderVals() {
    let s = 41;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cols = ['#ffc700', '#ff9500', '#2b820f', '#1cb0f6'];
    const cf = [];
    for (let i = 0; i < 24; i++) {
      const a = r() * Math.PI * 2;
      const d = 120 + r() * 100;
      const w = 6 + Math.round(r() * 5);
      cf.push({ style: 'width:' + w + 'px;height:' + (r() < .5 ? w : w * 2) + 'px;background:' + cols[i % 4] + ';border-radius:' + (r() < .3 ? '99px' : '2px') + ';--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d) + 'px;--r:' + Math.round(r() * 720 - 360) + 'deg;--d:' + (2.1 + r() * 0.15).toFixed(2) + 's;--t:' + (1.2 + r() * 0.7).toFixed(2) + 's' });
    }
    return { cf, xp: this.cu(20, 2400, 700) };
  }
}
</script>
</body>
</html>
